      - kind: RAY
        vectors: [[0,1]]
        min_steps: 1
        max_steps: 1
        capture: NEVER
        relative: true
        unmoved_only: false
        creates_trail: false
        captures_trail: false
      - kind: RAY
        vectors: [[0,1]]
        min_steps: 2
        max_steps: 2
        capture: NEVER
        relative: true
        unmoved_only: true
        origins:
          white: [8,9,10,11,12,13,14,15]
          black: [48,49,50,51,52,53,54,55]
        creates_trail: true
        captures_trail: false
      - kind: OFFSET
        vectors: [[-1,1], [1,1]]
        min_steps: 1
        max_steps: 1
        capture: ONLY
        relative: true
        unmoved_only: false
        creates_trail: false
        captures_trail: true
    promotion_squares:
      white: [56,57,58,59,60,61,62,63]
      black: [0,1,2,3,4,5,6,7]
    promotion_choices: [svarcade_chess:queen, svarcade_chess:rook, svarcade_chess:bishop, svarcade_chess:knight]
