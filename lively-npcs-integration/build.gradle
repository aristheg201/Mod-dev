base {
    archivesName = 'Lively-NPCs-Integration'
}

dependencies {
    // Compile against the core project without asking Loom to remap/read a dev JAR during configuration.
    // Lively NPCs Integration remains a separate JAR and declares livelynpcs as a runtime mod dependency.
    implementation project(':lively-npcs')

    // Exact Cobblemon 1.7.3 Fabric artifact used by the server. Modrinth/Fabric Maven metadata exposes
    // transitive Fabric modules in intermediary namespace; feeding those raw into Loom's named dev
    // runtime trips Fabric Loader's class-tweaker namespace guard. Keep ecosystem mods non-transitive
    // and let the root project provide Fabric API in the namespace Loom expects.
    modCompileOnly("maven.modrinth:MdwFAVRL:kF7CvxTo") { transitive = false }
    modRuntimeOnly("maven.modrinth:MdwFAVRL:kF7CvxTo") { transitive = false }
    modRuntimeOnly("net.fabricmc:fabric-language-kotlin:1.13.9+kotlin.2.3.10") { transitive = false }

    // Cobblemon exposes Kotlin collection types in its Java-visible API. Compile only; the language
    // adapter supplies the runtime Kotlin libraries and the Integration JAR never bundles Kotlin.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}
