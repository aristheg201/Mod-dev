base {
    archivesName = 'Lively-NPCs-Integration'
}

dependencies {
    // Compile against the core project without asking Loom to remap/read a dev JAR during configuration.
    // Lively NPCs Integration remains a separate JAR and declares livelynpcs as a runtime mod dependency.
    implementation project(':lively-npcs')

    // Exact Cobblemon 1.7.3 Fabric artifact used by the server. Keep it compile-only and non-transitive.
    // Production runtime compatibility is verified by CI in a standalone Fabric server using remapped
    // Lively JARs + the real Cobblemon artifact, rather than Loom's named development namespace.
    modCompileOnly("maven.modrinth:MdwFAVRL:kF7CvxTo") { transitive = false }

    // Cobblemon exposes Kotlin collection types in its Java-visible API. Compile only; runtime Kotlin
    // comes from Cobblemon's bundled fabric-language-kotlin jar-in-jar.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}
