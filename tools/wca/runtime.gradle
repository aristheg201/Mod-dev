def loomTypes=tasks.named('remapJar').get().getClass().classLoader
sourceSets {
    wcaQa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
repositories { maven { url 'https://maven.fabricmc.net' } }
configurations { wcaRuntimeMods }
dependencies {
    wcaRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    wcaRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    wcaRuntimeMods 'com.cobblemon:fabric:1.8.1+1.21.1'
}
tasks.register('wcaQaJar',Jar) {
    dependsOn tasks.named('wcaQaClasses')
    archiveClassifier='wca-qa-dev'
    from sourceSets.wcaQa.output
}
tasks.register('remapWcaQaJar',loomTypes.loadClass('net.fabricmc.loom.task.RemapJarTask')) {
    dependsOn tasks.named('wcaQaJar')
    inputFile=tasks.named('wcaQaJar').flatMap {it.archiveFile}
    archiveClassifier='wca-qa'
}
tasks.register('runWorldComesAliveClient',loomTypes.loadClass('net.fabricmc.loom.task.prod.ClientProductionRunTask')) {
    dependsOn tasks.named('remapJar'),tasks.named('remapWcaQaJar')
    mods.setFrom(configurations.wcaRuntimeMods,tasks.named('remapJar').flatMap {it.archiveFile},tasks.named('remapWcaQaJar').flatMap {it.archiveFile})
    programArgs.addAll(['--width','1280','--height','720','--username','WcaRuntimeQA','--uuid','19daa819-9ed8-472b-a589-182b7513ca5b'])
    jvmArgs.addAll(['-Xmx5G','-Dworldcomesalive.qa=true','-Dworldcomesalive.qa.v2=true','-Dworldcomesalive.qa.seed='+System.getenv().getOrDefault('WCA_QA_SEED','414212')])
    runDir=file('run-wca')
    useXVFB=false
}
tasks.register('runWorldComesAliveServer',loomTypes.loadClass('net.fabricmc.loom.task.prod.ServerProductionRunTask')) {
    dependsOn tasks.named('remapJar')
    mods.setFrom(configurations.wcaRuntimeMods,tasks.named('remapJar').flatMap {it.archiveFile})
    jvmArgs.add('-Xmx3G')
    runDir=file('run-wca-server')
}
tasks.register('verifyWorldComesAlive') {
    group='verification'
    dependsOn tasks.named('test'),tasks.named('remapJar'),tasks.named('remapWcaQaJar')
}

// Production child JVMs honour this execution environment's proxy/CA, without disabling TLS checks.
def runtimeProxy=System.getenv('HTTPS_PROXY')
if(runtimeProxy) {
    def uri=new URI(runtimeProxy)
    tasks.withType(loomTypes.loadClass('net.fabricmc.loom.task.prod.AbstractProductionRunTask')).configureEach {
        jvmArgs.addAll(['-Dhttps.proxyHost='+uri.host,'-Dhttps.proxyPort='+uri.port,'-Dhttp.proxyHost='+uri.host,'-Dhttp.proxyPort='+uri.port])
        if(file('/etc/ssl/certs/java/cacerts').exists())jvmArgs.add('-Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts')
    }
}
