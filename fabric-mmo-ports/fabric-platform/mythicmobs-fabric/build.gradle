base { archivesName = 'MythicMobs-Fabric' }

// Build the MythicMobs runtime as one deterministic source tree. M2.0 carries
// the component registry/parser parity and M2.1 carries the Minecraft/Fabric
// execution bridge. Both must be visible to Loom/Yarn, not merged as class files
// after remapJar.
def generatedRuntimeRoot = file("$buildDir/generated/mythicmobs-runtime")
def generatedRuntime = file("$generatedRuntimeRoot/mythicmobs-runtime")
def generatedRuntimeJava = file("$generatedRuntime/src/main/java")
def m20OverlayDir = rootProject.file('../overlay-m2.0')
def m20Archive = file("$buildDir/generated/mythicmobs-m2.0.tar.gz")
def m20ExpectedSha256 = '25387d389ddc3ee0da2663071859a6199b5ceddc428070b4383b0b6ff3ed334f'

def m21OverlayDir = rootProject.file('../overlay-m2.1')
def m21GeneratedRoot = file("$buildDir/generated/m2.1-source")
def m21GeneratedJava = file("$m21GeneratedRoot/fabric-platform/mythicmobs-fabric/src/main/java")
def m21Archive = file("$buildDir/generated/m2.1-source.tar.gz")
def m21ExpectedSha256 = '4796017166c914ae52ad7f717f24a2f6c2fdacc68738e7412a72d6a40d529328'

def prepareM20Runtime = tasks.register('prepareM20Runtime') {
    inputs.dir(rootProject.file('../mythicmobs-runtime'))
    inputs.files(fileTree(m20OverlayDir) { include 'source.tar.gz.b64.part*' })
    outputs.dir(generatedRuntime)

    doLast {
        project.delete(generatedRuntimeRoot)
        generatedRuntimeRoot.mkdirs()
        copy {
            from rootProject.file('../mythicmobs-runtime')
            into generatedRuntime
        }

        def parts = fileTree(m20OverlayDir) { include 'source.tar.gz.b64.part*' }
                .files
                .toList()
                .sort { a, b -> a.name <=> b.name }
        if (parts.isEmpty()) {
            throw new GradleException("Missing MythicMobs M2.0 source overlay in ${m20OverlayDir}")
        }
        def encoded = parts.collect { it.getText('UTF-8').trim() }.join('')
        byte[] archiveBytes
        try {
            archiveBytes = java.util.Base64.decoder.decode(encoded)
        } catch (IllegalArgumentException e) {
            throw new GradleException('Invalid base64 in MythicMobs M2.0 source overlay', e)
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archiveBytes)
        def actualSha256 = new java.math.BigInteger(1, digest).toString(16).padLeft(64, '0')
        if (actualSha256 != m20ExpectedSha256) {
            throw new GradleException("MythicMobs M2.0 source checksum mismatch: ${actualSha256}")
        }
        m20Archive.parentFile.mkdirs()
        m20Archive.bytes = archiveBytes

        def extracted = file("$buildDir/generated/mythicmobs-m2.0-extracted")
        project.delete(extracted)
        copy {
            from tarTree(resources.gzip(m20Archive))
            into extracted
        }
        def overlayRuntime = new File(extracted, 'mythicmobs-runtime')
        if (!overlayRuntime.isDirectory()) {
            throw new GradleException("MythicMobs M2.0 runtime root missing: ${overlayRuntime}")
        }
        copy {
            from overlayRuntime
            into generatedRuntime
        }
        if (!generatedRuntimeJava.isDirectory()) {
            throw new GradleException("Generated MythicMobs runtime source root missing: ${generatedRuntimeJava}")
        }
    }
}

def prepareM21Sources = tasks.register('prepareM21Sources') {
    inputs.files(fileTree(m21OverlayDir) { include 'source.tar.gz.b64.part*' })
    outputs.dir(m21GeneratedRoot)

    doLast {
        def parts = fileTree(m21OverlayDir) { include 'source.tar.gz.b64.part*' }
                .files
                .toList()
                .sort { a, b -> a.name <=> b.name }
        if (parts.isEmpty()) {
            throw new GradleException("Missing MythicMobs M2.1 source overlay in ${m21OverlayDir}")
        }
        def encoded = parts.collect { it.getText('UTF-8').trim() }.join('')
        byte[] archiveBytes
        try {
            archiveBytes = java.util.Base64.decoder.decode(encoded)
        } catch (IllegalArgumentException e) {
            throw new GradleException('Invalid base64 in MythicMobs M2.1 source overlay', e)
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archiveBytes)
        def actualSha256 = new java.math.BigInteger(1, digest).toString(16).padLeft(64, '0')
        if (actualSha256 != m21ExpectedSha256) {
            throw new GradleException("MythicMobs M2.1 source checksum mismatch: ${actualSha256}")
        }
        project.delete(m21GeneratedRoot)
        m21Archive.parentFile.mkdirs()
        m21Archive.bytes = archiveBytes
        copy {
            from tarTree(resources.gzip(m21Archive))
            into m21GeneratedRoot
        }
        if (!m21GeneratedJava.isDirectory()) {
            throw new GradleException("MythicMobs M2.1 source root missing after extraction: ${m21GeneratedJava}")
        }
    }
}

// M2.1 replaces the stale Fabric entrypoint beside this build file, so compile
// only the generated module source plus the generated M2.0 runtime and common
// compatibility code.
sourceSets.main.java.setSrcDirs([
        m21GeneratedJava,
        generatedRuntimeJava,
        '../../common-runtime/src/main/java'
])
sourceSets.main.resources.srcDirs += '../../mythicmobs-runtime/src/main/resources'

tasks.named('compileJava').configure {
    dependsOn prepareM20Runtime
    dependsOn prepareM21Sources
}
tasks.named('sourcesJar').configure {
    dependsOn prepareM20Runtime
    dependsOn prepareM21Sources
}
