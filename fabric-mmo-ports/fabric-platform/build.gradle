plugins { id 'fabric-loom' version "${loom_version}" apply false }
subprojects {
    apply plugin: 'fabric-loom'
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        mavenCentral()
        maven { url='https://maven.fabricmc.net/' }
        maven { url='https://maven.nucleoid.xyz/' }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    }
    tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
    java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
}
project(':mmocore-fabric') { dependencies { implementation project(':mythiclib-fabric') } }
project(':mmoitems-fabric') {
    dependencies {
        implementation project(':mythiclib-fabric')
        modImplementation include('eu.pb4:placeholder-api:2.4.2+1.21')
    }
}
