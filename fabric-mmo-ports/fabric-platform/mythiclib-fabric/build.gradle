// V4 is the bytecode-parity foundation overlay reconstructed from the 1.7.1 JAR.
// It deliberately runs after V2/V3 and replaces matching source FQNs rather than
// compiling duplicate compatibility classes.
def legacyApiV4Parts = fileTree(file('legacy-api-v4-parity')) {
    include 'source.tar.gz.b64.part*'
}
def generatedLegacyApiV4 = layout.buildDirectory.dir('generated/legacy-api-v4-src')
def legacyApiV4Sha256 = '70651693193487fe55f136e7e41515069ca04e5c559251c3560f963410d456c5'

def unpackLegacyApiV4Sources = tasks.register('unpackLegacyApiV4Sources') {
    inputs.files(legacyApiV4Parts)
    outputs.dir(generatedLegacyApiV4)
    doLast {
        def parts = legacyApiV4Parts.files.sort { a, b -> a.name <=> b.name }
        if (parts.size() != 4) throw new GradleException("Expected 4 MythicLib V4 parity parts, got ${parts.size()}")
        byte[] archiveBytes = Base64.decoder.decode(parts.collect { it.getText('UTF-8') }.join(''))
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archiveBytes)
        def actualSha = digest.collect { String.format('%02x', it & 0xff) }.join('')
        if (actualSha != legacyApiV4Sha256) throw new GradleException("MythicLib V4 parity checksum mismatch: ${actualSha}")
        def outDir = generatedLegacyApiV4.get().asFile
        delete(outDir)
        outDir.mkdirs()
        def archive = new File(temporaryDir, 'legacy-api-v4-parity.tar.gz')
        archive.bytes = archiveBytes
        copy { from tarTree(resources.gzip(archive)); into outDir }
    }
}

def generatedLegacyApiMerged = layout.buildDirectory.dir('generated/legacy-api-merged-src')

def mergeLegacyApiSources = tasks.register('mergeLegacyApiSources') {
    dependsOn(unpackLegacyApiSources)
    dependsOn(unpackLegacyApiV3Sources)
    dependsOn(unpackLegacyApiV4Sources)
    outputs.dir(generatedLegacyApiMerged)
    doLast {
        def outDir = generatedLegacyApiMerged.get().asFile
        delete(outDir)
        outDir.mkdirs()
        [generatedLegacyApi.get().asFile, generatedLegacyApiV3.get().asFile, generatedLegacyApiV4.get().asFile].each { root ->
            fileTree(root) { include '**/*.java' }.files.sort { a, b -> a.path <=> b.path }.each { source ->
                def relative = root.toPath().relativize(source.toPath()).toString()
                def target = new File(outDir, relative)
                target.parentFile.mkdirs()
                target.bytes = source.bytes
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('../mythiclib-runtime/src/main/java')
            srcDir rootProject.file('../common-runtime/src/main/java')
            srcDir generatedLegacyApiMerged
        }
        resources {
            srcDir rootProject.file('../mythiclib-runtime/src/main/resources')
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn(syncCanonicalMythicLibRuntime)
    dependsOn(mergeLegacyApiSources)
}
tasks.named('processResources').configure { dependsOn(syncCanonicalMythicLibRuntime) }


dependencies {
    compileOnly 'net.luckperms:api:5.4'
}
