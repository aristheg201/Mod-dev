base { archivesName = 'MythicLib-Fabric' }

// Canonical native Fabric module. Shared platform-neutral MythicLib runtime is
// compiled into the same artifact. Canonical runtime sources in the repository
// replace their restored bootstrap counterparts before javac runs.
def restoredRuntime = rootProject.file('../mythiclib-runtime')
def canonicalRuntime = rootProject.file('../../../fabric-mmo-ports/mythiclib-runtime')

def syncCanonicalMythicLibRuntime = tasks.register('syncCanonicalMythicLibRuntime') {
    inputs.dir(canonicalRuntime)
    outputs.dir(restoredRuntime)
    doLast {
        if (canonicalRuntime.isDirectory()) {
            copy {
                from canonicalRuntime
                into restoredRuntime
            }
        }
    }
}

// Native io.lumine.mythic.lib.* compatibility/API base bundle.
def legacyApiParts = fileTree(file('legacy-api-source-v2')) {
    include 'source.tar.gz.b64.part*'
}
def generatedLegacyApi = layout.buildDirectory.dir('generated/legacy-api-src')
def legacyApiSha256 = '2d88eb27f876a72c71ecf67ea73a95e6bfd2fdd75abf1c64f912d26dd509fce8'

def unpackLegacyApiSources = tasks.register('unpackLegacyApiSources') {
    inputs.files(legacyApiParts)
    outputs.dir(generatedLegacyApi)
    doLast {
        def parts = legacyApiParts.files.sort { a, b -> a.name <=> b.name }
        if (parts.size() != 7) throw new GradleException("Expected 7 MythicLib legacy API source parts, got ${parts.size()}")
        byte[] archiveBytes = Base64.decoder.decode(parts.collect { it.getText('UTF-8') }.join(''))
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archiveBytes)
        def actualSha = digest.collect { String.format('%02x', it & 0xff) }.join('')
        if (actualSha != legacyApiSha256) throw new GradleException("MythicLib legacy API source checksum mismatch: ${actualSha}")
        def outDir = generatedLegacyApi.get().asFile
        delete(outDir)
        outDir.mkdirs()
        def archive = new File(temporaryDir, 'legacy-api-source.tar.gz')
        archive.bytes = archiveBytes
        copy { from tarTree(resources.gzip(archive)); into outDir }
    }
}

// V3 adds the remaining native manager/module/script/variable/skill/event surface
// without Bukkit/Paper imports. The archive is split into small verified chunks
// to keep repository transport deterministic.
def legacyApiV3Parts = fileTree(file('legacy-api-v3-fixed2')) {
    include 'source.tar.gz.b64.part*'
}
def generatedLegacyApiV3 = layout.buildDirectory.dir('generated/legacy-api-v3-src')
def legacyApiV3Sha256 = '2f1a7ca0fc23fc9f5f6cda011e880d30e0485b6b74ae954b3e1d155f5cb60ba4'

def unpackLegacyApiV3Sources = tasks.register('unpackLegacyApiV3Sources') {
    inputs.files(legacyApiV3Parts)
    outputs.dir(generatedLegacyApiV3)
    doLast {
        def parts = legacyApiV3Parts.files.sort { a, b -> a.name <=> b.name }
        if (parts.size() != 13) throw new GradleException("Expected 13 MythicLib V3 delta parts, got ${parts.size()}")
        byte[] archiveBytes = Base64.decoder.decode(parts.collect { it.getText('UTF-8') }.join(''))
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archiveBytes)
        def actualSha = digest.collect { String.format('%02x', it & 0xff) }.join('')
        if (actualSha != legacyApiV3Sha256) throw new GradleException("MythicLib V3 delta checksum mismatch: ${actualSha}")
        def outDir = generatedLegacyApiV3.get().asFile
        delete(outDir)
        outDir.mkdirs()
        def archive = new File(temporaryDir, 'legacy-api-v3-delta.tar.gz')
        archive.bytes = archiveBytes
        copy { from tarTree(resources.gzip(archive)); into outDir }

        // Java 9+ implicitly imports java.lang.Module. The V3 compatibility
        // bundle intentionally keeps the original MythicLib class name Module,
        // so wildcard module imports make those manager stubs ambiguous on Java 21.
        // Normalize only the generated manager sources; the verified archive bytes
        // remain immutable and checksum-protected.
        fileTree(outDir) { include 'io/lumine/mythic/lib/manager/*.java' }.each { source ->
            def text = source.getText('UTF-8')
            def wildcard = 'import io.lumine.mythic.lib.module.*;'
            if (text.contains(wildcard)) {
                source.setText(text.replace(wildcard,
                        'import io.lumine.mythic.lib.module.MMOPlugin;import io.lumine.mythic.lib.module.Module;'), 'UTF-8')
            }
        }

        // Adapt the V3 script/skill compatibility delta to the V2 native API base.
        // These generated sources preserve MythicLib 1.7.1 ordering: conditions are
        // evaluated by the result phase, then mechanics run during whenCast.
        def bridge = new File(outDir, 'io/lumine/mythic/lib/skill/SkillMetadataContextBridge.java')
        bridge.parentFile.mkdirs()
        bridge.setText('''package io.lumine.mythic.lib.skill;

import io.lumine.mythic.lib.skill.handler.SkillHandler;
import vn.svframe.mythiclibfabric.runtime.script.ScriptContext;

import java.util.UUID;

public final class SkillMetadataContextBridge {
    private SkillMetadataContextBridge() {}

    public static ScriptContext context(SkillMetadata metadata) {
        if (metadata == null || metadata.getCaster() == null)
            throw new IllegalArgumentException("Skill metadata/caster cannot be null");

        UUID caster = metadata.getCaster().getData().getUniqueId();
        var targetEntity = metadata.getTargetEntityOrNull();
        UUID target = targetEntity == null ? caster : targetEntity.getUniqueId();
        ScriptContext context = new ScriptContext(caster, target);

        if (metadata.getCast() != null) {
            SkillHandler<?> handler = metadata.getCast().getHandler();
            if (handler != null) for (String key : handler.getParameters()) {
                double value = metadata.getParameter(key);
                context.numbers().put(key, value);
                context.numbers().put("parameter." + key, value);
                context.numbers().put("modifier." + key, value);
                context.objects().put(key, value);
                context.objects().put("parameter." + key, value);
                context.objects().put("modifier." + key, value);
            }
        }

        if (metadata.hasAttackSource()) context.objects().put("attack", metadata.getAttackSource());
        context.objects().put("skill_metadata", metadata);
        return context;
    }
}
