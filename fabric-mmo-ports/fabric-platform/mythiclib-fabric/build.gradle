base { archivesName = 'MythicLib-Fabric' }

// Canonical native Fabric module. Shared platform-neutral MythicLib runtime is
// compiled into the same artifact. Canonical runtime sources in the repository
// replace their restored bootstrap counterparts before javac runs.
def restoredRuntime = rootProject.file('../mythiclib-runtime')
def canonicalRuntime = rootProject.file('../../../fabric-mmo-ports/mythiclib-runtime')

def syncCanonicalMythicLibRuntime = tasks.register('syncCanonicalMythicLibRuntime') {
    inputs.dir(canonicalRuntime)
    outputs.dir(restoredRuntime)
    doLast {
        if (canonicalRuntime.isDirectory()) {
            copy {
                from canonicalRuntime
                into restoredRuntime
            }
        }
    }
}

// Native io.lumine.mythic.lib.* compatibility/API source bundle. It is stored as
// deterministic text chunks for Git transport and compiled as ordinary Java.
def legacyApiParts = fileTree(file('legacy-api-source-v2')) {
    include 'source.tar.gz.b64.part*'
}
def generatedLegacyApi = layout.buildDirectory.dir('generated/legacy-api-src')
def legacyApiSha256 = '2d88eb27f876a72c71ecf67ea73a95e6bfd2fdd75abf1c64f912d26dd509fce8'

def unpackLegacyApiSources = tasks.register('unpackLegacyApiSources') {
    inputs.files(legacyApiParts)
    outputs.dir(generatedLegacyApi)
    doLast {
        def parts = legacyApiParts.files.sort { a, b -> a.name <=> b.name }
        if (parts.size() != 7) throw new GradleException("Expected 7 MythicLib legacy API source parts, got ${parts.size()}")

        byte[] archiveBytes = Base64.decoder.decode(parts.collect { it.getText('UTF-8') }.join(''))
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(archiveBytes)
        def actualSha = digest.collect { String.format('%02x', it & 0xff) }.join('')
        if (actualSha != legacyApiSha256) throw new GradleException("MythicLib legacy API source checksum mismatch: ${actualSha}")

        def outDir = generatedLegacyApi.get().asFile
        delete(outDir)
        outDir.mkdirs()
        def archive = new File(temporaryDir, 'legacy-api-source.tar.gz')
        archive.bytes = archiveBytes
        copy {
            from tarTree(resources.gzip(archive))
            into outDir
        }
    }
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('../mythiclib-runtime/src/main/java')
            srcDir rootProject.file('../common-runtime/src/main/java')
            srcDir generatedLegacyApi
        }
        resources {
            srcDir rootProject.file('../mythiclib-runtime/src/main/resources')
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn(syncCanonicalMythicLibRuntime)
    dependsOn(unpackLegacyApiSources)
}
tasks.named('processResources').configure { dependsOn(syncCanonicalMythicLibRuntime) }
