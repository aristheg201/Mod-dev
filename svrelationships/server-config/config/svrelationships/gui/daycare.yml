# ============================================================
# SVRelationships — Daycare & Breeding
# CONFIG ONLY. Profile picker + session board + framed tabs.
# ============================================================

id: daycare
screen: generic_9x6
title_key: ui.daycare.title

components:
  tab_edge_l: {slot: 0, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_relationships:
    slot: 1
    item: minecraft:heart_of_the_sea
    name_key: ui.main.relationships
    lore_keys: [ui.tab.click, ui.main.relationships.lore2]
    action: open_gui
    args: {id: owned}
  tab_sep_2: {slot: 2, item: minecraft:pink_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_partners:
    slot: 3
    item: minecraft:rose_bush
    name_key: ui.main.partners
    lore_keys: [ui.tab.click, ui.main.partners.lore2]
    action: open_gui
    args: {id: partners}
  tab_sep_4: {slot: 4, item: minecraft:purple_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_daycare:
    slot: 5
    item: minecraft:turtle_egg
    name_key: ui.main.daycare
    lore_keys: [ui.tab.active, ui.main.daycare.lore2]
    action: none
  tab_sep_6: {slot: 6, item: minecraft:yellow_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_family:
    slot: 7
    item: minecraft:knowledge_book
    name_key: ui.main.family
    lore_keys: [ui.tab.click, ui.main.family.lore2]
    action: open_gui
    args: {id: family}
  tab_edge_r: {slot: 8, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}

  # Section markers in the side frame
  start_label:
    slot: 9
    item: minecraft:gold_ingot
    name_key: ui.daycare.section.start
    lore_keys: [ui.daycare.section.start.lore]
    action: none
  frame_17: {slot: 17, item: minecraft:yellow_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  sessions_label:
    slot: 18
    item: minecraft:clock
    name_key: ui.daycare.section.sessions
    lore_keys: [ui.daycare.section.sessions.lore]
    action: none
  frame_26: {slot: 26, item: minecraft:gray_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  frame_27: {slot: 27, item: minecraft:gray_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  frame_35: {slot: 35, item: minecraft:gray_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  frame_36: {slot: 36, item: minecraft:gray_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  frame_44: {slot: 44, item: minecraft:gray_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}

  previous:
    slot: 45
    item: minecraft:arrow
    name_key: ui.navigation.previous
    lore_keys: [ui.navigation.previous.lore]
    action: page_previous
    conditions: {has_previous_page: "true"}
  footer_46: {slot: 46, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  footer_47: {slot: 47, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  family_shortcut:
    slot: 48
    item: minecraft:knowledge_book
    name_key: ui.daycare.family
    lore_keys: [ui.daycare.family.lore1, ui.daycare.family.lore2]
    action: open_gui
    args: {id: family}
  home:
    slot: 49
    item: minecraft:compass
    name_key: ui.navigation.home
    lore_keys: [ui.navigation.back.main]
    action: open_gui
    args: {id: main}
  footer_50: {slot: 50, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  footer_51: {slot: 51, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  footer_52: {slot: 52, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  next:
    slot: 53
    item: minecraft:arrow
    name_key: ui.navigation.next
    lore_keys: [ui.navigation.next.lore]
    action: page_next
    conditions: {has_next_page: "true"}

repeaters:
  definitions:
    source: daycare_definitions
    slots: [10,11,12,13,14,15,16]
    visual: item
    item: minecraft:egg
    name_key: ui.daycare.definition
    lore_keys:
      - ui.daycare.definition.mode
      - ui.daycare.definition.participants
      - ui.daycare.definition.duration
      - ui.daycare.definition.cost
      - ui.daycare.definition.action
    action: daycare_begin
    args: {definition: "<definition>"}

  sessions:
    source: daycare_sessions
    slots: [19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
    visual: item
    item: minecraft:turtle_egg
    name_key: ui.daycare.entry
    lore_keys:
      - ui.daycare.entry.status
      - ui.daycare.entry.definition
      - ui.daycare.entry.participants
      - ui.daycare.entry.result
    action: none
