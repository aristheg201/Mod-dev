# ============================================================
# SVRelationships — Owned Pokémon Browser
# Pokémon entries use Cobblemon's native 3D pokemon_model.
# ============================================================

id: owned
screen: generic_9x6
title_key: ui.owned.title

components:
  guide:
    slot: 4
    item: minecraft:book
    name_key: ui.owned.guide
    lore_keys:
      - ui.owned.guide.lore1
      - ui.owned.guide.lore2
      - ui.owned.guide.lore3
    action: none

  previous:
    slot: 45
    item: minecraft:arrow
    name_key: ui.navigation.previous
    lore_keys:
      - ui.navigation.previous.lore
    action: page_previous

  back:
    slot: 49
    item: minecraft:barrier
    name_key: ui.navigation.back
    lore_keys:
      - ui.navigation.back.main
    action: open_gui
    args:
      id: main

  next:
    slot: 53
    item: minecraft:arrow
    name_key: ui.navigation.next
    lore_keys:
      - ui.navigation.next.lore
    action: page_next

repeaters:
  pokemon:
    source: owned_pokemon
    visual: pokemon_model
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    # Only used if the Pokémon model cannot be resolved.
    item: minecraft:player_head
    name_key: ui.owned.entry
    lore_keys:
      - ui.owned.entry.species
      - ui.owned.entry.bond
      - ui.owned.entry.romance
      - ui.owned.entry.partner
      - ui.owned.entry.action
    action: open_relationship
