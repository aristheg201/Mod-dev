id: partners
screen: generic_9x6
title_key: ui.partners.title

components:
  tab_edge_l: {slot: 0, item: minecraft:black_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_relationships:
    slot: 1
    item: minecraft:heart_of_the_sea
    name_key: ui.main.relationships
    lore_keys: [ui.tab.click, ui.main.relationships.lore2]
    action: open_gui
    args: {id: owned}
  tab_sep_2: {slot: 2, item: minecraft:pink_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_partners:
    slot: 3
    item: minecraft:rose_bush
    name_key: ui.main.partners
    lore_keys: [ui.tab.active, ui.main.partners.lore2]
    action: none
  tab_sep_4: {slot: 4, item: minecraft:purple_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
  tab_daycare:
    slot: 5
    item: minecraft:turtle_egg
    name_key: ui.main.daycare
    lore_keys: [ui.tab.click, ui.main.daycare.lore2]
    action: open_gui
    args: {id: daycare}
  tab_sep_6: {slot: 6, item: minecraft:yellow_stained_glass_pane, name_key: ui.decor.blank, lore_keys: [], action: none}
