id: partners
screen: generic_9x6
title_key: ui.partners.title

components:
  summary:
    slot: 4
    item: minecraft:amethyst_shard
    name_key: ui.partners.summary
    lore_keys:
      - ui.partners.summary.count
      - ui.partners.summary.capacity
      - ui.partners.summary.tip
    action: none

  previous:
    slot: 45
    item: minecraft:arrow
    name_key: ui.navigation.previous
    lore_keys:
      - ui.navigation.previous.lore
    action: page_previous

  back:
    slot: 49
    item: minecraft:barrier
    name_key: ui.navigation.back
    lore_keys:
      - ui.navigation.back.main
    action: open_gui
    args:
      id: main

  next:
    slot: 53
    item: minecraft:arrow
    name_key: ui.navigation.next
    lore_keys:
      - ui.navigation.next.lore
    action: page_next

