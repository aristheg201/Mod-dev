    visual: pokemon_model
    slots:
      - 10
      - 11
      - 12
      - 13
      - 14
      - 15
      - 16
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
      - 28
      - 29
      - 30
      - 31
      - 32
      - 33
      - 34
      - 37
      - 38
      - 39
      - 40
      - 41
      - 42
      - 43
    item: minecraft:knowledge_book
    name_key: ui.family.entry
    lore_keys:
      - ui.family.entry.generation
      - ui.family.entry.parents
      - ui.family.entry.profile
      - ui.family.entry.action
    action: open_relationship
