profiles:
  partner_daily:
    trigger_type: automatic_minecraft_time
    period: 1d
    scope: per_partner
    entries:
      - {id: oran_berry,       weight: 18, reward_type: item, value: cobblemon:oran_berry,      minimum_amount: 1, maximum_amount: 1}
      - {id: apple,            weight: 16, reward_type: item, value: minecraft:apple,           minimum_amount: 1, maximum_amount: 1}
      - {id: bread,            weight: 14, reward_type: item, value: minecraft:bread,           minimum_amount: 1, maximum_amount: 1}
      - {id: baked_potato,     weight: 12, reward_type: item, value: minecraft:baked_potato,    minimum_amount: 1, maximum_amount: 1}
      - {id: carrot,           weight: 10, reward_type: item, value: minecraft:carrot,          minimum_amount: 1, maximum_amount: 1}
      - {id: honey_bottle,     weight: 8,  reward_type: item, value: minecraft:honey_bottle,    minimum_amount: 1, maximum_amount: 1}
      - {id: cookie,           weight: 8,  reward_type: item, value: minecraft:cookie,          minimum_amount: 1, maximum_amount: 1}
      - {id: glow_berries,     weight: 7,  reward_type: item, value: minecraft:glow_berries,    minimum_amount: 1, maximum_amount: 1}
      - {id: sweet_berries,    weight: 7,  reward_type: item, value: minecraft:sweet_berries,   minimum_amount: 1, maximum_amount: 1}
      - {id: iron_ingot,       weight: 6,  reward_type: item, value: minecraft:iron_ingot,      minimum_amount: 1, maximum_amount: 1}
      - {id: gold_ingot,       weight: 4,  reward_type: item, value: minecraft:gold_ingot,      minimum_amount: 1, maximum_amount: 1}
      - {id: amethyst_shard,   weight: 4,  reward_type: item, value: minecraft:amethyst_shard,  minimum_amount: 1, maximum_amount: 1}
      - {id: emerald,          weight: 3,  reward_type: item, value: minecraft:emerald,         minimum_amount: 1, maximum_amount: 1}
      - {id: diamond,          weight: 1,  reward_type: item, value: minecraft:diamond,         minimum_amount: 1, maximum_amount: 1}
      - {id: golden_apple,     weight: 1,  reward_type: item, value: minecraft:golden_apple,    minimum_amount: 1, maximum_amount: 1}

  anniversary_yearly:
    trigger_type: periodic
    period: 365d
    scope: per_partner
    entries:
      - {id: anniversary_currency, weight: 100, reward_type: economy, value: default, minimum_amount: 500, maximum_amount: 1000}
