def generatedCWorldNpcSkins = layout.buildDirectory.dir('generated/cworld-npc-skins')

tasks.register('generateCWorldNpcSkins') {
    outputs.dir generatedCWorldNpcSkins
    doLast {
        def root = generatedCWorldNpcSkins.get().asFile
        root.deleteDir()

        def shade = { int rgb, double factor ->
            int r = Math.max(0, Math.min(255, (int)(((rgb >> 16) & 255) * factor)))
            int g = Math.max(0, Math.min(255, (int)(((rgb >> 8) & 255) * factor)))
            int b = Math.max(0, Math.min(255, (int)((rgb & 255) * factor)))
            return (r << 16) | (g << 8) | b
        }

        cworldNpcSkinPalettes.each { String id, List<Integer> p ->
            int skin = p[0], shirt = p[1], accent = p[2], pants = p[3]
            def image = new BufferedImage(64, 64, BufferedImage.TYPE_INT_ARGB)
            def g = image.createGraphics()
            def fill = { int x1, int y1, int x2, int y2, int rgb ->
                g.setColor(new Color(rgb))
                g.fillRect(x1, y1, x2 - x1 + 1, y2 - y1 + 1)
            }

            [[8,8,15,15,skin],[24,8,31,15,skin],[0,8,7,15,shade(skin,0.72d)],
             [16,8,23,15,shade(skin,0.72d)],[8,0,15,7,shade(skin,1.12d)],[16,0,23,7,shade(skin,0.72d)]].each { q -> fill(*q) }
            int hair = shade(accent, 0.55d)
            fill(8,8,15,10,hair); fill(8,11,9,12,hair); fill(14,11,15,12,hair)
            fill(10,12,10,12,0x232D37); fill(13,12,13,12,0x232D37)

            [[20,20,27,31,shirt],[32,20,39,31,shade(shirt,0.72d)],[16,20,19,31,shade(shirt,0.72d)],
             [28,20,31,31,shade(shirt,0.72d)],[20,16,27,19,shade(shirt,1.12d)],[28,16,35,19,shade(shirt,0.72d)]].each { q -> fill(*q) }
            fill(22,21,25,23,accent); fill(20,29,27,31,shade(shirt,0.82d))

            [[44,20,47,31,shirt],[52,20,55,31,shade(shirt,0.72d)],[40,20,43,31,shade(shirt,0.72d)],
             [48,20,51,31,shade(shirt,0.72d)],[44,16,47,19,shade(shirt,1.12d)],[48,16,51,19,shade(shirt,0.72d)]].each { q -> fill(*q) }
            fill(44,28,47,31,skin)

            [[36,52,39,63,shirt],[44,52,47,63,shade(shirt,0.72d)],[32,52,35,63,shade(shirt,0.72d)],
             [40,52,43,63,shade(shirt,0.72d)],[36,48,39,51,shade(shirt,1.12d)],[40,48,43,51,shade(shirt,0.72d)]].each { q -> fill(*q) }
            fill(36,60,39,63,skin)

            [[4,20,7,31,pants],[12,20,15,31,shade(pants,0.72d)],[0,20,3,31,shade(pants,0.72d)],
             [8,20,11,31,shade(pants,0.72d)],[4,16,7,19,shade(pants,1.12d)],[8,16,11,19,shade(pants,0.72d)]].each { q -> fill(*q) }
            fill(4,29,7,31,0x232328)

            [[20,52,23,63,pants],[28,52,31,63,shade(pants,0.72d)],[16,52,19,63,shade(pants,0.72d)],
             [24,52,27,63,shade(pants,0.72d)],[20,48,23,51,shade(pants,1.12d)],[24,48,27,51,shade(pants,0.72d)]].each { q -> fill(*q) }
            fill(20,61,23,63,0x232328)
            fill(20,32,27,33,accent); fill(44,32,47,33,accent); fill(52,48,55,49,accent)

            g.dispose()
            def target = new File(root, "assets/cobblemonworld/textures/entity/npc/" + id + ".png")
            target.parentFile.mkdirs()
            ImageIO.write(image, "png", target)
            if (!target.isFile() || target.length() <= 100L) throw new GradleException("Failed to generate NPC skin: " + id)
        }
        println "CWORLD_GENERATED_NPC_SKINS_PASS count=" + cworldNpcSkinPalettes.size()
    }
}

tasks.named('processResources') {
    dependsOn 'generateCWorldNpcSkins'
    from(generatedCWorldNpcSkins)
}
