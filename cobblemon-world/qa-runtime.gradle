plugins {
    id 'fabric-loom' version '1.10.5'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.cobblemon.com/releases' }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.impactdev.net/repository/development/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://api.modrinth.com/maven' }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
}

def smartphoneSourceCommit = '438161ff9ad1c1c72f1426ec6ee68a3920cab332'
def smartphoneSourceZip = layout.buildDirectory.file("vendor/cobblemon-smartphone-${smartphoneSourceCommit}.zip")
def generatedSmartphoneAssets = layout.buildDirectory.dir('generated/cobblemon-smartphone-gui')

tasks.register('downloadSmartphoneSource') {
    outputs.file smartphoneSourceZip
    doLast {
        def target = smartphoneSourceZip.get().asFile
        target.parentFile.mkdirs()
        if (!target.isFile() || target.length() < 1024L) {
            def url = new URI(
                    "https://codeload.github.com/RapidMesck/cobblemon_smartphone_main/zip/${smartphoneSourceCommit}"
            ).toURL()
            url.openStream().withCloseable { input ->
                target.withOutputStream { output ->
                    output << input
                }
            }
        }
        if (!target.isFile() || target.length() <= 1024L) {
            throw new GradleException('Failed to download pinned Cobblemon Smartphone source archive')
        }
    }
}

tasks.register('unpackSmartphoneAssets', Sync) {
    dependsOn 'downloadSmartphoneSource'
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    from({
        zipTree(smartphoneSourceZip.get().asFile)
    }) {
        include '**/common/src/main/resources/assets/cobblemon_smartphone/textures/gui/**'
        eachFile { details ->
            def marker = 'common/src/main/resources/'
            def markerIndex = details.path.indexOf(marker)
            if (markerIndex >= 0) {
                details.path = details.path.substring(markerIndex + marker.length())
            }
        }
        includeEmptyDirs = false
    }
    into generatedSmartphoneAssets
}

processResources {
    dependsOn 'unpackSmartphoneAssets'
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    from generatedSmartphoneAssets

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    doLast {
        [
            'assets/cobblemon_smartphone/textures/gui/smartphone_red.png',
            'assets/cobblemon_smartphone/textures/gui/home_screen.png',
            'assets/cobblemon_smartphone/textures/gui/large_smartphone_red.png',
            'assets/cobblemon_smartphone/textures/gui/large_screen.png',
            'assets/cobblemon_smartphone/textures/gui/buttons/trainer.png',
            'assets/cobblemon_smartphone/textures/gui/buttons/social.png',
            'assets/cobblemon_smartphone/textures/gui/elements/home_button.png',
            'assets/cobblemon_smartphone/textures/gui/elements/page_dot_on.png',
            'assets/cobblemon_smartphone/textures/gui/elements/prev_button.png'
        ].each { relative ->
            def file = destinationDir.toPath().resolve(relative).toFile()
            if (!file.isFile() || file.length() <= 100L) {
                throw new GradleException("Cobblemon Smartphone GUI asset was not vendored: " + relative)
            }
        }
        println 'CWORLD_SMARTPHONE_ASSETS_PASS count=9'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

configurations {
    productionRuntimeMods
    serverOnlyRuntimeMods
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    productionRuntimeMods "com.cobblemon:fabric:${project.cobblemon_version}"
    // Current SVFrameLib permission layer directly links the LuckPerms API.
    // Keep this in the QA server stack only; Cobblemon World itself does not depend on LuckPerms.
    serverOnlyRuntimeMods "maven.modrinth:Vebnzrzj:oLykW1F8"
}

tasks.register('runProductionCWorldServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn tasks.named('remapJar')
    mods.from configurations.productionRuntimeMods
    mods.from configurations.serverOnlyRuntimeMods
    mods.from fileTree('qa-runtime/server/mods') { include '*.jar' }
    mods.from tasks.named('remapJar').flatMap { it.archiveFile }
    jvmArgs.addAll(['-Dcworld.qa.server=true', '-Xmx4G'])
    runDir = file('qa-runtime/server')
}

tasks.register('runProductionCWorldClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('remapJar')
    mods.from configurations.productionRuntimeMods
    mods.from tasks.named('remapJar').flatMap { it.archiveFile }
    jvmArgs.addAll(['-Dcworld.qa.client=true', '-Xmx4G'])
    programArgs.addAll([
        '--width', '1280',
        '--height', '720',
        '--username', 'CWorldQA'
    ])
    runDir = file('qa-runtime/client')
    useXVFB = false
}
