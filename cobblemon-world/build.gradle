plugins {
    id 'fabric-loom' version '1.10.5'
}

apply from: 'npc-skins.gradle'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.cobblemon.com/releases' }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://maven.impactdev.net/repository/development/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://api.modrinth.com/maven' }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"

    compileOnly files("libs/BEconomy-1.5.jar")

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
}

processResources {

    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version


    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    doLast {
        [
            'assets/cobblemon_smartphone/textures/gui/smartphone_red.png',
            'assets/cobblemon_smartphone/textures/gui/home_screen.png',
            'assets/cobblemon_smartphone/textures/gui/large_smartphone_red.png',
            'assets/cobblemon_smartphone/textures/gui/large_screen.png',
            'assets/cobblemon_smartphone/textures/gui/buttons/trainer.png',
            'assets/cobblemon_smartphone/textures/gui/buttons/social.png',
            'assets/cobblemon_smartphone/textures/gui/elements/home_button.png',
            'assets/cobblemon_smartphone/textures/gui/elements/page_dot_on.png',
            'assets/cobblemon_smartphone/textures/gui/elements/prev_button.png',
            'assets/cobblemon_smartphone/models/item/red_smartphone_3d.json',
            'assets/cobblemon_smartphone/textures/item/red_smartphone_3d.png'
        ].each { relative ->
            def file = destinationDir.toPath().resolve(relative).toFile()
            if (!file.isFile() || file.length() <= 100L) {
                throw new GradleException("Cobblemon Smartphone GUI asset was not vendored: " + relative)
            }
        }
        println 'CWORLD_SMARTPHONE_ASSETS_PASS count=11'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

configurations {
    productionRuntimeMods
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    productionRuntimeMods "com.cobblemon:fabric:${project.cobblemon_version}"
}

tasks.register('runProductionCWorldClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // A previous process exit is not evidence that the saved world was exercised again.
    outputs.upToDateWhen { false }
    dependsOn tasks.named('remapJar')
    mods.from configurations.productionRuntimeMods
    mods.from fileTree('qa-runtime/mods') {
        include '*.jar'
        if (Boolean.getBoolean('cworld.qa.noeconomy')) exclude 'BEconomy-1.5.jar'
    }
    mods.from tasks.named('remapJar').flatMap { it.archiveFile }
    jvmArgs.addAll([
        '-Dcworld.qa.client=true',
        '-Dcworld.qa.server=false',
        '-Dcworld.qa.integrated=false',
        '-Dcworld.qa.multiplayer=true',
        '-Dcworld.qa.production=true',
        '-Dcworld.qa.narrative=' + System.getProperty('cworld.qa.narrative', 'false'),
        '-Dcworld.qa.opening=' + System.getProperty('cworld.qa.opening', 'false'),
        '-Dcworld.qa.noeconomy=' + System.getProperty('cworld.qa.noeconomy', 'false'),
        '-Dcworld.qa.services=' + System.getProperty('cworld.qa.services', 'false'),
        '-Dcworld.qa.fashion=' + System.getProperty('cworld.qa.fashion', 'false'),
        '-Dcworld.qa.npcBinding=' + System.getProperty('cworld.qa.npcBinding', 'false'),
        '-Dcworld.qa.npcBindingFixture=' + System.getProperty('cworld.qa.npcBindingFixture', 'false'),
        '-Dcworld.qa.resume=' + System.getProperty('cworld.qa.resume', 'false'),
        '-Dcworld.qa.restart=' + System.getProperty('cworld.qa.restart', 'false'),
        '-Dcworld.qa.address=' + System.getProperty('cworld.qa.address', '127.0.0.1:25571'),
        '-Xmx2G', '-XX:ActiveProcessorCount=2'
    ])
    programArgs.addAll([
        '--width', '1280',
        '--height', '720',
        '--username', 'CWorldQA'
    ])
    ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort', 'javax.net.ssl.trustStore'].each { key ->
        if (System.getProperty(key)) jvmArgs.add('-D' + key + '=' + System.getProperty(key))
    }
    runDir = file(System.getProperty('cworld.qa.clientDir', 'qa-runtime/client'))
    useXVFB = false
}

tasks.register('runProductionCWorldServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    outputs.upToDateWhen { false }
    dependsOn tasks.named('remapJar')
    mods.from configurations.productionRuntimeMods
    mods.from fileTree('qa-runtime/mods') {
        include '*.jar'
        if (Boolean.getBoolean('cworld.qa.noeconomy')) exclude 'BEconomy-1.5.jar'
    }
    mods.from tasks.named('remapJar').flatMap { it.archiveFile }
    jvmArgs.addAll(['-Dcworld.qa.server=true', '-Dcworld.qa.production=true',
        '-Dcworld.qa.narrative=' + System.getProperty('cworld.qa.narrative', 'false'),
        '-Dcworld.qa.opening=' + System.getProperty('cworld.qa.opening', 'false'),
        '-Dcworld.qa.noeconomy=' + System.getProperty('cworld.qa.noeconomy', 'false'),
        '-Dcworld.qa.services=' + System.getProperty('cworld.qa.services', 'false'),
        '-Dcworld.qa.fashion=' + System.getProperty('cworld.qa.fashion', 'false'),
        '-Dcworld.qa.npcBinding=' + System.getProperty('cworld.qa.npcBinding', 'false'),
        '-Dcworld.qa.npcBindingFixture=' + System.getProperty('cworld.qa.npcBindingFixture', 'false'),
        '-Dcworld.qa.resume=' + System.getProperty('cworld.qa.resume', 'false'),
                   '-Dcworld.qa.restart=' + System.getProperty('cworld.qa.restart', 'false'), '-Xmx2G', '-XX:ActiveProcessorCount=2'])
    ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort', 'javax.net.ssl.trustStore'].each { key ->
        if (System.getProperty(key)) jvmArgs.add('-D' + key + '=' + System.getProperty(key))
    }
    runDir = file(System.getProperty('cworld.qa.serverDir',Boolean.getBoolean('cworld.qa.npcBinding') ? 'qa-runtime/server-npc-binding' : Boolean.getBoolean('cworld.qa.narrative') ? (Boolean.getBoolean('cworld.qa.opening') ? 'qa-runtime/server-narrative-opening' : 'qa-runtime/server-narrative') : Boolean.getBoolean('cworld.qa.noeconomy') ? 'qa-runtime/server-no-economy' : (Boolean.getBoolean('cworld.qa.services') ? 'qa-runtime/server-services' : 'qa-runtime/server')))
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
