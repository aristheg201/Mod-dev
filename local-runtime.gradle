plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url 'https://maven.nucleoid.xyz' }
    maven { url 'https://maven.impactdev.net/repository/development/' }
}

dependencies {
    modImplementation include('net.kyori:adventure-platform-fabric:5.14.2')
    modCompileOnly 'eu.pb4:placeholder-api:2.4.2+1.21'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation 'com.cobblemon:fabric:1.8.1+1.21.1'

    if (file('libs/SVArcade-0.6.8.jar').exists()) {
        modRuntimeOnly files('libs/SVArcade-0.6.8.jar')
    }

    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'
    include 'org.xerial:sqlite-jdbc:3.46.1.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.named('jar') {
    from('INTERNAL-BUILD.md') { into '' }
}

test { useJUnitPlatform() }

sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('qaJar', Jar) {
    dependsOn tasks.named('qaClasses')
    archiveClassifier = 'qa-driver-dev'
    from sourceSets.qa.output
}

tasks.register('remapQaJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('qaJar')
    inputFile = tasks.named('qaJar').flatMap { it.archiveFile }
    archiveClassifier = 'qa-driver'
}

tasks.register('verifyCardWorlds') {
    group = 'verification'
    description = 'Runs unit tests and produces both production and QA remapped jars.'
    dependsOn tasks.named('test'), tasks.named('remapJar'), tasks.named('remapQaJar')
}



repositories {
    maven { url 'https://maven.architectury.dev/' }
    maven { url 'https://maven.wispforest.io/releases' }
    maven { url 'https://api.modrinth.com/maven' }
}

configurations {
    productionRuntimeMods
    coreRuntimeMods
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    productionRuntimeMods "com.cobblemon:fabric:1.8.1+1.21.1"
    productionRuntimeMods "dev.architectury:architectury-fabric:13.0.8"
    productionRuntimeMods "io.wispforest:accessories-fabric:1.1.0-beta.52+1.21.1"
    productionRuntimeMods "maven.modrinth:SszvX85I:1.2.0+1.8.1+1.21.1-release"
    productionRuntimeMods "maven.modrinth:eXts2L7r:U5bhVym2"
    productionRuntimeMods "maven.modrinth:4Kma4Oms:9rGoa3aP"
    productionRuntimeMods "maven.modrinth:s7N7AsqL:NQdxKsW7"
    productionRuntimeMods "maven.modrinth:LdBYVaPS:KwNU9SQW"
    productionRuntimeMods "maven.modrinth:Vebnzrzj:l47d4ZWk"
    coreRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    coreRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
    coreRuntimeMods "com.cobblemon:fabric:1.8.1+1.21.1"
}

tasks.register('runProductionCardWorldsClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn tasks.named('remapJar'), tasks.named('remapQaJar')
    mods.from configurations.productionRuntimeMods
    mods.from tasks.named('remapJar').flatMap { it.archiveFile }
    mods.from tasks.named('remapQaJar').flatMap { it.archiveFile }
    jvmArgs.add('-Dcardworlds.qa=true')
    programArgs.addAll(['--width', '1280', '--height', '720'])
    runDir = file('run')
    useXVFB = false
}
tasks.register('runProductionCardWorldsCoreServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn tasks.named('remapJar')
    // Replace Loom's default productionRuntimeMods collection for a genuine absence test.
    mods.setFrom(configurations.coreRuntimeMods, tasks.named('remapJar').flatMap { it.archiveFile })
    runDir = file('run-core-server')
}
tasks.register('runProductionCardWorldsServer' , net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    dependsOn tasks.named('remapJar')
    mods.from configurations.productionRuntimeMods
    mods.from tasks.named('remapJar').flatMap { it.archiveFile }
    runDir = file('run-server')
}