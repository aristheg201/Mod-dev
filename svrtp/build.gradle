plugins { id 'fabric-loom' version '1.10.5' }
version = '1.0.2'
group = 'vn.svframe'
base { archivesName = 'svrtp' }
repositories {
 mavenCentral()
 maven { url 'https://maven.cobblemon.com/releases' }
 maven { url 'https://maven.wispforest.io/releases' }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.18.4'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
 modCompileOnly files('libs/Cobblemon-fabric-1.8.1+1.21.1.jar')
 modCompileOnly 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
 modCompileOnly files('libs/Chunky-Fabric-1.4.23.jar', 'libs/ChunkyBorder-1.2.18.jar', 'libs/CobbleDollars-fabric-2.0.0+Beta-6.1+1.21.1.jar')
 compileOnly files('libs/BEconomy-1.5.jar')
 compileOnly 'net.luckperms:api:5.4'
 testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
 testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources { inputs.property('version',project.version);filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }

sourceSets { qa { java.srcDir 'src/qa/java'; resources.srcDir 'src/qa/resources'; compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output; runtimeClasspath += sourceSets.main.runtimeClasspath } }
tasks.register('qaJar',Jar) { archiveClassifier='qa-driver'; from sourceSets.qa.output }
tasks.register('remapQaJar',net.fabricmc.loom.task.RemapJarTask) { dependsOn qaJar; inputFile=tasks.qaJar.archiveFile; archiveClassifier='qa-driver-remapped' }
configurations { qaRuntimeMods }
dependencies {
 qaRuntimeMods 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
 qaRuntimeMods 'net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20'
 qaRuntimeMods files('libs/Cobblemon-fabric-1.8.1+1.21.1.jar','libs/BEconomy-1.5.jar','libs/CobbleDollars-fabric-2.0.0+Beta-6.1+1.21.1.jar','libs/Chunky-Fabric-1.4.23.jar','libs/ChunkyBorder-1.2.18.jar')
}
tasks.register('runQaServer',net.fabricmc.loom.task.prod.ServerProductionRunTask) {
 dependsOn remapJar,remapQaJar
 mods.setFrom(configurations.qaRuntimeMods, providers.provider { System.getProperty('svrtp.qa.releaseJar')?file(System.getProperty('svrtp.qa.releaseJar')):tasks.remapJar.archiveFile.get().asFile })
 mods.from tasks.remapQaJar.archiveFile
 mods.from fileTree(System.getProperty('svrtp.qa.terrainMods','qa-runtime/terrain-mods')) { include '*.jar' }
 mods.from fileTree('qa-runtime/mods') { include '*.jar' }
 jvmArgs.addAll(['-Dsvrtp.qa.server=true','-Dsvrtp.qa.natural='+System.getProperty('svrtp.qa.natural','false'),'-Dsvrtp.qa.rules='+System.getProperty('svrtp.qa.rules','false'),'-Dsvrtp.qa.origin='+System.getProperty('svrtp.qa.origin','false'),'-Dsvrtp.qa.concurrent='+System.getProperty('svrtp.qa.concurrent','false'),'-Dsvrtp.qa.resume='+System.getProperty('svrtp.qa.resume','false'),'-Xmx1280m','-XX:ActiveProcessorCount=2'])
 if(System.getProperty('svrtp.qa.jfr'))jvmArgs.add('-XX:StartFlightRecording=filename='+System.getProperty('svrtp.qa.jfr')+',settings=profile,dumponexit=true,maxsize=128m')
 runDir=file(System.getProperty('svrtp.qa.serverDir','qa-runtime/server'))
}
tasks.register('runQaClient',net.fabricmc.loom.task.prod.ClientProductionRunTask) {
 dependsOn remapQaJar
 mods.from configurations.qaRuntimeMods
 mods.from tasks.remapQaJar.archiveFile
 mods.from fileTree(System.getProperty('svrtp.qa.terrainMods','qa-runtime/terrain-mods')) { include '*.jar' }
 jvmArgs.addAll(['-Dsvrtp.qa.client=true','-Xmx1280m','-XX:ActiveProcessorCount=2'])
 programArgs.addAll(['--username',System.getProperty('svrtp.qa.username','SVRTPQA'),'--width','1280','--height','720'])
 runDir=file(System.getProperty('svrtp.qa.clientDir','qa-runtime/client'));useXVFB=false
}
tasks.named('processQaResources') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

// Real processes have side effects; a previous launch is never a cached QA pass.
tasks.named('runQaServer') { outputs.upToDateWhen { false } }
tasks.named('runQaClient') { outputs.upToDateWhen { false } }
