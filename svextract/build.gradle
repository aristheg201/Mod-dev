plugins {
    id 'fabric-loom' version '1.17.21'
    id 'maven-publish'
}

if (project.hasProperty('personalBundle')) {
    throw new GradleException('The all-mods bundle has been retired. Build SVEXTRACT normally and install Point Blank, SVFrame, BEconomy and their dependencies separately. Use -PcompatQa only for the isolated development runtime.')
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }
repositories { maven { url = uri('deps/maven') } }
def privateCoordinates = []
if (project.hasProperty('compatQa')) {
    def catalog = file('deps/private-catalog.json')
    if (!catalog.exists()) throw new GradleException('Run tools/prepare_personal_repository.py after fetching your personal dependencies.')
    privateCoordinates = new groovy.json.JsonSlurper().parse(catalog).collect { it.coordinate }
}

loom {
    splitEnvironmentSourceSets()
    if (project.hasProperty('qaScript')) {
        project.sourceSets {
            qaClient {
                compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
                runtimeClasspath += compileClasspath
            }
        }
    }
    mods {
        svextract {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        if (project.hasProperty('qaScript')) {
            svextractqa { sourceSet sourceSets.qaClient }
        }
    }
    runs {
        server { runDir 'run-server' }
        client {
            runDir 'run-client'
            vmArgs '-Xmx3G', '-XX:ActiveProcessorCount=2'
            if (project.hasProperty('qaClient')) {
                programArgs '--username', 'SVExtractQA', '--quickPlayMultiplayer', '127.0.0.1:25565', '--width', '1280', '--height', '720'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    if (project.hasProperty('compatQa')) {
        privateCoordinates.each { modRuntimeOnly it }
        runtimeOnly fileTree(dir: 'deps/runtime', include: '*.jar')
    }
    implementation include('org.xerial:sqlite-jdbc:3.46.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    def minimumLoader = project.loader_min_version
    inputs.property 'loader_min_version', minimumLoader
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'loader_min_version': minimumLoader }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar() }
test { useJUnitPlatform(); maxHeapSize = '512m' }

// Only the core persistence driver is nested. Integrations remain external mods.
tasks.register('productionCheck', Exec) {
    group = 'verification'
    description = 'Requires evidence-backed verification of every production acceptance requirement.'
    commandLine 'python3', 'tools/verify_acceptance.py', '--production'
}

if (project.hasProperty('qaScript')) {
    tasks.register('qaJar', Jar) {
        from sourceSets.qaClient.output
        archiveBaseName = 'svextract-native-qa'
        archiveVersion = '1.0.0'
        destinationDirectory = layout.buildDirectory.dir('qa')
    }
    tasks.register('remapQaJar', net.fabricmc.loom.task.RemapJarTask) {
        dependsOn tasks.named('qaJar'), tasks.named('compileQaClientJava')
        inputFile = tasks.named('qaJar', Jar).flatMap { it.archiveFile }
        archiveBaseName = 'svextract-native-qa'
        archiveVersion = '1.0.0'
        destinationDirectory = layout.buildDirectory.dir('qa-remapped')
    }
    tasks.register('exportQaClasspath') {
        doLast { file('build/qa-classpath.txt').text = sourceSets.client.runtimeClasspath.asPath }
    }
}
