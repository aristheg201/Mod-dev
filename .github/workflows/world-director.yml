name: World Director Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/world-director
    paths:
      - 'world-director-bootstrap/**'
      - '.github/workflows/world-director.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'world-director-bootstrap/**'
      - '.github/workflows/world-director.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore World Director source
        shell: bash
        run: |
          cat world-director-bootstrap/source.b64.part* | base64 -d > /tmp/world-director-source.tar.gz
          echo "6260c995bdb0c05469c848807e7f046092214b7d0898d87e6ebea2219711c941  /tmp/world-director-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/world-director-source.tar.gz
          test -f world-director/src/main/resources/fabric.mod.json
          test -f world-director/src/main/java/vn/svframe/worlddirector/WorldDirectorMod.java
          # Remove the stale log-only mention of the retired NPC system before compilation.
          sed -i 's/, or Lively dependency/, or legacy NPC dependency/' world-director/src/main/java/vn/svframe/worlddirector/WorldDirectorMod.java
          if grep -RIni --exclude='*.class' 'lively' world-director/src; then
            echo 'Unexpected retired NPC integration reference in World Director source' >&2
            exit 1
          fi
          # Cobblemon's Java-visible event API references Kotlin Function1; add stdlib to the compile classpath only.
          sed -i '/modCompileOnly "com.cobblemon:fabric:/a\    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"' world-director/build.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and remap
        working-directory: world-director
        run: gradle --no-daemon clean test remapJar

      - name: Verify artifact
        shell: bash
        run: |
          JAR="$(find world-director/build/libs -maxdepth 1 -type f -name 'WorldDirector-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee world-director/build/libs/fabric.mod.built.json
          sha256sum "$JAR" | tee world-director/build/libs/SHA256.txt
          if unzip -Z1 "$JAR" | grep -qi 'lively'; then
            echo 'Unexpected retired NPC integration entry in artifact' >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldDirector
          path: |
            world-director/build/libs/*.jar
            world-director/build/libs/SHA256.txt
            world-director/build/libs/fabric.mod.built.json
          if-no-files-found: error
