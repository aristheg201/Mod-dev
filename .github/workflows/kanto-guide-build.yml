name: KantoNPC SVFrame guide build

on:
  push:
    branches:
      - build/kantonpcs-svframe-guide-20260823
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source tree
        shell: bash
        run: |
          mkdir -p /tmp/kanto-guide-build
          cat bootstrap/kanto-guide-correct.part00 bootstrap/kanto-guide-correct.part01 | base64 -d > /tmp/kanto-guide-source.tar.gz
          tar -xzf /tmp/kanto-guide-source.tar.gz -C /tmp/kanto-guide-build
          test -f /tmp/kanto-guide-build/svframe-kanto-guide/src/main/java/vn/svframe/kantoguide/SVFrameKantoGuide.java

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Loom remap build
        working-directory: /tmp/kanto-guide-build/svframe-kanto-guide
        run: gradle --no-daemon clean remapJar

      - name: Verify artifact
        shell: bash
        run: |
          mkdir -p build-output
          JAR="$(find /tmp/kanto-guide-build/svframe-kanto-guide/build/libs -maxdepth 1 -type f -name 'SVFrameKantoGuide-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          cp "$JAR" build-output/SVFrameKantoGuide-remapped.jar
          unzip -p "$JAR" fabric.mod.json | tee build-output/fabric.mod.json
          sha256sum build-output/SVFrameKantoGuide-remapped.jar | tee build-output/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KantoNPC-SVFrame-Guide-remapped
          path: build-output/*
          if-no-files-found: error
