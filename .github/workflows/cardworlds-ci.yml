name: Card Worlds CI

on:
  push:
    branches:
      - feature/yugioh-card-worlds-production-20260930
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardworlds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Card Worlds source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/cardworlds-src.b64.part* | base64 -d > /tmp/cardworlds-src-tools.tar.gz
          echo "4e3596c43da9a15d98c44d56c76b0d58d70388dd2c70ab65db1d11f5a1e2aa37  /tmp/cardworlds-src-tools.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cardworlds-src-tools.tar.gz
          # Match the Loom generation already proven by SVHub visual smoke.
          # Loom 1.7 leaves Cobblemon Kotlin metadata pointing at intermediary
          # names (for example net.minecraft.class_2960) in a Yarn dev runtime.
          sed -i 's/^loom_version=.*/loom_version=1.10.5/' gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/qa/java/vn/svarcade/tcg/qa/VisualRun.java")
          s = p.read_text()
          old_fields = 'private long next;private int step;private boolean worldStarted;private int rounds;'
          new_fields = 'private long next;private int step;private boolean worldStarted;private int rounds;private int preWorldPasses;'
          old_init = '@Override public void onInitializeClient(){if(!Boolean.getBoolean("cardworlds.qa"))return;ClientTickEvents.END_CLIENT_TICK.register(this::tick);}'
          new_init = '@Override public void onInitializeClient(){org.slf4j.LoggerFactory.getLogger("cardworlds-qa").info("CARDWORLDS_QA_DRIVER_LOADED");ClientTickEvents.END_CLIENT_TICK.register(this::tick);}'
          old_world = 'if(c.player==null){if(c.currentScreen instanceof TitleScreen&&!worldStarted){worldStarted=true;c.createIntegratedServerLoader().start("cardworlds-qa",()->{});}return;}'
          new_world = '''if(c.player==null){if(!worldStarted&&c.currentScreen!=null){if(++preWorldPasses<10)return;worldStarted=true;org.slf4j.LoggerFactory.getLogger("cardworlds-qa").info("CARDWORLDS_QA_CREATE_WORLD screen={}",c.currentScreen.getClass().getName());var info=new net.minecraft.world.level.LevelInfo("Card Worlds QA",net.minecraft.world.GameMode.CREATIVE,false,net.minecraft.world.Difficulty.PEACEFUL,true,new net.minecraft.world.GameRules(),net.minecraft.resource.DataConfiguration.SAFE_MODE);c.createIntegratedServerLoader().createAndStart("cardworlds-qa",info,net.minecraft.world.gen.GeneratorOptions.createRandom(),registries->registries.get(net.minecraft.registry.RegistryKeys.WORLD_PRESET).getOrThrow(net.minecraft.world.gen.WorldPresets.DEFAULT).createDimensionsRegistryHolder(),new TitleScreen());}return;}'''
          old_close = 'case 18->{shot(c,"14-duel-result");a.close();step=20;}'
          new_close = 'case 18->{shot(c,"14-duel-result");((net.minecraft.client.gui.screen.Screen)a).close();step=20;}'
          old_key = 'case 21->{shot(c,"15-reopen-y");a.keyPressed(GLFW.GLFW_KEY_Y,0,0);step=22;}'
          new_key = 'case 21->{shot(c,"15-reopen-y");((net.minecraft.client.gui.screen.Screen)a).keyPressed(GLFW.GLFW_KEY_Y,0,0);step=22;}'
          old_char = 'case 24->{shot(c,"16-reopen-command");a.navigate("Collection");a.fields.put("search","");a.focus="search";a.charTyped(\'y\',0);if(!a.fields.get("search").equals("y"))throw new AssertionError("Typing Y failed");step++;}'
          new_char = 'case 24->{shot(c,"16-reopen-command");a.navigate("Collection");a.fields.put("search","");a.focus="search";((net.minecraft.client.gui.screen.Screen)a).charTyped(\'y\',0);if(!a.fields.get("search").equals("y"))throw new AssertionError("Typing Y failed");step++;}'
          old_click = 'private static void click(CardWorldsScreen a,int x,int y){a.mouseClicked(x*a.width/1280.0,y*a.width/1280.0,0);}'
          new_click = 'private static void click(CardWorldsScreen a,int x,int y){double scale=MinecraftClient.getInstance().getWindow().getScaledWidth()/1280.0;((net.minecraft.client.gui.screen.Screen)a).mouseClicked(x*scale,y*scale,0);}'
          anchors = [old_fields, old_init, old_world, old_close, old_key, old_char, old_click]
          if any(a not in s for a in anchors):
              raise SystemExit("VisualRun patch anchors not found")
          p.write_text(
              s.replace(old_fields,new_fields)
               .replace(old_init,new_init)
               .replace(old_world,new_world)
               .replace(old_close,new_close)
               .replace(old_key,new_key)
               .replace(old_char,new_char)
               .replace(old_click,new_click)
          )
          PY

          cat >> build.gradle <<'GRADLE'

          configurations {
              productionRuntimeMods
          }

          dependencies {
              productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
              productionRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
              productionRuntimeMods "com.cobblemon:fabric:1.8.1+1.21.1"
          }

          tasks.register('runProductionCardWorldsClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
              dependsOn tasks.named('remapJar'), tasks.named('remapQaJar')
              mods.from configurations.productionRuntimeMods
              mods.from tasks.named('remapJar').flatMap { it.archiveFile }
              mods.from tasks.named('remapQaJar').flatMap { it.archiveFile }
              jvmArgs.add('-Dcardworlds.qa=true')
              programArgs.addAll(['--width', '1280', '--height', '720'])
              runDir = file('run')
              useXVFB = true
          }
          GRADLE
          test -f src/main/java/vn/svarcade/tcg/duel/Duel.java
          test -f src/main/java/vn/svarcade/tcg/client/render/PokemonModels.java
          test -f src/qa/java/vn/svarcade/tcg/qa/VisualRun.java
          test -f tools/verify_artifact.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unit tests + remapped artifacts
        run: gradle --no-daemon clean verifyCardWorlds

      - name: Verify production jar and test evidence
        run: python3 tools/verify_artifact.py

      - name: Verify production jar metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVArcade-TCG-*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*qa-driver*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          grep -q '"id": "svarcade_tcg"' build/libs/fabric.mod.built.json
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Publish build/test evidence
        uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256.txt
            build/libs/fabric.mod.built.json
            build/test-results/test/*.xml
            build/internal-evidence.json
            build/reports/tests/test/**
          if-no-files-found: error

      - name: Install headless OpenGL runtime
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64

      - name: Download Minecraft client assets
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        run: gradle --no-daemon downloadAssets

      - name: Prepare Card Worlds QA driver
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          QA_JAR="$(find build/libs -maxdepth 1 -type f -name 'SVArcade-TCG-*-qa-driver.jar' | head -n1)"
          test -n "$QA_JAR"
          mkdir -p run/screenshots run/logs
          cat > run/options.txt <<'EOF'
          version:3955
          guiScale:3
          fullscreen:false
          maxFps:60
          renderDistance:5
          simulationDistance:5
          particles:1
          showSubtitles:false
          onboardAccessibility:false
          EOF
          echo "QA driver: $QA_JAR"
          jar tf "$QA_JAR" | grep -F 'vn/svarcade/tcg/qa/VisualRun.class'
          unzip -p "$QA_JAR" fabric.mod.json | tee build/libs/qa.fabric.mod.json
          grep -Eq '"id"[[:space:]]*:[[:space:]]*"cardworlds_qa"' build/libs/qa.fabric.mod.json

      - name: Boot Minecraft and capture Card Worlds scenes
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          JAVA_TOOL_OPTIONS: '-Dcardworlds.qa=true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s gradle --no-daemon --stacktrace runProductionCardWorldsClient

      - name: Verify Card Worlds visual evidence
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          test -f run/logs/latest.log
          echo "Captured screenshots:"
          find run/screenshots -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort

          expected=(
            01-home
            02-collection
            03-decks
            04-play
            05-market
            06-world
            07-packs
            08-pack-enter
            09-pack-opening
            10-pack-reveal
            11-pack-summary
            12-duel-summon
            13-duel-board
            14-duel-result
            15-reopen-y
            16-reopen-command
            17-scale-two
          )

          for name in "${expected[@]}"; do
            test -f "run/screenshots/$name.png"
            grep -Fq "Captured $name" run/logs/latest.log
          done

          count="$(find run/screenshots -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l)"
          test "$count" -eq 17
          ! find run/screenshots -maxdepth 1 -type f -name 'failure-*.png' | grep -q .
          grep -Fq 'CARDWORLDS_QA_COMPLETE' run/logs/latest.log

          if grep -Eiq 'CARDWORLDS_QA_FAILED|Minecraft has crashed!|ReportedException|Rendering screen|OpenGL error|Exception in thread "Render thread"' run/logs/latest.log; then
            echo 'Card Worlds visual smoke detected a crash/render failure' >&2
            grep -Ein 'CARDWORLDS_QA_FAILED|Minecraft has crashed!|ReportedException|Rendering screen|OpenGL error|Exception in thread "Render thread"' run/logs/latest.log | tail -n 120 >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = [
              "01-home", "02-collection", "03-decks", "04-play", "05-market",
              "06-world", "07-packs", "08-pack-enter", "09-pack-opening",
              "10-pack-reveal", "11-pack-summary", "12-duel-summon",
              "13-duel-board", "14-duel-result", "15-reopen-y",
              "16-reopen-command", "17-scale-two",
          ]
          for name in expected:
              p = Path("run/screenshots") / f"{name}.png"
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", (name, "not png")
              width, height = struct.unpack(">II", data[16:24])
              assert width >= 640 and height >= 360, (name, width, height)
              assert len(data) >= 20_000, (name, "suspiciously small", len(data))
              print(f"{name}: {width}x{height}, {len(data)} bytes")
          PY

      - name: Upload Card Worlds visual QA evidence
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]'))
        uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-visual-qa-${{ github.sha }}
          path: |
            run/screenshots/*.png
            run/logs/latest.log
            run/crash-reports/**
            build/libs/qa.fabric.mod.json
          if-no-files-found: warn
