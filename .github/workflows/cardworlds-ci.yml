name: Card Worlds CI

on:
  push:
    branches:
      - feature/yugioh-card-worlds-production-20260930
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardworlds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore Card Worlds source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/cardworlds-src.b64.part* | base64 -d > /tmp/cardworlds-src-tools.tar.gz
          echo "4e3596c43da9a15d98c44d56c76b0d58d70388dd2c70ab65db1d11f5a1e2aa37  /tmp/cardworlds-src-tools.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cardworlds-src-tools.tar.gz
          python3 source-overrides/apply.py
          test -f src/main/java/vn/svarcade/tcg/client/render/DuelWorldScene.java

          cat >> build.gradle <<'GRADLE'

          configurations {
              productionRuntimeMods
          }

          dependencies {
              productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
              productionRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
              productionRuntimeMods "com.cobblemon:fabric:1.8.1+1.21.1"
          }

          tasks.register('runProductionCardWorldsClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
              dependsOn tasks.named('remapJar'), tasks.named('remapQaJar')
              mods.from configurations.productionRuntimeMods
              mods.from tasks.named('remapJar').flatMap { it.archiveFile }
              mods.from tasks.named('remapQaJar').flatMap { it.archiveFile }
              jvmArgs.add('-Dcardworlds.qa=true')
              programArgs.addAll(['--width', '1280', '--height', '720'])
              runDir = file('run')
              useXVFB = true
          }
          GRADLE
          test -f src/main/java/vn/svarcade/tcg/duel/Duel.java
          test -f src/main/java/vn/svarcade/tcg/client/render/PokemonModels.java
          test -f src/qa/java/vn/svarcade/tcg/qa/VisualRun.java
          test -f tools/verify_artifact.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unit tests + remapped artifacts
        run: gradle --no-daemon clean verifyCardWorlds

      - name: Verify production jar and test evidence
        run: python3 tools/verify_artifact.py

      - name: Verify production jar metadata
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVArcade-TCG-*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*qa-driver*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          grep -q '"id": "svarcade_tcg"' build/libs/fabric.mod.built.json
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Publish build/test evidence
        uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256.txt
            build/libs/fabric.mod.built.json
            build/test-results/test/*.xml
            build/internal-evidence.json
            build/reports/tests/test/**
          if-no-files-found: error

      - name: Install headless OpenGL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64

      - name: Download Minecraft client assets
        run: gradle --no-daemon downloadAssets

      - name: Prepare Card Worlds QA driver
        shell: bash
        run: |
          set -euo pipefail
          QA_JAR="$(find build/libs -maxdepth 1 -type f -name 'SVArcade-TCG-*-qa-driver.jar' | head -n1)"
          test -n "$QA_JAR"
          mkdir -p run/screenshots run/logs
          cat > run/options.txt <<'EOF'
          version:3955
          guiScale:3
          fullscreen:false
          maxFps:60
          renderDistance:5
          simulationDistance:5
          particles:1
          showSubtitles:false
          onboardAccessibility:false
          EOF
          echo "QA driver: $QA_JAR"
          jar tf "$QA_JAR" | grep -F 'vn/svarcade/tcg/qa/VisualRun.class'
          unzip -p "$QA_JAR" fabric.mod.json | tee build/libs/qa.fabric.mod.json
          grep -Eq '"id"[[:space:]]*:[[:space:]]*"cardworlds_qa"' build/libs/qa.fabric.mod.json

      - name: Boot Minecraft and capture Card Worlds scenes
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          JAVA_TOOL_OPTIONS: '-Dcardworlds.qa=true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s gradle --no-daemon --stacktrace runProductionCardWorldsClient

      - name: Verify Card Worlds visual evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f run/logs/latest.log
          echo "Captured screenshots:"
          find run/screenshots -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort

          expected=(
            01-home
            02-collection
            03-decks
            04-play
            05-market
            06-world
            07-packs
            08-pack-enter
            09-pack-opening
            10-pack-reveal
            11-pack-summary
            12-duel-summon
            13-duel-board
            14-duel-freelook
            15-duel-result
            16-reopen-y
            17-reopen-command
            18-scale-two
            19-spectator
            20-spelltrap-set
            21-spelltrap-chain
            22-spelltrap-resolved
            23-arceus-defense
            24-arceus-judgement
            25-arceus-ultimate
            26-monster-positions
          )

          for name in "${expected[@]}"; do
            test -f "run/screenshots/$name.png"
            grep -Fq "Captured $name" run/logs/latest.log
          done

          count="$(find run/screenshots -maxdepth 1 -type f -name '[0-9][0-9]-*.png' | wc -l)"
          test "$count" -eq 26
          ! find run/screenshots -maxdepth 1 -type f -name 'failure-*.png' | grep -q .
          grep -Fq 'CARDWORLDS_QA_DUEL_REALM_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_SPECTATOR_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_SPELLTRAP_CHAIN_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_SPELLTRAP_RESOLVE_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_CREATION_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_MONSTER_POSITIONS_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_CATALOG_CONFIRMED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_ARCEUS_RENDERED' run/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_COMPLETE' run/logs/latest.log

          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("run/logs/latest.log").read_text(errors="replace")
          m = re.search(r"CARDWORLDS_CATALOG_HYDRATED cards=(\d+) species=(\d+) fakemon=(\d+) decks=(\d+) banners=(\d+)", log)
          assert m, "catalog hydration marker missing"
          cards, species, fakemon, decks, banners = map(int, m.groups())
          fm = re.search(r"CARDWORLDS_FORMS_HYDRATED baseSpecies=(\d+) forms=(\d+)", log)
          assert fm, "forms hydration marker missing"
          base_species, forms = map(int, fm.groups())
          assert species >= 1025, ("loaded species below requested National Dex coverage", species)
          assert base_species >= 1025, ("base species coverage below National Dex", base_species)
          assert forms > 0, ("Cobblemon form/aspect coverage missing", forms)
          assert cards >= 1025, ("catalog card coverage below requested baseline", cards)
          assert decks >= 15, ("generated deck coverage too small", decks)
          assert banners >= 10, ("generated pack/banner coverage too small", banners)
          print({"cards": cards, "species": species, "fakemon": fakemon, "forms": forms, "decks": decks, "banners": banners})
          PY

          if grep -Eiq 'CARDWORLDS_QA_FAILED|Minecraft has crashed!|ReportedException|Rendering screen|OpenGL error|Exception in thread "Render thread"' run/logs/latest.log; then
            echo 'Card Worlds visual smoke detected a crash/render failure' >&2
            grep -Ein 'CARDWORLDS_QA_FAILED|Minecraft has crashed!|ReportedException|Rendering screen|OpenGL error|Exception in thread "Render thread"' run/logs/latest.log | tail -n 120 >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import struct

          expected = [
              "01-home", "02-collection", "03-decks", "04-play", "05-market",
              "06-world", "07-packs", "08-pack-enter", "09-pack-opening",
              "10-pack-reveal", "11-pack-summary", "12-duel-summon",
              "13-duel-board", "14-duel-freelook", "15-duel-result",
              "16-reopen-y", "17-reopen-command", "18-scale-two",
              "19-spectator", "20-spelltrap-set", "21-spelltrap-chain",
              "22-spelltrap-resolved", "23-arceus-defense",
              "24-arceus-judgement", "25-arceus-ultimate",
              "26-monster-positions",
          ]
          for name in expected:
              p = Path("run/screenshots") / f"{name}.png"
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", (name, "not png")
              width, height = struct.unpack(">II", data[16:24])
              assert width >= 640 and height >= 360, (name, width, height)
              assert len(data) >= 20_000, (name, "suspiciously small", len(data))
              print(f"{name}: {width}x{height}, {len(data)} bytes")
          PY

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          screenshots = sorted(p.name for p in Path("run/screenshots").glob("[0-9][0-9]-*.png"))
          evidence = {
              "head_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "screenshots": screenshots,
              "screenshot_count": len(screenshots),
              "complete_marker": "CARDWORLDS_QA_COMPLETE",
          }
          Path("build/visual-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload Card Worlds visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-visual-qa-${{ github.sha }}
          path: |
            run/screenshots/*.png
            run/logs/latest.log
            run/crash-reports/**
            build/libs/qa.fabric.mod.json
            build/visual-evidence.json
          if-no-files-found: warn
