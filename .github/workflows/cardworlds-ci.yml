name: Card Worlds Focused Performance + Correctness CI

on:
  push:
    branches:
      - feature/yugioh-card-worlds-production-20260930
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardworlds-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore Card Worlds source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/cardworlds-src.b64.part* | base64 -d > /tmp/cardworlds-src-tools.tar.gz
          echo "4e3596c43da9a15d98c44d56c76b0d58d70388dd2c70ab65db1d11f5a1e2aa37  /tmp/cardworlds-src-tools.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cardworlds-src-tools.tar.gz
          python3 source-overrides/apply.py
          test -f src/main/java/vn/svarcade/tcg/integration/BEconomyCardWorlds.java
          test -f src/main/java/vn/svarcade/tcg/data/EffectEconomyQa.java
          test -f src/main/java/vn/svarcade/tcg/client/component/CurrencyPurchaseUi.java

          python3 source-overrides/duel-realm/production-visual/qa/verify_focused.py
          python3 source-overrides/duel-realm/production-visual/performance/verify.py
          python3 source-overrides/duel-realm/production-visual/card-gameplay/verify.py
          echo "apply from: 'source-overrides/duel-realm/production-visual/qa/focused.gradle'" >> build.gradle
          cat >> build.gradle <<'GRADLE'

def ygoFullQaLoomLoader = tasks.named('remapJar').get().getClass().classLoader
tasks.register('runYgoFullQaClient', ygoFullQaLoomLoader.loadClass('net.fabricmc.loom.task.prod.ClientProductionRunTask')) {
    dependsOn tasks.named('remapJar'), tasks.named('remapQaJar')
    mods.setFrom(configurations.focusedClientRuntimeMods,
        tasks.named('remapJar').flatMap { it.archiveFile },
        tasks.named('remapQaJar').flatMap { it.archiveFile })
    jvmArgs.add('-Dcardworlds.qa=true')
    programArgs.addAll(['--width','1280','--height','720'])
    runDir = file('run-ygo-visual')
    useXVFB = true
}
GRADLE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile and test gameplay determinism, races, persistence and UI
        run: gradle --no-daemon --max-workers=4 clean test remapJar remapQaJar remapFocusedQaJar

      - name: Verify focused build content
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVArcade-TCG-*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*qa-driver*' | head -n1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fq 'vn/svarcade/tcg/integration/BEconomyCardWorlds.class'
          jar tf "$JAR" | grep -Fq 'vn/svarcade/tcg/client/component/CurrencyPurchaseUi.class'
          jar tf "$JAR" | grep -Fq 'data/svarcade_tcg/deep_effects.json'
          unzip -p "$JAR" data/svarcade_tcg/deep_effects.json > build/deep_effects.built.json
          unzip -p "$JAR" data/svarcade_tcg/pokemon_effects.json > build/pokemon_effects.built.json
          python3 - <<'PY'
          import json
          d=json.load(open('build/deep_effects.built.json'))
          m=d['effectEconomy']
          assert m['monsterLpCosts']==0, m
          assert m['totalLpCosts']==1, m
          assert len(m['costKinds'])>=6, m
          assert 'LP_COST' in m['costKinds'] and 'DISCARD' in m['costKinds'] and 'TRIBUTE' in m['costKinds']
          print(m)
          PY
          python3 source-overrides/duel-realm/production-visual/qa/verify_focused.py --jars
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Benchmark populated concurrent duels (timings are evidence)
        shell: bash
        run: |
          set -euo pipefail
          for duels in 8 16 32; do
            gradle --no-daemon --max-workers=4 cardWorldsLoad -Pduels="$duels" -PloadTicks=120 | tee "build/load-$duels.log"
            test -f "build/performance/load-$duels.json"
            grep -Fq "CARDWORLDS_LOAD_PASS duels=$duels" "build/load-$duels.log"
          done

      - name: Prepare focused BEconomy runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-focused/config/beconomy
          cp source-overrides/duel-realm/production-visual/qa/beconomy-config.json run-focused/config/beconomy/config.json
          echo 'eula=true' > run-focused/eula.txt
          printf 'online-mode=false\nserver-port=25568\nview-distance=3\nsimulation-distance=3\n' > run-focused/server.properties

      - name: Runtime QA - effects, currencies, gacha only
        shell: bash
        run: |
          set -euo pipefail
          python3 source-overrides/duel-realm/production-visual/performance/check_server.py
          test -f run-focused/logs/latest.log
          grep -Fq 'Done (' run-focused/logs/latest.log
          grep -Eq 'CARDWORLDS_GAMEPLAY_IDENTITIES catalog=[0-9]+ authored=[0-9]+ external=0 minSignatureDistance=10/12 duplicatePrimary=0 duplicateMechanics=0 duplicateWording=0' run-focused/logs/latest.log

          grep -Eq 'CARDWORLDS_QA_EFFECT_COSTS pokemon_lp=0 total_lp=[0-9]+ kinds=.* signature=mind_theft:800 dark_current_lp=false' run-focused/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_ECONOMY authority=dedicated_server beastcoin=true huntercoin=true' run-focused/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_GACHA beastcoin=150 huntercoin=2 exchange_display=25000:1' run-focused/logs/latest.log
          grep -Eq 'CARDWORLDS_QA_BALANCES source=beconomy beastcoin=.* huntercoin=.* available=true' run-focused/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_REWARDS easy_win=0 easy_loss=0 normal_win=15 normal_loss=0 hard_win=20 hard_loss=5 pvp_win=30 pvp_loss=15 ranked_win=50 ranked_loss=25 currency=beastcoin hunter_reward=0' run-focused/logs/latest.log

          ! grep -Eiq 'Exception in thread|Encountered an unexpected exception|NoClassDefFoundError|Mixin apply failed' run-focused/logs/latest.log

      - name: Install focused visual runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64
          gradle --no-daemon downloadAssets
          mkdir -p run-focused-visual/screenshots

      - name: Capture focused screens and verify every pack preview
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=15s 240s gradle --no-daemon --stacktrace runFocusedCardWorldsClient > build/focused-client.log 2>&1 || { cat build/focused-client.log; exit 1; }
          cat build/focused-client.log
          test -f run-focused-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_FOCUSED_VISUAL_DRIVER initializer=FocusedEconomyEffectVisualRun' run-focused-visual/logs/latest.log
          for name in focused-01-effect-card focused-02-economy-rewards focused-03-gacha-currencies; do
            test -f "run-focused-visual/screenshots/$name.png"
            grep -Fq "Captured $name" run-focused-visual/logs/latest.log
          done
          grep -Fq 'CARDWORLDS_FOCUSED_CURRENCY_RENDER item=minecraft:gold_ingot beast_cmd=6 hunter_cmd=2 proof=descriptor_only server_resource_pack_loaded=false' run-focused-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_FOCUSED_VISUAL_QA_COMPLETE screenshots=3' run-focused-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_FOCUSED_CLIENT beconomy=absent dependency=NONE' run-focused-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_FOCUSED_HEADER currencies=beastcoin,huntercoin balances=unavailable item=minecraft:gold_ingot beast_cmd=6 hunter_cmd=2' run-focused-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_FOCUSED_PACK_SCOPE packs=14' run-focused-visual/logs/latest.log
          python3 source-overrides/duel-realm/production-visual/qa/verify_pack_evidence.py
          for step in boot collection play packs; do
            grep -Fq "CARDWORLDS_FOCUSED_VISUAL_STEP $step" run-focused-visual/logs/latest.log
          done
          if grep -E 'CARDWORLDS_QA_CREATE_WORLD|CARDWORLDS_QA_DRIVER_LOADED|CARDWORLDS_QA_FAILED|CARDWORLDS_FOCUSED_VISUAL_QA_FAILED|CARDWORLDS_SCROLL_PACKS_PROOF|Captured 0[1-9]-|Unable to find a poser' run-focused-visual/logs/latest.log; then
            echo 'Focused client entered a forbidden full-suite path or failed readiness' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import struct
          expected={"focused-01-effect-card.png","focused-02-economy-rewards.png","focused-03-gacha-currencies.png"}
          assert {p.name for p in Path("run-focused-visual/screenshots").glob("*.png")}==expected
          for name in ("focused-01-effect-card","focused-02-economy-rewards","focused-03-gacha-currencies"):
              p=Path("run-focused-visual/screenshots")/(name+".png")
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", name
              w,h=struct.unpack(">II",data[16:24])
              assert w>=1280 and h>=720,(name,w,h)
              assert len(data)>=20000,(name,len(data))
              print(name,w,h,len(data))
          PY

      - name: Runtime QA - full Duel Realm and Yu-Gi-Oh presentation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run-ygo-visual
          mkdir -p run-ygo-visual/screenshots
          timeout --signal=INT --kill-after=20s 420s gradle --no-daemon --stacktrace runYgoFullQaClient > build/ygo-runtime-client.log 2>&1 || { cat build/ygo-runtime-client.log; exit 1; }
          cat build/ygo-runtime-client.log
          test -f run-ygo-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_DRIVER_LOADED focusedVisual=false' run-ygo-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_DUEL_REALM_CONFIRMED world=svarcade_tcg:duel_realm' run-ygo-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_MONSTER_POSITIONS_CONFIRMED' run-ygo-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_SPELLTRAP_CHAIN_CONFIRMED' run-ygo-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_CREATION_CONFIRMED stage=Ultimate Arceus' run-ygo-visual/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_COMPLETE' run-ygo-visual/logs/latest.log
          ! grep -Eq 'CARDWORLDS_QA_FAILED|Exception in thread|Encountered an unexpected exception|NoClassDefFoundError|Mixin apply failed' run-ygo-visual/logs/latest.log
          test -f run-ygo-visual/screenshots/26-monster-positions.png
          echo 'CARDWORLDS_YGO_FULL_RUNTIME_QA_PASS'

      - name: Upload focused build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-performance-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256.txt
            build/deep_effects.built.json
            build/pokemon_effects.built.json
            build/performance/*.json
            build/load-*.log
            build/test-results/test/*.xml
            build/focused-runtime.log
            build/focused-client.log
            run-focused/logs/latest.log
            run-focused-visual/screenshots/*.png
            run-focused-visual/packs-qa/screenshots/*.png
            run-focused-visual/logs/latest.log
            build/ygo-runtime-client.log
            run-ygo-visual/screenshots/*.png
            run-ygo-visual/logs/latest.log
          if-no-files-found: warn
