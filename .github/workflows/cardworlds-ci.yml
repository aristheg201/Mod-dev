name: Card Worlds Focused Economy + Effects CI

on:
  push:
    branches:
      - feature/yugioh-card-worlds-production-20260930
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardworlds-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Restore Card Worlds source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/cardworlds-src.b64.part* | base64 -d > /tmp/cardworlds-src-tools.tar.gz
          echo "4e3596c43da9a15d98c44d56c76b0d58d70388dd2c70ab65db1d11f5a1e2aa37  /tmp/cardworlds-src-tools.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cardworlds-src-tools.tar.gz
          python3 source-overrides/apply.py
          test -f src/main/java/vn/svarcade/tcg/integration/BEconomyCardWorlds.java
          test -f src/main/java/vn/svarcade/tcg/data/EffectEconomyQa.java
          test -f src/main/java/vn/svarcade/tcg/client/component/CurrencyPurchaseUi.java

          cat >> build.gradle <<'GRADLE'

          repositories {
              maven { url 'https://maven.architectury.dev/' }
              maven { url 'https://maven.wispforest.io/releases' }
              maven { url 'https://api.modrinth.com/maven' }
          }

          configurations {
              focusedRuntimeMods
          }

          dependencies {
              focusedRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
              focusedRuntimeMods "net.fabricmc:fabric-language-kotlin:1.13.6+kotlin.2.2.20"
              focusedRuntimeMods "com.cobblemon:fabric:1.8.1+1.21.1"
              focusedRuntimeMods "dev.architectury:architectury-fabric:13.0.8"
              focusedRuntimeMods "io.wispforest:accessories-fabric:1.1.0-beta.52+1.21.1"
              focusedRuntimeMods "maven.modrinth:SszvX85I:1.2.0+1.8.1+1.21.1-release"
              focusedRuntimeMods "maven.modrinth:eXts2L7r:U5bhVym2"
              focusedRuntimeMods "maven.modrinth:4Kma4Oms:9rGoa3aP"
              focusedRuntimeMods "maven.modrinth:s7N7AsqL:NQdxKsW7"
              focusedRuntimeMods "maven.modrinth:LdBYVaPS:KwNU9SQW"
              focusedRuntimeMods "maven.modrinth:Vebnzrzj:l47d4ZWk"
          }

          tasks.register('runFocusedCardWorldsServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
              dependsOn tasks.named('remapJar')
              mods.from configurations.focusedRuntimeMods
              mods.from tasks.named('remapJar').flatMap { it.archiveFile }
              jvmArgs.add('-Dcardworlds.qa.focused=true')
              runDir = file('run-focused')
          }
          tasks.register('runFocusedCardWorldsClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
              dependsOn tasks.named('remapJar'), tasks.named('remapQaJar')
              mods.from configurations.focusedRuntimeMods
              mods.from tasks.named('remapJar').flatMap { it.archiveFile }
              mods.from tasks.named('remapQaJar').flatMap { it.archiveFile }
              // BEconomy is server-environment only and is intentionally not loaded in the client process.
              // The standalone focused server step already validates live BEconomy. Client visual QA only renders the three requested screens.
              jvmArgs.addAll('-Dcardworlds.qa=true','-Dcardworlds.qa.focused.visual=true')
              programArgs.addAll(['--width','1280','--height','720'])
              runDir = file('run-focused-visual')
              useXVFB = true
          }
          GRADLE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile focused production jar
        run: gradle --no-daemon clean classes remapJar remapQaJar

      - name: Verify focused build content
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVArcade-TCG-*.jar' ! -name '*sources*' ! -name '*dev*' ! -name '*qa-driver*' | head -n1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fq 'vn/svarcade/tcg/integration/BEconomyCardWorlds.class'
          jar tf "$JAR" | grep -Fq 'vn/svarcade/tcg/client/component/CurrencyPurchaseUi.class'
          jar tf "$JAR" | grep -Fq 'data/svarcade_tcg/deep_effects.json'
          unzip -p "$JAR" data/svarcade_tcg/deep_effects.json > build/deep_effects.built.json
          python3 - <<'PY'
          import json
          d=json.load(open('build/deep_effects.built.json'))
          m=d['effectEconomy']
          assert m['monsterLpCosts']==0, m
          assert m['totalLpCosts']==1, m
          assert len(m['costKinds'])>=6, m
          assert 'LP_COST' in m['costKinds'] and 'DISCARD' in m['costKinds'] and 'TRIBUTE' in m['costKinds']
          print(m)
          PY
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Prepare focused BEconomy runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-focused/config/beconomy
          cp source-overrides/duel-realm/production-visual/qa/beconomy-config.json run-focused/config/beconomy/config.json
          echo 'eula=true' > run-focused/eula.txt
          printf 'online-mode=false\nserver-port=25568\nview-distance=3\nsimulation-distance=3\n' > run-focused/server.properties

      - name: Runtime QA - effects, currencies, gacha only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=INT --kill-after=15s 150s gradle --no-daemon runFocusedCardWorldsServer > build/focused-runtime.log 2>&1
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124 -o "$status" -eq 137
          test -f run-focused/logs/latest.log
          grep -Fq 'Done (' run-focused/logs/latest.log

          grep -Eq 'CARDWORLDS_QA_EFFECT_COSTS pokemon_lp=0 total_lp=[0-9]+ kinds=.* signature=mind_theft:800 dark_current_lp=false' run-focused/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_ECONOMY beastcoin=true huntercoin=true beast_visual=minecraft:gold_ingot:6 hunter_visual=minecraft:gold_ingot:2' run-focused/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_GACHA beastcoin=150 huntercoin=2 exchange_display=25000:1' run-focused/logs/latest.log
          grep -Fq 'CARDWORLDS_QA_REWARDS easy_win=0 easy_loss=0 normal_win=15 normal_loss=0 hard_win=20 hard_loss=5 pvp_win=30 pvp_loss=15 ranked_win=50 ranked_loss=25 currency=beastcoin hunter_reward=0' run-focused/logs/latest.log

          ! grep -Eiq 'Exception in thread|Encountered an unexpected exception|NoClassDefFoundError|Mixin apply failed' run-focused/logs/latest.log

      - name: Install focused visual runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64
          gradle --no-daemon downloadAssets
          mkdir -p run-focused-visual/config/beconomy run-focused-visual/screenshots
          cp source-overrides/duel-realm/production-visual/qa/beconomy-config.json run-focused-visual/config/beconomy/config.json

      - name: Capture focused effect, reward, and gacha screens
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          JAVA_TOOL_OPTIONS: '-Dcardworlds.qa=true -Dcardworlds.qa.focused.visual=true'
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s gradle --no-daemon --stacktrace runFocusedCardWorldsClient
          test -f run-focused-visual/logs/latest.log
          for name in focused-01-effect-card focused-02-economy-rewards focused-03-gacha-currencies; do
            test -f "run-focused-visual/screenshots/$name.png"
            grep -Fq "Captured $name" run-focused-visual/logs/latest.log
          done
          grep -Fq 'CARDWORLDS_FOCUSED_VISUAL_QA_COMPLETE screenshots=3' run-focused-visual/logs/latest.log
          ! find run-focused-visual/screenshots -maxdepth 1 -type f -name 'focused-failure-*.png' | grep -q .
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ("focused-01-effect-card","focused-02-economy-rewards","focused-03-gacha-currencies"):
              p=Path("run-focused-visual/screenshots")/(name+".png")
              data=p.read_bytes()
              assert data[:8]==b"\x89PNG\r\n\x1a\n", name
              w,h=struct.unpack(">II",data[16:24])
              assert w>=1280 and h>=720,(name,w,h)
              assert len(data)>=20000,(name,len(data))
              print(name,w,h,len(data))
          PY

      - name: Upload focused build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-focused-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/libs/SHA256.txt
            build/deep_effects.built.json
            build/focused-runtime.log
            run-focused/logs/latest.log
            run-focused-visual/screenshots/*.png
            run-focused-visual/logs/latest.log
          if-no-files-found: warn
