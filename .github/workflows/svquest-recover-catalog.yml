name: SVQuest recover clean catalog

on:
  push:
    branches: [build/svquest]
    paths:
      - '.github/workflows/svquest-recover-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact UTF-8 repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/svquest-recovery
          python3 - <<'PY' | tee /tmp/svquest-recovery/report.txt
          import base64, gzip, hashlib, json, zlib
          from pathlib import Path

          TARGET='9c8973547f7cafc6d8b272fada60e34e2d3cb7798ef31982c838f0ef1b3af555'
          BAD_OFFSET=307219
          enc=''.join(''.join(Path(f'SVQuest/src/main/resources/svquest/full/default_quests.{i:02d}.b64').read_text().split()) for i in range(8))
          assert len(enc)==44932, len(enc)
          gz=base64.b64decode(enc)
          flags=gz[3]; pos=10
          if flags & 0x04:
              xlen=gz[pos] | (gz[pos+1]<<8); pos += 2+xlen
          if flags & 0x08: pos=gz.index(b'\0',pos)+1
          if flags & 0x10: pos=gz.index(b'\0',pos)+1
          if flags & 0x02: pos+=2
          raw=zlib.decompress(gz[pos:-8],-15)

          print('raw bytes:',len(raw),'raw sha256:',hashlib.sha256(raw).hexdigest())
          print('repair context before:',repr(raw[BAD_OFFSET-40:BAD_OFFSET+42].decode('utf-8',errors='replace')))
          print('bad bytes:',raw[BAD_OFFSET:BAD_OFFSET+2].hex())
          assert len(raw)==312842, len(raw)
          assert raw[BAD_OFFSET:BAD_OFFSET+2]==b'\xe1\xe1', raw[BAD_OFFSET:BAD_OFFSET+2].hex()

          repaired=raw[:BAD_OFFSET] + 'ụ'.encode('utf-8') + raw[BAD_OFFSET+2:]
          text=repaired.decode('utf-8')  # STRICT. No U+FFFD recovery allowed.
          root=json.loads(text)
          quests=root['quests']
          assert len(quests)==618
          objectives=sum(len(q.get('objectives',[])) for q in quests)
          assert objectives==1617, objectives
          ids=[q['id'] for q in quests]
          assert len(ids)==len(set(ids))
          known=set(ids)
          dangling=[(q['id'],p) for q in quests for p in q.get('prerequisites',[]) if p not in known]
          assert not dangling, dangling[:20]
          target=[q for q in quests if q['id']=='endmaster_12_raid_solo_champion']
          assert len(target)==1
          print('repair context after:',repr(repaired[BAD_OFFSET-40:BAD_OFFSET+43].decode('utf-8')))
          print('quest title:',repr(target[0]['title']))
          assert target[0]['title']=='Chinh phục Legendary Raid', target[0]['title']
          assert '\ufffd' not in text

          digest=hashlib.sha256(repaired).hexdigest()
          print('repaired raw bytes:',len(repaired))
          print('repaired raw sha256:',digest)
          print('canonical target sha256:',TARGET)
          print('canonical match:',digest==TARGET)
          print('catalog: 618 quests / 1617 objectives / unique ids / no dangling prerequisites / strict UTF-8 OK')
          Path('/tmp/svquest-recovery/recovered-default_quests.json').write_bytes(repaired)

          clean_gz=gzip.compress(repaired,compresslevel=9,mtime=0)
          clean_enc=base64.b64encode(clean_gz).decode('ascii')
          print('clean gzip bytes:',len(clean_gz),'b64 chars:',len(clean_enc),'gzip sha256:',hashlib.sha256(clean_gz).hexdigest())
          step=(len(clean_enc)+7)//8
          for i in range(8):
              Path(f'/tmp/svquest-recovery/default_quests.{i:02d}.b64').write_text(clean_enc[i*step:(i+1)*step])
          PY

      - name: Upload exact recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SVQuest-catalog-exact-recovery
          path: /tmp/svquest-recovery/
          if-no-files-found: error
