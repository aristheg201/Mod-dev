name: SVQuest recover clean catalog

on:
  push:
    branches: [build/svquest]
    paths:
      - '.github/workflows/svquest-recover-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download historical beta.6 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/svquest-history
          for id in 9765171406 9765289179; do
            curl -fL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "/tmp/svquest-history/${id}.zip"
          done
          ls -lh /tmp/svquest-history

      - name: Recursively inspect artifacts for clean quest catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee /tmp/svquest-history/recovery-report.txt
          import base64, gzip, hashlib, io, json, re, zipfile
          from pathlib import Path

          TARGET_SHA='9c8973547f7cafc6d8b272fada60e34e2d3cb7798ef31982c838f0ef1b3af555'
          found=[]
          seen=set()

          def test_catalog(data,label):
              try:
                  text=data.decode('utf-8')
              except UnicodeDecodeError:
                  return False
              try:
                  root=json.loads(text)
              except Exception:
                  return False
              if not isinstance(root,dict) or not isinstance(root.get('quests'),list):
                  return False
              quests=root['quests']
              objectives=sum(len(q.get('objectives',[])) for q in quests if isinstance(q,dict))
              digest=hashlib.sha256(data).hexdigest()
              ids=[q.get('id') for q in quests if isinstance(q,dict)]
              unique=len(ids)==len(set(ids)) and all(isinstance(x,str) and x for x in ids)
              known=set(ids)
              dangling=[]
              for q in quests:
                  if not isinstance(q,dict): continue
                  for p in q.get('prerequisites',[]):
                      if p not in known: dangling.append((q.get('id'),p))
              print(f'CATALOG {label}: quests={len(quests)} objectives={objectives} sha256={digest} unique_ids={unique} dangling={len(dangling)} bytes={len(data)}')
              if len(quests)==618 and objectives==1617 and unique and not dangling:
                  out=Path('/tmp/svquest-history/recovered-default_quests.json')
                  out.write_bytes(data)
                  found.append((label,digest,len(data)))
                  print('ACCEPTED 618/1617 clean UTF-8 catalog:', label)
                  if digest==TARGET_SHA:
                      print('CANONICAL SHA MATCH')
                  return True
              return False

          def maybe_base64(data,label,depth):
              if len(data)>2_000_000: return
              try:
                  text=data.decode('ascii')
              except Exception:
                  return
              compact=''.join(text.split())
              if len(compact)<64 or len(compact)%4 or not re.fullmatch(r'[A-Za-z0-9+/=]+',compact):
                  return
              try:
                  decoded=base64.b64decode(compact,validate=True)
              except Exception:
                  return
              visit(decoded,label+' -> base64',depth+1)

          def visit(data,label,depth=0):
              if depth>6 or not data: return
              key=(len(data),hashlib.sha256(data).digest())
              if key in seen: return
              seen.add(key)
              test_catalog(data,label)
              if data[:2]==b'\x1f\x8b':
                  try: visit(gzip.decompress(data),label+' -> gzip',depth+1)
                  except Exception as e: print('gzip failed',label,repr(e))
              try:
                  if zipfile.is_zipfile(io.BytesIO(data)):
                      with zipfile.ZipFile(io.BytesIO(data)) as z:
                          names=z.namelist()
                          print(f'ZIP {label}: {len(names)} entries')
                          for n in names:
                              if n.endswith('/'): continue
                              lower=n.lower()
                              if any(x in lower for x in ('quest','svquest','catalog','json','source')):
                                  print('  ENTRY',n)
                              try: child=z.read(n)
                              except Exception: continue
                              if lower.endswith(('.zip','.jar','.json','.json.gz','.gz','.b64','.txt','.java')) or b'"quests"' in child[:2000000]:
                                  visit(child,label+' -> '+n,depth+1)
              except Exception as e:
                  print('zip inspect failed',label,repr(e))
              maybe_base64(data,label,depth)

          for p in sorted(Path('/tmp/svquest-history').glob('*.zip')):
              print('\n===',p.name,'===')
              visit(p.read_bytes(),p.name)

          # Also inspect every historical catalog representation still reachable through git.
          refs=[
              ('88822f01f57c7dea6ab39fe8bc3897d09b0aed87','SVQuest/src/main/resources/svquest/catalog/default_quests.00.b64'),
              ('58bdf1ea2a615e4d52bf364a6d6f5fb2533fb275','SVQuest/src/main/resources/svquest/catalog/default_quests.01.b64'),
              ('e10aee1ad839bda54ad26dfda2dddfb8734fc592','SVQuest/src/main/resources/svquest/catalog/default_quests.02.b64'),
              ('cb859b795165968393b6b3a205f651787b6ff6dc','svquest/default_quests.json.gz.b64'),
          ]
          import subprocess
          for ref,path in refs:
              try:
                  data=subprocess.check_output(['git','show',f'{ref}:{path}'])
              except Exception as e:
                  print('git show failed',ref,path,e); continue
              print('\n=== GIT',ref[:8],path,len(data),'bytes ===')
              visit(data,f'git:{ref[:8]}:{path}')

          if not found:
              raise SystemExit('NO CLEAN 618/1617 CATALOG FOUND IN HISTORICAL ARTIFACTS OR GIT REPRESENTATIONS')
          print('\nRECOVERED:',found)
          PY

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SVQuest-catalog-recovery-report
          path: |
            /tmp/svquest-history/recovery-report.txt
            /tmp/svquest-history/recovered-default_quests.json
          if-no-files-found: warn
