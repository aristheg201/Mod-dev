name: Diagnose Cobblemon 1.8.2 Dex Reload Crash
on:
  push:
    branches: [fix/cobblemon182-dex-evolution-display]
    paths: ['.github/workflows/probe-cobblemon182-dex.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Fetch original Cobblemon 1.8.2 and disassemble exact failing methods
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,json
          url='https://api.modrinth.com/v2/version/GJ2a1b8O'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SV-dex-diagnostic/1.0'}),timeout=60) as req: x=json.load(req)
          f=next((f for f in x['files'] if f.get('primary')),x['files'][0])
          with urllib.request.urlopen(urllib.request.Request(f['url'],headers={'User-Agent':'SV-dex-diagnostic/1.0'}),timeout=90) as req:
              open('/tmp/cobblemon182.jar','wb').write(req.read())
          print('Version',x['version_number'],'filename',f['filename'])
          PY
          javap -c -p -l -classpath /tmp/cobblemon182.jar com.cobblemon.mod.common.api.pokedex.entry.DexEvolutionDisplayKt > /tmp/dex.jv
          javap -c -p -l -classpath /tmp/cobblemon182.jar com.cobblemon.mod.common.api.pokedex.entry.DexEntries > /tmp/entries.jv
          echo '==== DEX METHODS DISASSEMBLY ==== '
          cat /tmp/dex.jv
          echo '==== DEX ENTRIES METHODS DISASSEMBLY ==== '
          cat /tmp/entries.jv
          echo '==== AVAILABLE RESOURCES ===='
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/cobblemon182.jar') as z:
              names=z.namelist()
              for pref in ['data/cobblemon/dex_entries/','data/cobblemon/species/']:
                  f=[x for x in names if x.startswith(pref)]
                  print(pref,'count',len(f),'examples',f[:8])
          PY