name: Test Cobblemon 1.8.2 direct-item vs item-tag evolution
on:
  workflow_dispatch:
  push:
    branches: [fix/cobblemon182-dex-evolution-display]
    paths: ['.github/workflows/test-cobblemon182-evolution-tags.yml']
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, tagged]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Minecraft and Cobblemon
        run: |
          set -euo pipefail
          mkdir -p /tmp/dex-smoke/mods
          python3 - <<'PY'
          import json,urllib.request
          def dl(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Cobblemon182-Test'}),timeout=120) as r:return r.read()
          v=json.loads(dl('https://api.modrinth.com/v2/project/cobblemon/version'))
          v=next(x for x in v if '1.8.2' in x['version_number'] and 'fabric' in x['loaders'] and '1.21.1' in x['game_versions'])
          f=next((x for x in v['files'] if x.get('primary')),v['files'][0])
          open('/tmp/dex-smoke/mods/cobblemon.jar','wb').write(dl(f['url']))
          PY
          curl -fsSL --retry 3 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.17+1.21.1/fabric-api-0.116.17+1.21.1.jar' -o /tmp/dex-smoke/mods/fabric-api.jar
          curl -fsSL --retry 3 'https://maven.fabricmc.net/net/fabricmc/fabric-language-kotlin/1.13.7+kotlin.2.2.21/fabric-language-kotlin-1.13.7+kotlin.2.2.21.jar' -o /tmp/dex-smoke/mods/fabric-language-kotlin.jar
          curl -fsSL --retry 3 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.1/fabric-installer-1.1.1.jar' -o /tmp/dex-smoke/fabric-installer.jar
          cd /tmp/dex-smoke
          java -jar fabric-installer.jar server -mcversion 1.21.1 -loader 0.18.4 -downloadMinecraft
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nmax-tick-time=-1\nview-distance=2\nsimulation-distance=2\n' > server.properties
      - name: Install minimal real-data-format test datapack
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/dex-smoke/world/datapacks/sv-evolution-test')
          p.mkdir(parents=True,exist_ok=True)
          (p/'pack.mcmeta').write_text(json.dumps({'pack':{'pack_format':48,'description':'Cobblemon evolution crash regression'}}))
          item='cobblemon:thunder_stone' if os.environ['MODE']=='direct' else '#svdexcompat:required/test/cobblemon/thunder_stone'
          species={'target':'cobblemon:pikachu','evolutions':[{'id':'svfix_pikachu_raichu','variant':'item_interact','result':'raichu','consumeHeldItem':False,'learnableMoves':[],'requirements':[],'requiredContext':item}]}
          s=p/'data/cobblemon/species_additions/test/pikachu.json';s.parent.mkdir(parents=True,exist_ok=True);s.write_text(json.dumps(species))
          tag={'replace':False,'values':[{'id':'cobblemon:thunder_stone','required':False},'minecraft:barrier']}
          s=p/'data/svdexcompat/tags/item/required/test/cobblemon/thunder_stone.json';s.parent.mkdir(parents=True,exist_ok=True);s.write_text(json.dumps(tag))
          print('Testing',os.environ['MODE'],item)
          PY
      - name: Start Minecraft server and inspect DexEntries
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          cd /tmp/dex-smoke
          java -Xms512M -Xmx3G -jar fabric-server-launch.jar nogui > "$GITHUB_WORKSPACE/server-$MODE.log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if grep -Eq 'Done \(' "$GITHUB_WORKSPACE/server-$MODE.log"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid" || true; wait "$pid" || true; fi
          grep -E 'data pack|NoSuchElementException|No value present|Failed to load datapacks|Done \(' "$GITHUB_WORKSPACE/server-$MODE.log" | tail -n 35 || true
          if [ "$MODE" = "direct" ]; then
            grep -Eq 'NoSuchElementException|No value present' "$GITHUB_WORKSPACE/server-$MODE.log"
            echo 'PASS - original direct item repro crashes in DexEvolutionDisplayKt'
          else
            grep -Eq 'Done \(' "$GITHUB_WORKSPACE/server-$MODE.log"
            if grep -Eq 'Failed to load datapacks|NoSuchElementException|A mod crashed on startup' "$GITHUB_WORKSPACE/server-$MODE.log"; then exit 1; fi
            echo 'PASS - converted private item tag starts dedicated server'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dex-evolution-${{ matrix.mode }}-log
          path: server-*.log
          if-no-files-found: warn
