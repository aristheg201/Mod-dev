name: Cobblemon Economy 1.8 port

on:
  push:
    branches:
      - port/cobblemon-1.8-addons
    paths:
      - '.github/workflows/cobblemon-economy-1.8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/cobblemon-1.8-addons
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Fetch upstream source
        run: git clone --depth 1 https://github.com/Ryvexam/CobblemonEconomyMod.git work/cobblemon-economy
      - name: Apply Cobblemon 1.8 port
        working-directory: work/cobblemon-economy
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('gradle.properties')
          s = p.read_text()
          s = s.replace('loader_version=0.16.5', 'loader_version=0.18.4')
          s = s.replace('fabric_version=0.103.0+1.21.1', 'fabric_version=0.116.15+1.21.1')
          s = s.replace('mod_version=0.0.17', 'mod_version=0.0.17+1.8-port.1')
          s = s.replace('cobblemon_version=1.7.1+1.21.1', 'cobblemon_version=1.8.0+1.21.1')
          p.write_text(s)

          p = Path('build.gradle.kts')
          s = p.read_text()
          s = s.replace('id("fabric-loom") version "1.7-SNAPSHOT"', 'id("fabric-loom") version "1.14.10"')
          s = s.replace('kotlin("jvm") version "1.9.22"', 'kotlin("jvm") version "2.2.20"')
          s = s.replace('modImplementation("maven.modrinth:cobblemon:1.7.1")', 'modImplementation("maven.modrinth:MdwFAVRL:YgmyyFcs")')
          p.write_text(s)

          for p in Path('src').rglob('*.java'):
              s = p.read_text()
              patched = s.replace('PokedexEntryProgress.CAUGHT', 'PokedexEntryProgress.OWNED')
              patched = patched.replace(
                  'new ModelWidget(x, y, w, h, pokemon.asRenderablePokemon(), scale, 0.0f, 0.0, false, true)',
                  'new ModelWidget(x, y, w, h, pokemon.asRenderablePokemon(), scale, 0.0f, 0.0, false, true, 13)'
              )
              if patched != s:
                  p.write_text(patched)
                  print(f'patched {p}')

          p = Path('src/main/resources/fabric.mod.json')
          s = p.read_text()
          s = s.replace('"cobblemon": ">=1.7.1"', '"cobblemon": ">=1.8.0 <1.9.0"')
          p.write_text(s)
          PY
      - name: Show port diff
        working-directory: work/cobblemon-economy
        run: git diff -- gradle.properties build.gradle.kts src/main/java/com/cobblemon/economy/events/CobblemonListeners.java src/main/java/com/cobblemon/economy/client/QuestBoardScreen.java src/main/resources/fabric.mod.json
      - name: Build
        working-directory: work/cobblemon-economy
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cobblemon-economy-0.0.17-cobblemon-1.8
          path: |
            work/cobblemon-economy/build/libs/*.jar
            !work/cobblemon-economy/build/libs/*-sources.jar
          if-no-files-found: error
      - name: Publish direct JAR
        run: |
          set -euxo pipefail
          mkdir -p dist
          JAR="$(find work/cobblemon-economy/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          cp "$JAR" dist/CobblemonEconomy-0.0.17-1.8-port.jar
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/CobblemonEconomy-0.0.17-1.8-port.jar
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Cobblemon Economy 1.8 port [skip ci]'
          git push origin HEAD:port/cobblemon-1.8-addons
