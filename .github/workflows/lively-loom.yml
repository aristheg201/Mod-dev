name: Lively Loom build

on:
  push:
    branches:
      - feature/lively-npcs
  pull_request:
    branches:
      - main
    paths:
      - 'lively-npcs/**'
      - 'lively-npcs-integration/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/lively-loom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enforce core dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^import (com\.cobblemon\.|net\.luckperms\.|vn\.beconomy\.|com\.beconomy\.|.*holodisplay)' lively-npcs/src/main/java; then
            echo 'Lively Core imported an ecosystem implementation. Move it to lively-npcs-integration.' >&2
            exit 1
          fi
          if grep -RInE '^import (com\.openai\.|com\.anthropic\.|com\.google\.genai\.)' lively-npcs/src/main/java lively-npcs-integration/src/main/java; then
            echo 'External/cloud AI dependency is forbidden in Lively.' >&2
            exit 1
          fi
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Tests and Loom remap build
        run: gradle --no-daemon clean test remapJar
      - name: Dedicated server boot smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lively-npcs/run
          printf 'eula=true\n' > lively-npcs/run/eula.txt
          set +e
          timeout --signal=TERM --kill-after=15s 120s gradle --no-daemon :lively-npcs:runServer > lively-npcs/build/server-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat lively-npcs/build/server-smoke.log
            exit "$code"
          fi
          grep -q 'Lively NPCs initialized: living-world runtime ready for dedicated and integrated singleplayer servers' lively-npcs/build/server-smoke.log
          grep -q 'Done (' lively-npcs/build/server-smoke.log
          if grep -E 'Exception in server tick loop|Minecraft Crash Report|Could not execute entrypoint stage' lively-npcs/build/server-smoke.log; then
            cat lively-npcs/build/server-smoke.log
            exit 1
          fi
      - name: Cobblemon integration server boot smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lively-npcs-integration/run
          printf 'eula=true\n' > lively-npcs-integration/run/eula.txt
          set +e
          timeout --signal=TERM --kill-after=15s 150s gradle --no-daemon :lively-npcs-integration:runServer > lively-npcs-integration/build/server-smoke.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            cat lively-npcs-integration/build/server-smoke.log
            exit "$code"
          fi
          grep -q 'Lively NPCs initialized: living-world runtime ready for dedicated and integrated singleplayer servers' lively-npcs-integration/build/server-smoke.log
          grep -q 'Lively NPCs Integration initialized; Cobblemon=true' lively-npcs-integration/build/server-smoke.log
          grep -q 'Done (' lively-npcs-integration/build/server-smoke.log
          if grep -E 'Exception in server tick loop|Minecraft Crash Report|Could not execute entrypoint stage|Mixin apply failed' lively-npcs-integration/build/server-smoke.log; then
            cat lively-npcs-integration/build/server-smoke.log
            exit 1
          fi
      - name: Verify both mod artifacts
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find lively-npcs/build/libs -maxdepth 1 -type f -name 'Lively-NPCs-*.jar' ! -name '*sources*' | head -n1)"
          INTEGRATION="$(find lively-npcs-integration/build/libs -maxdepth 1 -type f -name 'Lively-NPCs-Integration-*.jar' ! -name '*sources*' | head -n1)"
          test -n "$CORE"
          test -n "$INTEGRATION"
          unzip -t "$CORE"
          unzip -t "$INTEGRATION"
          unzip -p "$CORE" fabric.mod.json > lively-npcs/build/libs/fabric.mod.built.json
          unzip -p "$INTEGRATION" fabric.mod.json > lively-npcs-integration/build/libs/fabric.mod.built.json
          grep -q '"id": "livelynpcs"' lively-npcs/build/libs/fabric.mod.built.json
          grep -q '"id": "livelynpcs_integration"' lively-npcs-integration/build/libs/fabric.mod.built.json
          if jar tf "$CORE" | grep -q '^vn/svframe/lively/integration/'; then
            echo 'Integration implementation leaked into core JAR.' >&2
            exit 1
          fi
          sha256sum "$CORE" "$INTEGRATION" | tee SHA256.txt
      - name: Upload Lively artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lively-native-npc-runtime
          path: |
            lively-npcs/build/libs/*.jar
            lively-npcs/build/libs/fabric.mod.built.json
            lively-npcs/build/server-smoke.log
            lively-npcs-integration/build/libs/*.jar
            lively-npcs-integration/build/libs/fabric.mod.built.json
            lively-npcs-integration/build/server-smoke.log
            SHA256.txt
          if-no-files-found: error
