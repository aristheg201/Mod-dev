name: Build Perfect Partners Cobblemon 1.8.2 Repair

on:
  push:
    branches: [fix/perfectpartners-cobblemon182]
    paths:
      - 'compat/perfectpartners/**'
      - '.github/workflows/build-perfectpartners-182.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified official Fabric baseline
        run: |
          set -euo pipefail
          mkdir -p /tmp/ppfix output
          python3 - <<'PY'
          import urllib.request,json
          req=urllib.request.Request('https://api.modrinth.com/v2/version/PFC5Bhfm',headers={'User-Agent':'SVArcade-compat-patch/1.0'})
          with urllib.request.urlopen(req,timeout=60) as f: v=json.load(f)
          assert v['version_number']=='2.0.2' and 'fabric' in v['loaders']
          f=next((f for f in v['files'] if f.get('primary')),v['files'][0])
          with urllib.request.urlopen(urllib.request.Request(f['url'],headers={'User-Agent':'SVArcade-compat-patch/1.0'}),timeout=60) as r:
              open('/tmp/ppfix/original.jar','wb').write(r.read())
          import zipfile
          with zipfile.ZipFile('/tmp/ppfix/original.jar') as jar:
              m=json.loads(jar.read('fabric.mod.json'))
              assert m['id']=='companion_bonds' and m['version']=='1.2.1'
              assert m['depends']['minecraft']=='1.21.1'
              assert 'companion_bonds.mixins.json' in jar.namelist()
          print('Input Modrinth release:',v['version_number'],'filename:',f['filename'],'internal mod version:',m['version'])
          PY
          unzip -p /tmp/ppfix/original.jar 'com/example/companionbonds/mixin/PokemonSelectingItemBeautyMixin.class' > /tmp/ppfix/original.class
          test -s /tmp/ppfix/original.class

      - name: Correct class-target mixin and injector selector with ASM
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar' -o /tmp/ppfix/asm.jar
          mkdir -p /tmp/ppfix/patch-classes
          javac --release 21 -cp /tmp/ppfix/asm.jar -d /tmp/ppfix/patch-classes compat/perfectpartners/PerfectPartnersMixinPatch.java
          java -cp /tmp/ppfix/asm.jar:/tmp/ppfix/patch-classes PerfectPartnersMixinPatch /tmp/ppfix/original.class /tmp/ppfix/patched.class
          test -s /tmp/ppfix/patched.class

      - name: Repackage and verify minimum-delta compatibility JAR
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile,json,hashlib,os,subprocess
          base='/tmp/ppfix/original.jar'
          target='output/PerfectPartners-Fabric-1.2.1-Cobblemon1.8.2-SVFIX1.jar'
          cl='com/example/companionbonds/mixin/PokemonSelectingItemBeautyMixin.class'
          patched=open('/tmp/ppfix/patched.class','rb').read()
          def sha(b):return hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(base) as inp,zipfile.ZipFile(target,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as out:
              meta=json.loads(inp.read('fabric.mod.json'))
              meta.setdefault('custom',{})['svfix:cobblemon182_beauty_interface']='1'
              for item in inp.infolist():
                  name=item.filename
                  if name.startswith('META-INF/') and name.endswith(('.SF','.RSA','.DSA')):
                      continue
                  data=inp.read(name)
                  if name==cl: data=patched
                  elif name=='fabric.mod.json': data=(json.dumps(meta,indent=2)+'\n').encode()
                  out.writestr(item,data)
          with zipfile.ZipFile(base) as inp,zipfile.ZipFile(target) as out:
              assert out.testzip() is None
              a=set(inp.namelist());b=set(out.namelist())
              assert (a-b)<={'META-INF/MANIFEST.MF'}
              assert cl in b and 'fabric.mod.json' in b
              for name in a.intersection(b):
                  if name not in (cl,'fabric.mod.json'):
                      assert sha(inp.read(name))==sha(out.read(name)),name
              m=json.loads(out.read('fabric.mod.json'))
              assert m['id']=='companion_bonds'
              assert m['custom']['svfix:cobblemon182_beauty_interface']=='1'
          display=subprocess.run(['javap','-v','-p','-classpath',target,'com.example.companionbonds.mixin.PokemonSelectingItemBeautyMixin'],capture_output=True,text=True,check=True).stdout
          targets=next(line for line in display.splitlines() if 'targets=[' in line)
          inject=next(line for line in display.splitlines() if 'method=[' in line)
          assert 'EVIncreaseItem' not in targets,targets
          for name in ('FeatherItem','MochiItem','VitaminItem'):
              assert name in targets,name
          assert 'applyToPokemon' in inject,inject
          assert 'net/minecraft/server/level' not in inject,inject
          print('Verified: all original mod files preserved except targeted mixin bytecode and fabric.mod.json')
          print('New concrete targets:',targets.strip())
          print('Verified injector method selector:',inject.strip())
          PY
          sha256sum output/*.jar > output/SHA256SUMS.txt

      - name: Publish patched addon for testing
        uses: actions/upload-artifact@v4
        with:
          name: perfectpartners-cobblemon182-svfix1
          path: output/*
          if-no-files-found: error
          retention-days: 30
