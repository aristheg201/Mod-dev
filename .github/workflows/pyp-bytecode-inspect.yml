name: ProtectYourPack bytecode inspect

on:
  push:
    branches:
      - ProtectYourPack
    paths:
      - .github/workflows/pyp-bytecode-inspect.yml
      - ProtectYourPack-1.2.1.jar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dump relevant bytecode and classes
        shell: bash
        run: |
          set -euo pipefail
          JAR=ProtectYourPack-1.2.1.jar
          OUT=audit/ProtectYourPack-bytecode.txt
          mkdir -p audit
          : > "$OUT"
          {
            echo '===== EASYAUTH ENTRIES ====='
            jar tf "$JAR" | grep -Ei 'easyauth|PlayerAuth|ServerPlayer.*Mixin' || true
            echo
            echo '===== PYP CLASSES ====='
            javap -classpath "$JAR" -p -s -c com.svframe.pyp.ProtectYourPack || true
            javap -classpath "$JAR" -p -s -c com.svframe.pyp.PackDelayGate || true
            javap -classpath "$JAR" -p -s -c 'com.svframe.pyp.PackDelayGate$SessionState' || true
            javap -classpath "$JAR" -p -s -c com.svframe.pyp.EasyAuthBridge || true
            echo
            echo '===== MATCHING AUTH CLASSES ====='
            while IFS= read -r entry; do
              cls="${entry%.class}"
              cls="${cls//\//.}"
              case "$cls" in
                *PlayerAuth*|*ServerPlayer*Mixin*)
                  echo "--- $cls ---"
                  javap -classpath "$JAR" -p -s -c "$cls" || true
                  ;;
              esac
            done < <(jar tf "$JAR" | grep '\.class$' | grep -Ei 'easyauth|PlayerAuth|ServerPlayer.*Mixin' || true)
          } >> "$OUT" 2>&1
      - name: Commit inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/ProtectYourPack-bytecode.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update PYP bytecode inspection [skip ci]'
          git push origin HEAD:ProtectYourPack
