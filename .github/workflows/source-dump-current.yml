name: Card Worlds Current Source Dump

on:
  push:
    branches:
      - feature/cardworlds-source-dump-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore effective source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/cardworlds-src.b64.part* | base64 -d > /tmp/cardworlds-src.tar.gz
          tar -xzf /tmp/cardworlds-src.tar.gz
          python3 source-overrides/apply.py
          tar -czf /tmp/cardworlds-effective-current.tgz src build.gradle gradle.properties settings.gradle docs source-overrides
      - uses: actions/upload-artifact@v4
        with:
          name: CardWorlds-effective-current-${{ github.sha }}
          path: /tmp/cardworlds-effective-current.tgz
          if-no-files-found: error
