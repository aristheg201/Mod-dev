name: SVQuest Loom build

on:
  push:
    branches: [build/svquest]
    paths:
      - 'SVQuest/**'
      - '.github/workflows/svquest-loom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore reviewed beta.9 QuestScreen source
        working-directory: SVQuest
        run: gradle --no-daemon prepareBeta9QuestScreen

      - name: Audit 618 quest catalog and objective producers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, zlib, zipfile, io
          from pathlib import Path

          parts=[]
          for i in range(8):
              p=Path(f'SVQuest/src/main/resources/svquest/full/default_quests.{i:02d}.b64')
              assert p.is_file(), p
              parts.append(''.join(p.read_text().split()))
          enc=''.join(parts)
          assert len(enc)==44932, len(enc)
          gz=base64.b64decode(enc)
          assert gz[:3]==b'\x1f\x8b\x08'
          flags=gz[3]; pos=10
          if flags & 0x04:
              xlen=gz[pos] | (gz[pos+1]<<8); pos += 2+xlen
          if flags & 0x08: pos=gz.index(b'\0',pos)+1
          if flags & 0x10: pos=gz.index(b'\0',pos)+1
          if flags & 0x02: pos+=2
          raw=zlib.decompress(gz[pos:-8],-15)
          text=raw.decode('utf-8',errors='replace')
          replacements=text.count('\ufffd')
          print('UTF-8 replacement chars:', replacements)
          root=json.loads(text)
          quests=root['quests']
          assert len(quests)==618, len(quests)
          ids=[q['id'] for q in quests]
          assert len(ids)==len(set(ids)), 'duplicate quest ids'
          known=set(ids)
          dangling=[(q['id'],p) for q in quests for p in q.get('prerequisites',[]) if p not in known]
          assert not dangling, dangling[:20]
          empty=[q['id'] for q in quests if not q.get('objectives')]
          assert not empty, empty[:20]

          # Malformed bytes may never alter machine-facing quest matching fields.
          structural_bad=[]
          for q in quests:
              for k in ('id','category'):
                  if '\ufffd' in str(q.get(k,'')): structural_bad.append((q.get('id'),k,q.get(k)))
              for p in q.get('prerequisites',[]):
                  if '\ufffd' in p: structural_bad.append((q.get('id'),'prerequisite',p))
              for o in q.get('objectives',[]):
                  for k in ('type','target','metaKey','mode','featureId'):
                      if '\ufffd' in str(o.get(k,'')): structural_bad.append((q.get('id'),'objective.'+k,o.get(k)))
              for r in q.get('rewards',[]):
                  for k in ('type','item','command'):
                      if '\ufffd' in str(r.get(k,'')): structural_bad.append((q.get('id'),'reward.'+k,r.get(k)))
          assert not structural_bad, structural_bad[:20]

          display_bad=[]
          for q in quests:
              for k in ('title','description'):
                  if '\ufffd' in str(q.get(k,'')): display_bad.append((q['id'],k,q.get(k)))
              for o in q.get('objectives',[]):
                  if '\ufffd' in str(o.get('label','')): display_bad.append((q['id'],'objective.label',o.get('label')))
              for r in q.get('rewards',[]):
                  if '\ufffd' in str(r.get('label','')): display_bad.append((q['id'],'reward.label',r.get('label')))
          if display_bad:
              print('Malformed display-only fields:', display_bad[:20])
          assert replacements <= 16, f'too many malformed UTF-8 replacements: {replacements}'

          objectives=sum(len(q.get('objectives',[])) for q in quests)
          types=sorted({o['type'].upper() for q in quests for o in q.get('objectives',[])})
          print('catalog:',len(quests),'quests /',objectives,'objectives /',len(types),'types')
          print('objective types:',', '.join(types))

          producer='\n'.join(p.read_text(errors='ignore') for p in Path('SVQuest/src/main/java').rglob('*.java'))
          payload=Path('SVQuest/src/main/resources/svquest/questfix_mixins.zip.b64')
          if payload.is_file():
              zb=base64.b64decode(''.join(payload.read_text().split()))
              with zipfile.ZipFile(io.BytesIO(zb)) as z:
                  for n in z.namelist():
                      if n.endswith('.class'):
                          producer += '\n' + z.read(n).decode('latin1',errors='ignore')
          missing=[t for t in types if t not in producer]
          if missing:
              raise SystemExit('OBJECTIVE TYPES WITHOUT PRODUCER: '+', '.join(missing))
          print('producer audit OK:',len(types),'/',len(types),'objective types have server producers')
          PY

          ! grep -q 'claimCompleted' SVQuest/src/main/java/vn/svframe/svquest/server/QuestEngine.java
          test "$(grep -o 'rewards\.grant' SVQuest/src/main/java/vn/svframe/svquest/server/QuestEngine.java | wc -l)" -eq 1
          grep -q 'action.startsWith("claim:")' SVQuest/src/main/java/vn/svframe/svquest/server/ServerRuntime.java
          grep -q 'progressKey(quest, index)' SVQuest/src/main/java/vn/svframe/svquest/server/QuestStateStore.java
          grep -q 'claim:' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java

          git show 5412f2796e5199a3ee4963aa8ea1b38e7aced167:SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java > /tmp/QuestScreen.beta9.java
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          old=Path('/tmp/QuestScreen.beta9.java').read_text(); new=Path('SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java').read_text()
          hx=re.compile(r'0x[0-9A-Fa-f]+')
          assert Counter(hx.findall(old))==Counter(hx.findall(new)), 'beta.9 palette changed'
          for t in ['LỘ TRÌNH GAMEPLAY','TIẾN TRÌNH','HOẠT ĐỘNG','POKÉMON','CỬA HÀNG','DỊCH VỤ','MỤC TIÊU','PHẦN THƯỞNG','YÊU CẦU','HOÀN THÀNH','ĐANG THỰC HIỆN','CHƯA MỞ KHÓA','Math.max(205, Math.min(278, w / 4))']:
              assert t in new, t
          assert 'NHIỆM VỤ SVFRAME' not in new and 'HOÀN TẤT' not in new
          print('beta.9 GUI visual contract OK')
          PY

      - name: Loom remap build
        working-directory: SVQuest
        run: gradle --no-daemon clean remapJar sourcesJar --stacktrace

      - name: Verify remapped artifact
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          for f in vn/svframe/svquest/SVQuest.class vn/svframe/svquest/QuestApi.class vn/svframe/svquest/client/QuestScreen.class vn/svframe/svquest/server/SVQuestDedicatedServer.class svquest/full/default_quests.07.b64 vn/svframe/svquest/mixin/PebblesCrateMixin.class 'vn/svframe/svquest/mixin/ArcadeLuckMixin$Gacha.class' 'vn/svframe/svquest/mixin/ArcadeLuckMixin$Roulette.class' 'vn/svframe/svquest/mixin/ArcadeLuckMixin$Blackjack.class' vn/svframe/svquest/mixin/SvfTaiXiuMixin.class vn/svframe/svquest/mixin/SvfMatchBetMixin.class vn/svframe/svquest/mixin/SvfTournamentMixin.class vn/svframe/svquest/mixin/SvfEventShowcaseMixin.class; do unzip -l "$JAR" | grep -Fq "$f"; done
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Client startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest
          rm -rf run
          set +e
          timeout 100s xvfb-run -a gradle --no-daemon runClient > build/client-smoke.log 2>&1
          code=$?
          set -e
          cat build/client-smoke.log
          if grep -E -q "IncompatibleClassChangeError|Could not execute entrypoint stage 'client'|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Exception in thread \"Render thread\"" build/client-smoke.log; then exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Dedicated server smoke test on remapped jar
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          rm -rf build/prod-server; mkdir -p build/prod-server/mods
          cp "$JAR" build/prod-server/mods/
          curl -fL --retry 3 -o build/prod-server/mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.9+1.21.1/fabric-api-0.116.9+1.21.1.jar'
          curl -fL --retry 3 -o build/prod-server/fabric-server.jar 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.4/1.1.0/server/jar'
          printf 'eula=true\n' > build/prod-server/eula.txt
          set +e
          (cd build/prod-server && timeout 120s java -Xms512M -Xmx1G -jar fabric-server.jar nogui) > build/server-smoke.log 2>&1
          code=$?
          set -e
          cat build/server-smoke.log
          if grep -E -q "Could not execute entrypoint stage|IncompatibleClassChangeError|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Encountered an unexpected exception|Failed to decode full SVQuest|Corrupt SVQuest catalog|dangling prerequisite" build/server-smoke.log; then exit 1; fi
          grep -q 'SVQuest full quest runtime loaded: 618 quests' build/server-smoke.log
          grep -q 'Done (' build/server-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Upload GitHub Loom artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SVQuest-beta.11-GitHub-Loom
          path: |
            SVQuest/build/libs/SVQuest-*.jar
            SVQuest/build/libs/SHA256.txt
            SVQuest/build/libs/fabric.mod.built.json
            SVQuest/build/client-smoke.log
            SVQuest/build/server-smoke.log
          if-no-files-found: warn
