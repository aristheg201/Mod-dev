name: SVQuest Loom build

on:
  push:
    branches: [build/svquest]
    paths:
      - 'SVQuest/**'
      - '.github/workflows/svquest-loom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore reviewed beta.9 QuestScreen source
        working-directory: SVQuest
        run: gradle --no-daemon prepareBeta9QuestScreen

      - name: Audit config-driven quest catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          quest_path=Path('SVQuest/src/main/resources/svquest/defaults/quests.json')
          feature_path=Path('SVQuest/src/main/resources/svquest/defaults/features.json')
          text=quest_path.read_text(encoding='utf-8', errors='strict')
          root=json.loads(text)
          quests=root['quests']
          assert quests, 'default config must contain at least one quest so the GUI is never empty before server sync'
          ids=[q['id'] for q in quests if q.get('enabled', True)]
          assert len(ids)==len(set(ids)), 'duplicate quest ids'
          known=set(ids)
          objectives=0
          for q in quests:
              if not q.get('enabled', True): continue
              assert q.get('id') and len(q['id']) <= 96
              assert q.get('objectives'), q['id']
              for o in q['objectives']:
                  objectives += 1
                  assert o.get('type'), (q['id'], o)
                  assert int(o.get('amount',1)) > 0
                  assert 'featureId' in o, (q['id'], o)
              for p in q.get('prerequisites',[]):
                  assert p in known, (q['id'],p)
                  assert p != q['id']
          features=json.loads(feature_path.read_text(encoding='utf-8', errors='strict'))['commands']
          assert isinstance(features,dict)
          print('config audit OK:',len(ids),'default quests /',objectives,'objectives /',len(features),'feature commands')

          java='\n'.join(p.read_text(encoding='utf-8') for p in Path('SVQuest/src/main/java').rglob('*.java'))
          forbidden=['CATALOG_PARTS','ENCODED_LENGTH','expected 618 quests','featureFor(String type','ALIASES = Map.ofEntries']
          for token in forbidden:
              assert token not in java, 'hardcoded catalog token remains: '+token
          assert 'config/svquest/quests' in Path('SVQuest/src/main/java/vn/svframe/svquest/quest/QuestCatalog.java').read_text()
          assert 'literal("reload")' in Path('SVQuest/src/main/java/vn/svframe/svquest/server/ServerRuntime.java').read_text()
          assert 'CatalogPayload' in java
          print('no fixed quest count / alias map / feature inference remains in Java')
          PY

          ! grep -q 'claimCompleted' SVQuest/src/main/java/vn/svframe/svquest/server/QuestEngine.java
          test "$(grep -o 'rewards\.grant' SVQuest/src/main/java/vn/svframe/svquest/server/QuestEngine.java | wc -l)" -eq 1
          grep -q 'action.startsWith("claim:")' SVQuest/src/main/java/vn/svframe/svquest/server/ServerRuntime.java
          grep -q 'progressKey(quest, index)' SVQuest/src/main/java/vn/svframe/svquest/server/QuestStateStore.java
          grep -q 'claim:' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java

          git show 5412f2796e5199a3ee4963aa8ea1b38e7aced167:SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java > /tmp/QuestScreen.beta9.java
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          old=Path('/tmp/QuestScreen.beta9.java').read_text(); new=Path('SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java').read_text()
          hx=re.compile(r'0x[0-9A-Fa-f]+')
          assert Counter(hx.findall(old))==Counter(hx.findall(new)), 'beta.9 palette changed'
          for t in ['LỘ TRÌNH GAMEPLAY','TIẾN TRÌNH','HOẠT ĐỘNG','POKÉMON','CỬA HÀNG','DỊCH VỤ','MỤC TIÊU','PHẦN THƯỞNG','YÊU CẦU','HOÀN THÀNH','ĐANG THỰC HIỆN','CHƯA MỞ KHÓA','Math.max(205, Math.min(278, w / 4))']:
              assert t in new, t
          assert 'NHIỆM VỤ SVFRAME' not in new and 'HOÀN TẤT' not in new
          print('beta.9 GUI visual contract OK')
          PY

      - name: Loom remap build
        working-directory: SVQuest
        run: gradle --no-daemon clean remapJar sourcesJar --stacktrace

      - name: Verify remapped artifact
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          for f in vn/svframe/svquest/SVQuest.class vn/svframe/svquest/QuestApi.class vn/svframe/svquest/client/QuestScreen.class vn/svframe/svquest/network/CatalogPayload.class vn/svframe/svquest/server/SVQuestDedicatedServer.class svquest/defaults/quests.json svquest/defaults/features.json vn/svframe/svquest/mixin/PebblesCrateMixin.class 'vn/svframe/svquest/mixin/ArcadeLuckMixin$Gacha.class' 'vn/svframe/svquest/mixin/ArcadeLuckMixin$Roulette.class' 'vn/svframe/svquest/mixin/ArcadeLuckMixin$Blackjack.class' vn/svframe/svquest/mixin/SvfTaiXiuMixin.class vn/svframe/svquest/mixin/SvfMatchBetMixin.class vn/svframe/svquest/mixin/SvfTournamentMixin.class vn/svframe/svquest/mixin/SvfEventShowcaseMixin.class; do unzip -l "$JAR" | grep -Fq "$f"; done
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Client startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest
          rm -rf run
          set +e
          timeout 100s xvfb-run -a gradle --no-daemon runClient > build/client-smoke.log 2>&1
          code=$?
          set -e
          cat build/client-smoke.log
          if grep -E -q "IncompatibleClassChangeError|Could not execute entrypoint stage 'client'|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Exception in thread \"Render thread\"" build/client-smoke.log; then exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Dedicated server smoke test on remapped jar
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          rm -rf build/prod-server; mkdir -p build/prod-server/mods
          cp "$JAR" build/prod-server/mods/
          curl -fL --retry 3 -o build/prod-server/mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.9+1.21.1/fabric-api-0.116.9+1.21.1.jar'
          curl -fL --retry 3 -o build/prod-server/fabric-server.jar 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.4/1.1.0/server/jar'
          printf 'eula=true\n' > build/prod-server/eula.txt
          set +e
          (cd build/prod-server && timeout 120s java -Xms512M -Xmx1G -jar fabric-server.jar nogui) > build/server-smoke.log 2>&1
          code=$?
          set -e
          cat build/server-smoke.log
          if grep -E -q "Could not execute entrypoint stage|IncompatibleClassChangeError|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Encountered an unexpected exception|Failed to reload SVQuest config catalog|Prerequisite cycle detected|Dangling prerequisite" build/server-smoke.log; then exit 1; fi
          grep -q 'SVQuest config quest runtime loaded:' build/server-smoke.log
          grep -q 'Done (' build/server-smoke.log
          test -f build/prod-server/config/svquest/quests/00-starter.json
          test -f build/prod-server/config/svquest/features.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Upload GitHub Loom artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SVQuest-beta.11-GitHub-Loom
          path: |
            SVQuest/build/libs/SVQuest-*.jar
            SVQuest/build/libs/SHA256.txt
            SVQuest/build/libs/fabric.mod.built.json
            SVQuest/build/client-smoke.log
            SVQuest/build/server-smoke.log
          if-no-files-found: warn
