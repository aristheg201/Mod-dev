name: SVQuest Loom build

on:
  push:
    branches:
      - build/svquest
    paths:
      - 'SVQuest/**'
      - '.github/workflows/svquest-loom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore reviewed beta.9 QuestScreen source
        working-directory: SVQuest
        run: gradle --no-daemon prepareBeta9QuestScreen

      - name: Assert quest architecture, canonical catalog and beta.9 GUI contract
        shell: bash
        run: |
          set -euo pipefail
          test -f SVQuest/src/main/resources/fabric.mod.json
          test -f SVQuest/src/main/java/vn/svframe/svquest/client/SVQuestClient.java
          test -f SVQuest/src/main/java/vn/svframe/svquest/server/SVQuestDedicatedServer.java
          test -f SVQuest/src/main/resources/assets/svquest/textures/gui/server_logo.png
          test -f SVQuest/src/main/resources/svquest.questfix.mixins.json
          test -f SVQuest/src/main/resources/svquest/questfix_mixins.zip.b64
          test -f SVQuest/src/main/resources/svquest/full/default_quests.07.b64
          test ! -d SVQuest/src/compileStubs
          ! grep -R --line-number --include='*.java' 'net\.minecraft\.class_' SVQuest/src/main/java
          ! find SVQuest/src/main/java -type f -name '*Mixin.java' | grep -q .
          ! grep -q 'claimCompleted' SVQuest/src/main/java/vn/svframe/svquest/server/QuestEngine.java
          test "$(grep -o 'rewards\.grant' SVQuest/src/main/java/vn/svframe/svquest/server/QuestEngine.java | wc -l)" -eq 1
          grep -q 'action.startsWith("claim:")' SVQuest/src/main/java/vn/svframe/svquest/server/ServerRuntime.java
          grep -q 'progressKey(quest, index)' SVQuest/src/main/java/vn/svframe/svquest/server/QuestStateStore.java
          grep -q 'claim:' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java

          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path

          encoded = ''.join(
              ''.join(Path(f'SVQuest/src/main/resources/svquest/full/default_quests.{i:02d}.b64').read_text().split())
              for i in range(8)
          )
          assert len(encoded) == 44932, len(encoded)
          gz = base64.b64decode(encoded)
          assert gz[:3] == b'\x1f\x8b\x08'
          flags = gz[3]
          pos = 10
          if flags & 0x04:
              xlen = gz[pos] | (gz[pos + 1] << 8)
              pos += 2 + xlen
          if flags & 0x08:
              pos = gz.index(b'\x00', pos) + 1
          if flags & 0x10:
              pos = gz.index(b'\x00', pos) + 1
          if flags & 0x02:
              pos += 2
          raw = zlib.decompress(gz[pos:-8], -15)
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == '9c8973547f7cafc6d8b272fada60e34e2d3cb7798ef31982c838f0ef1b3af555', digest
          root = json.loads(raw)
          quests = root['quests']
          objectives = sum(len(q.get('objectives', [])) for q in quests)
          assert len(quests) == 618, len(quests)
          assert objectives == 1617, objectives
          ids = [q['id'] for q in quests]
          assert len(ids) == len(set(ids)), 'duplicate quest ids'
          known = set(ids)
          dangling = [(q['id'], p) for q in quests for p in q.get('prerequisites', []) if p not in known]
          assert not dangling, dangling[:10]
          print('catalog OK:', len(quests), 'quests /', objectives, 'objectives / sha256', digest)
          PY

          git show 5412f2796e5199a3ee4963aa8ea1b38e7aced167:SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java > /tmp/QuestScreen.beta9.java
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          old = Path('/tmp/QuestScreen.beta9.java').read_text()
          new = Path('SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java').read_text()
          hx = re.compile(r'0x[0-9A-Fa-f]+')
          assert Counter(hx.findall(old)) == Counter(hx.findall(new)), 'QuestScreen color palette changed from beta.9'
          required = [
              'LỘ TRÌNH GAMEPLAY', 'TIẾN TRÌNH', 'HOẠT ĐỘNG', 'POKÉMON', 'CỬA HÀNG', 'DỊCH VỤ',
              'MỤC TIÊU', 'PHẦN THƯỞNG', 'YÊU CẦU', 'HOÀN THÀNH', 'ĐANG THỰC HIỆN', 'CHƯA MỞ KHÓA',
              'Chọn hệ thống để mở giao diện tương ứng.',
              'Math.max(205, Math.min(278, w / 4))',
              'Math.max(28, Math.round(railTrackH * (visibleRows / (float) QuestCatalog.QUESTS.size())))'
          ]
          for token in required:
              assert token in new, f'beta.9 GUI contract missing: {token}'
          forbidden = ['NHIỆM VỤ SVFRAME', 'HOÀN TẤT']
          for token in forbidden:
              assert token not in new, f'beta.10 GUI wording leaked into beta.9 GUI: {token}'
          print('beta.9 GUI visual contract OK')
          PY

      - name: Loom remap build
        working-directory: SVQuest
        run: gradle --no-daemon clean remapJar sourcesJar --stacktrace

      - name: Verify remapped artifact and objective producers
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/SVQuest.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/QuestApi.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/client/SVQuestClient.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/client/QuestScreen.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/server/SVQuestDedicatedServer.class'
          unzip -l "$JAR" | grep -q 'assets/svquest/textures/gui/server_logo.png'
          unzip -l "$JAR" | grep -q 'svquest/full/default_quests.07.b64'
          unzip -l "$JAR" | grep -q 'svquest.questfix.mixins.json'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/PebblesCrateMixin.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/ArcadeLuckMixin\$Gacha.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/ArcadeLuckMixin\$Roulette.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/ArcadeLuckMixin\$Blackjack.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/SvfTaiXiuMixin.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/SvfMatchBetMixin.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/SvfTournamentMixin.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/mixin/SvfEventShowcaseMixin.class'
          ! unzip -l "$JAR" | grep -q 'compileStubs'
          ! unzip -l "$JAR" | grep -q 'questfix_mixins.zip.b64'
          ! unzip -l "$JAR" | grep -q 'questscreen_beta9_logic.java.gz.b64'
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Client startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest
          rm -rf run
          set +e
          timeout 100s xvfb-run -a gradle --no-daemon runClient > build/client-smoke.log 2>&1
          code=$?
          set -e
          cat build/client-smoke.log
          if grep -E -q "IncompatibleClassChangeError|Could not execute entrypoint stage 'client'|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Exception in thread \"Render thread\"" build/client-smoke.log; then
            echo 'Fatal client startup signature detected.' >&2
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "runClient exited unexpectedly with code $code" >&2
            exit "$code"
          fi

      - name: Dedicated server smoke test on remapped jar
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          rm -rf build/prod-server
          mkdir -p build/prod-server/mods
          cp "$JAR" build/prod-server/mods/
          curl -fL --retry 3 -o build/prod-server/mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.116.9+1.21.1/fabric-api-0.116.9+1.21.1.jar'
          curl -fL --retry 3 -o build/prod-server/fabric-server.jar 'https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.18.4/1.1.0/server/jar'
          printf 'eula=true\n' > build/prod-server/eula.txt
          set +e
          (cd build/prod-server && timeout 120s java -Xms512M -Xmx1G -jar fabric-server.jar nogui) > build/server-smoke.log 2>&1
          code=$?
          set -e
          cat build/server-smoke.log
          if grep -E -q "Could not execute entrypoint stage 'server'|Could not execute entrypoint stage 'main'|IncompatibleClassChangeError|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Encountered an unexpected exception|Failed to decode full SVQuest|Corrupt SVQuest catalog" build/server-smoke.log; then
            echo 'Fatal production server startup signature detected.' >&2
            exit 1
          fi
          grep -q 'SVQuest full quest runtime loaded: 618 quests' build/server-smoke.log
          grep -q 'Done (' build/server-smoke.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "production server exited unexpectedly with code $code" >&2
            exit "$code"
          fi

      - name: Upload GitHub Loom artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SVQuest-beta.11-GitHub-Loom
          path: |
            SVQuest/build/libs/SVQuest-*.jar
            SVQuest/build/libs/SHA256.txt
            SVQuest/build/libs/fabric.mod.built.json
            SVQuest/build/client-smoke.log
            SVQuest/build/server-smoke.log
          if-no-files-found: warn
