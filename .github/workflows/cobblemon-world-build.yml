name: Cobblemon World Build

on:
  workflow_dispatch:

concurrency:
  group: cobblemon-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cobblemon-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and test
        run: gradle --stacktrace clean build
      - name: Upload development artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobblemon-world-build
          path: |
            cobblemon-world/build/libs/*.jar
            cobblemon-world/build/reports/**
          if-no-files-found: ignore
