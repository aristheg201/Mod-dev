name: SVRelationships build

on:
  push:
    branches:
      - feature/svrelationships-production-20260915
    paths:
      - '.final-svrelationships-build'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svrelationships
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile and test
        run: gradle --no-daemon clean test :fabric:remapJar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVRelationships-${{ github.sha }}
          path: svrelationships/fabric/build/libs/*.jar
          if-no-files-found: error
