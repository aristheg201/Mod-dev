name: SVQuest catalog recovery

on:
  push:
    branches: [build/svquest]
    paths:
      - '.github/workflows/svquest-catalog-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Infer clean quest schema before corruption boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,re,zlib
          from pathlib import Path
          enc=''.join(''.join(Path(f'SVQuest/src/main/resources/svquest/full/default_quests.{i:02d}.b64').read_text().split()) for i in range(8))
          gz=base64.b64decode(enc); flags=gz[3]; pos=10
          if flags & 4: x=gz[pos]|gz[pos+1]<<8; pos+=2+x
          if flags & 8: pos=gz.index(b'\0',pos)+1
          if flags & 16: pos=gz.index(b'\0',pos)+1
          if flags & 2: pos+=2
          raw=zlib.decompress(gz[pos:-8],-15)
          idre=re.compile(br'"id"\s*:\s*"([^"\\]{1,160})"')
          ids=[(m.start(),m.group(1).decode('ascii','replace')) for m in idre.finditer(raw)]
          good=[]
          for n,(marker,qid) in enumerate(ids):
              start=raw.rfind(b'{',max(0,marker-256),marker+1)
              nxt=ids[n+1][0] if n+1<len(ids) else len(raw)
              nstart=raw.rfind(b'{',max(0,nxt-256),nxt+1) if n+1<len(ids) else len(raw)
              end=raw.rfind(b'}',start,nstart if nstart>start else nxt)
              if start<0 or end<start: break
              try: q=json.loads(raw[start:end+1].decode('utf-8','strict'))
              except Exception: break
              if q.get('id')!=qid: break
              good.append(q)
          print('GOOD_PREFIX',len(good))
          for i,q in enumerate(good):
              if i<80 or i>=400:
                  print('Q',i,q['id'],q.get('category'),len(q.get('objectives',[])),len(q.get('rewards',[])),q.get('prerequisites',[]),q.get('openFeature'),q.get('optional'))
          research=[(i,q) for i,q in enumerate(good) if q['id'].startswith('research_')]
          print('RESEARCH_GOOD_COUNT',len(research),'FIRST_INDEX',research[0][0] if research else None,'LAST_INDEX',research[-1][0] if research else None)
          print('RESEARCH_FIRST_20')
          for i,q in research[:20]: print(i,json.dumps(q,ensure_ascii=False,separators=(',',':')))
          print('RESEARCH_LAST_30')
          for i,q in research[-30:]: print(i,json.dumps(q,ensure_ascii=False,separators=(',',':')))
          # Analyze numerical dex sequence encoded in IDs.
          nums=[]
          for i,q in research:
              m=re.match(r'research_(\d+)_',q['id'])
              if m: nums.append((i,int(m.group(1)),q['id']))
          print('DEX_NUMS_COUNT',len(nums))
          print('DEX_FIRST',nums[:30])
          print('DEX_LAST',nums[-50:])
          if nums:
              diffs={}
              for a,b in zip(nums,nums[1:]): diffs[b[1]-a[1]]=diffs.get(b[1]-a[1],0)+1
              print('DEX_DIFFS',sorted(diffs.items()))
          # Core quests after/before research naming patterns.
          print('NON_RESEARCH_COUNT',sum(not q['id'].startswith('research_') for q in good))
          PY
