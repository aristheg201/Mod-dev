name: SVQuest catalog recovery

on:
  push:
    branches: [build/svquest]
    paths:
      - '.github/workflows/svquest-catalog-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download exact Cobblemon Research Tasks 2.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/research.jar 'https://cdn.modrinth.com/data/zoP5qy7S/versions/BMbNXB3F/cobblemonresearchtasks-2.0.jar'
          echo '--- research jar ---'
          stat -c '%s bytes' /tmp/research.jar
          sha256sum /tmp/research.jar
          unzip -l /tmp/research.jar | grep -Ei 'master_config|default_config' | head -n 30 || true
          MASTER=$(unzip -Z1 /tmp/research.jar | grep -E '(^|/)master_config\.json$' | head -n1)
          test -n "$MASTER"
          unzip -p /tmp/research.jar "$MASTER" > /tmp/master_config.json
          python3 -m json.tool /tmp/master_config.json >/dev/null
          echo "MASTER=$MASTER"
          stat -c '%s bytes' /tmp/master_config.json

      - name: Compare known-clean SVQuest research quests to master config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,re,zlib
          from pathlib import Path

          enc=''.join(''.join(Path(f'SVQuest/src/main/resources/svquest/full/default_quests.{i:02d}.b64').read_text().split()) for i in range(8))
          gz=base64.b64decode(enc); flags=gz[3]; pos=10
          if flags & 4: x=gz[pos]|gz[pos+1]<<8; pos+=2+x
          if flags & 8: pos=gz.index(b'\0',pos)+1
          if flags & 16: pos=gz.index(b'\0',pos)+1
          if flags & 2: pos+=2
          raw=zlib.decompress(gz[pos:-8],-15)
          idre=re.compile(br'"id"\s*:\s*"([^"\\]{1,160})"')
          ids=[(m.start(),m.group(1).decode('ascii','replace')) for m in idre.finditer(raw)]
          good=[]
          for n,(marker,qid) in enumerate(ids):
              start=raw.rfind(b'{',max(0,marker-256),marker+1)
              nxt=ids[n+1][0] if n+1<len(ids) else len(raw)
              nstart=raw.rfind(b'{',max(0,nxt-256),nxt+1) if n+1<len(ids) else len(raw)
              end=raw.rfind(b'}',start,nstart if nstart>start else nxt)
              if start<0 or end<start: break
              try: q=json.loads(raw[start:end+1].decode('utf-8','strict'))
              except Exception: break
              if q.get('id')!=qid: break
              good.append(q)
          assert len(good)==455

          master=json.load(open('/tmp/master_config.json'))
          print('MASTER_TYPE',type(master).__name__)
          if isinstance(master,dict): print('MASTER_TOP_KEYS',list(master)[:50])

          def contains(x,needle):
              try: return needle in json.dumps(x,ensure_ascii=False).lower()
              except Exception: return False

          def find_small(x,needle,path='$',out=None):
              if out is None: out=[]
              if len(out)>=12: return out
              if isinstance(x,dict):
                  if contains(x,needle):
                      text=json.dumps(x,ensure_ascii=False,separators=(',',':'))
                      if len(text)<16000: out.append((path,text))
                  for k,v in x.items():
                      if isinstance(v,(dict,list)) and contains(v,needle): find_small(v,needle,path+'.'+str(k),out)
              elif isinstance(x,list):
                  for i,v in enumerate(x):
                      if isinstance(v,(dict,list)) and contains(v,needle): find_small(v,needle,path+f'[{i}]',out)
              return out

          for needle in ['bulbasaur','wartortle','pikachu','terrakion','tyrantrum','aurorus','hawlucha','carbink']:
              print('\n=== MASTER',needle,'===')
              for path,text in find_small(master,needle): print(path,text)

          samples=['research_1_bulbasaur','research_8_wartortle','research_25_pikachu','research_639_terrakion','research_697_tyrantrum']
          byid={q['id']:q for q in good}
          print('\n=== SVQUEST CLEAN SAMPLES ===')
          for qid in samples: print(qid,json.dumps(byid[qid],ensure_ascii=False,separators=(',',':')))

          tail=list(range(699,1004,2))
          assert len(tail)==153
          print('TAIL_SEQUENCE',len(tail),tail[:12],tail[-12:])
          PY
