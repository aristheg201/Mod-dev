name: SVQuest catalog recovery

on:
  push:
    branches: [build/svquest]
    paths:
      - '.github/workflows/svquest-catalog-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Concise reward and endgame diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,collections,json,re,zlib
          from pathlib import Path

          enc=''.join(''.join(Path(f'SVQuest/src/main/resources/svquest/full/default_quests.{i:02d}.b64').read_text().split()) for i in range(8))
          gz=base64.b64decode(enc); flags=gz[3]; pos=10
          if flags&4: x=gz[pos]|gz[pos+1]<<8; pos+=2+x
          if flags&8: pos=gz.index(b'\0',pos)+1
          if flags&16: pos=gz.index(b'\0',pos)+1
          if flags&2: pos+=2
          raw=zlib.decompress(gz[pos:-8],-15)

          idre=re.compile(br'"id"\s*:\s*"([^"\\]{1,160})"')
          ids=[(m.start(),m.group(1).decode('ascii','replace')) for m in idre.finditer(raw)]
          good=[]
          for n,(marker,qid) in enumerate(ids):
              start=raw.rfind(b'{',max(0,marker-256),marker+1)
              nxt=ids[n+1][0] if n+1<len(ids) else len(raw)
              nstart=raw.rfind(b'{',max(0,nxt-256),nxt+1) if n+1<len(ids) else len(raw)
              end=raw.rfind(b'}',start,nstart if nstart>start else nxt)
              if start<0 or end<start: break
              try: q=json.loads(raw[start:end+1].decode('utf-8','strict'))
              except Exception: break
              if q.get('id')!=qid: break
              good.append(q)
          assert len(good)==455
          research=[q for q in good if re.match(r'^research_\d+_',q['id'])]
          assert len(research)==347

          def fp(r): return json.dumps(r,sort_keys=True,separators=(',',':'),ensure_ascii=False)
          fps=[fp(q['rewards']) for q in research]
          order=[]
          for f in fps:
              if f not in order: order.append(f)
          label={f:f'R{i}' for i,f in enumerate(order)}
          print('=== RESEARCH REWARD RULE ===')
          print('unique',len(order))
          for f in order:
              idx=[i for i,x in enumerate(fps) if x==f]
              dex=[int(research[i]['id'].split('_')[1]) for i in idx]
              print(label[f],f)
              print(' ordinals=',idx)
              print(' dex=',dex)
          print('last40=',[(i,int(q['id'].split('_')[1]),label[fps[i]]) for i,q in list(enumerate(research))[-40:]])
          for mod in (2,3,5,10,20,25,50,100):
              groups={r:collections.Counter(int(q['id'].split('_')[1])%mod for i,q in enumerate(research) if label[fps[i]]==r) for r in set(label.values())}
              print('residue_mod',mod,{k:dict(v) for k,v in sorted(groups.items())})

          print('=== FINAL 10 RAW RECORD SIGNALS ===')
          marks=[m.start() for m in re.finditer(br'"rewards"\s*:',raw)]
          assert len(marks)==618, len(marks)
          keyval=re.compile(br'"(id|type|target|metaKey|mode|item|command|openFeature)"\s*:\s*"([^"\\]{0,180})"')
          numval=re.compile(br'"(amount|count)"\s*:\s*(-?\d+)')
          prereq=re.compile(br'"prerequisites"\s*:\s*\[([^\]]{0,1000})\]')
          quoted=re.compile(br'"([A-Za-z][A-Za-z0-9_:.\-/]{2,100})"')
          for idx in range(608,618):
              left=marks[idx-1] if idx else 0
              cur=marks[idx]
              right=marks[idx+1] if idx+1<len(marks) else len(raw)
              before=raw[left:cur]
              after=raw[cur:right]
              pairs=[]
              for part,name in ((before,'PRE'),(after,'POST')):
                  kv=[(a.decode('ascii','replace'),b.decode('ascii','replace')) for a,b in keyval.findall(part)]
                  nv=[(a.decode(),b.decode()) for a,b in numval.findall(part)]
                  pr=[]
                  for m in prereq.finditer(part): pr.extend(x.decode('ascii','replace') for x in quoted.findall(m.group(1)))
                  toks=[]
                  for x in quoted.findall(part):
                      s=x.decode('ascii','replace')
                      if s not in toks: toks.append(s)
                  pairs.append((name,kv,nv,pr,toks[:80]))
              print('RECORD',idx)
              for x in pairs: print(x)
          PY
