name: SVQuest catalog recovery

on:
  push:
    branches: [build/svquest]
    paths:
      - '.github/workflows/svquest-catalog-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct preserved pre-beta6 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovered
          : > /tmp/source.b64
          for p in 00 01 02 03 04 05; do
            git show 8a804b653d14219994f512ca21e90fe6fd641af4:bootstrap/source.b64.part${p} >> /tmp/source.b64
          done
          tr -d '\r\n' < /tmp/source.b64 | base64 --decode > /tmp/source.tar.gz
          gzip -t /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C /tmp/recovered
          echo '--- files ---'
          find /tmp/recovered -type f -printf '%P %s bytes\n' | sort

      - name: Locate quest catalog source or generator
        shell: bash
        run: |
          set -euo pipefail
          echo '--- filenames containing quest/catalog ---'
          find /tmp/recovered -type f | grep -Ei 'quest|catalog|progress|objective|reward' || true
          echo '--- text hits: 618/default_quests/objectives/prerequisites ---'
          grep -RInaE '618|default_quests|objectives|prerequisites|QuestCatalog|Bắt Pokémon|POKESKILL_PURCHASE|FUSION_POTARA|RAID_WIN|RANKED_WIN' /tmp/recovered 2>/dev/null | head -n 1000 || true
          echo '--- all Java source headers ---'
          find /tmp/recovered -type f -name '*.java' -print | sort
          echo '--- archive summary ---'
          printf 'files='; find /tmp/recovered -type f | wc -l
          printf 'java='; find /tmp/recovered -type f -name '*.java' | wc -l
          printf 'json='; find /tmp/recovered -type f -name '*.json' | wc -l
          printf 'b64='; find /tmp/recovered -type f -name '*.b64' | wc -l

      - name: Print small likely generator/source files completely
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            size=$(stat -c '%s' "$f")
            if [ "$size" -le 120000 ]; then
              echo "===== ${f#/tmp/recovered/} ($size bytes) ====="
              cat "$f"
              echo
            fi
          done < <(find /tmp/recovered -type f \( -iname '*quest*' -o -iname '*catalog*' -o -iname '*progress*' \) | sort)
