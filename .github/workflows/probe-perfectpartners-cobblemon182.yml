name: Probe Perfect Partners Cobblemon 1.8.2
on:
  push:
    branches:
      - fix/perfectpartners-cobblemon182
    paths:
      - .github/workflows/probe-perfectpartners-cobblemon182.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect latest Fabric addon and Cobblemon API binary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,zipfile,os,subprocess
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'SVArcade-compat-check/1.0'})
              with urllib.request.urlopen(req,timeout=60) as f: return f.read()
          pp=json.loads(get('https://api.modrinth.com/v2/version/PFC5Bhfm'))
          assert pp['version_number']=='2.0.2', pp['version_number']
          f=next((f for f in pp['files'] if f.get('primary')),pp['files'][0])
          open('/tmp/partners.jar','wb').write(get(f['url']))
          print('Downloaded official Fabric Perfect Partners 2.0.2',f['filename'])
          cob=json.loads(get('https://api.modrinth.com/v2/project/cobblemon/version'))
          cob=[v for v in cob if '1.8.2' in v['version_number'] and 'fabric' in v['loaders'] and '1.21.1' in v['game_versions']]
          if not cob: raise RuntimeError('Cobblemon 1.8.2 Fabric not found')
          c=cob[0]
          f=next((f for f in c['files'] if f.get('primary')),c['files'][0])
          open('/tmp/cobblemon.jar','wb').write(get(f['url']))
          print('Downloaded Cobblemon',c['version_number'],f['filename'])
          with zipfile.ZipFile('/tmp/partners.jar') as z:
              m=json.loads(z.read('fabric.mod.json'))
              print('MOD ID',m['id'],'VERSION',m['version'],'DEPENDS',m.get('depends'))
              print('MIXIN CONFIGS',m.get('mixins'))
              for config in m.get('mixins',[]):
                  if not isinstance(config,str): continue
                  if config not in z.namelist(): continue
                  d=json.loads(z.read(config))
                  allmix=(d.get('mixins') or [])+(d.get('server') or [])
                  print('CONFIG',config,'PACKAGE',d.get('package'),'TOTAL',len(allmix))
                  print('ALL_MIXIN_NAMES',json.dumps(allmix))
              classes=[n for n in z.namelist() if 'PokemonSelectingItemBeautyMixin' in n]
              print('BEAUTY MIXIN CLASS',classes)
              for cl in classes:
                  c=cl.replace('/','.').removesuffix('.class')
                  print('JAVAP BEAUTY',subprocess.run(['javap','-p','-v','-classpath','/tmp/partners.jar',c],capture_output=True,text=True).stdout[-15000:])
          c='com.cobblemon.mod.common.item.interactive.EVIncreaseItem'
          r=subprocess.run(['javap','-classpath','/tmp/cobblemon.jar','-p',c],capture_output=True,text=True)
          print('EVINCREASEITEM SIGNATURE exit',r.returncode,'OUTPUT:',r.stdout[:5000],'ERROR',r.stderr[:4000])
          PY
