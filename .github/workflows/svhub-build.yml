name: SVHub Loom build

on:
  push:
    branches:
      - feature/svhub-production-20260916
    paths:
      - 'SVHub/**'
      - '.github/workflows/svhub-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SVHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle.kts
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          test -f src/main/resources/svhub.client.mixins.json
          test -f src/main/kotlin/io/github/aristheg201/svhub/compat/CobblemonPoseSanitizer.kt
          test -f src/client/kotlin/io/github/aristheg201/svhub/mixin/client/VaryingModelRepositoryMixin.kt
          test -d src/main/kotlin
          test -d src/client/kotlin

      - name: Run static UI and localization QA
        run: |
          node tools/static-qa.mjs
          python3 tools/verify-tft-bundle.py

      - name: Compile, test and remap
        run: gradle --no-daemon --stacktrace clean test remapJar sourcesJar verifyPackagedTft

      - name: Verify final Fabric entrypoints
        shell: bash
        run: |
          set -euo pipefail
          REMAPPED_JAR="$(find build/libs -maxdepth 1 -type f -name 'SVHub-fabric-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$REMAPPED_JAR"

          MAIN_CLASS='io.github.aristheg201.svhub.SVHubEntrypoint'
          CLIENT_CLASS='io.github.aristheg201.svhub.client.SVHubClientEntrypoint'
          NATIVE_CLIENT_CLASS='io.github.aristheg201.svhub.client.nativeui.NativePlatformClientEntrypoint'
          MAIN_PATH='io/github/aristheg201/svhub/SVHubEntrypoint.class'
          CLIENT_PATH='io/github/aristheg201/svhub/client/SVHubClientEntrypoint.class'
          NATIVE_CLIENT_PATH='io/github/aristheg201/svhub/client/nativeui/NativePlatformClientEntrypoint.class'
          POSE_MIXIN_PATH='io/github/aristheg201/svhub/mixin/client/VaryingModelRepositoryMixin.class'

          jar tf "$REMAPPED_JAR" > /tmp/svhub-final-jar.txt
          grep -Fx "$MAIN_PATH" /tmp/svhub-final-jar.txt
          grep -Fx "$CLIENT_PATH" /tmp/svhub-final-jar.txt
          grep -Fx "$NATIVE_CLIENT_PATH" /tmp/svhub-final-jar.txt
          grep -Fx "$POSE_MIXIN_PATH" /tmp/svhub-final-jar.txt
          grep -Fx 'svhub.client.mixins.json' /tmp/svhub-final-jar.txt

          javap -classpath "$REMAPPED_JAR" -public "$MAIN_CLASS" | tee /tmp/svhub-main-entrypoint.txt
          javap -classpath "$REMAPPED_JAR" -public "$CLIENT_CLASS" | tee /tmp/svhub-client-entrypoint.txt
          javap -classpath "$REMAPPED_JAR" -public "$NATIVE_CLIENT_CLASS" | tee /tmp/svhub-native-client-entrypoint.txt
          grep -F "public ${MAIN_CLASS}();" /tmp/svhub-main-entrypoint.txt
          grep -F "public ${CLIENT_CLASS}();" /tmp/svhub-client-entrypoint.txt
          grep -F "public ${NATIVE_CLIENT_CLASS}();" /tmp/svhub-native-client-entrypoint.txt

          unzip -p "$REMAPPED_JAR" fabric.mod.json > /tmp/svhub-fabric.mod.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/svhub-fabric.mod.json').read_text())
          assert data['entrypoints']['main'] == ['io.github.aristheg201.svhub.SVHubEntrypoint'], data['entrypoints']['main']
          assert data['entrypoints']['client'] == [
              'io.github.aristheg201.svhub.client.SVHubClientEntrypoint',
              'io.github.aristheg201.svhub.client.nativeui.NativePlatformClientEntrypoint',
          ], data['entrypoints']['client']
          assert data['depends']['cobblemon'] == '>=1.8.1', data['depends']['cobblemon']
          assert data['mixins'] == [{'config': 'svhub.client.mixins.json', 'environment': 'client'}], data.get('mixins')
          print('Final Fabric entrypoint + Cobblemon 1.8.1 compatibility manifest checks passed')
          PY

      - name: Verify bundled Placeholder API and Kyori isolation
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVHub-fabric-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          jar tf "$JAR" > /tmp/svhub-runtime-contents.txt

          grep -E '^META-INF/jars/placeholder-api-.*\.jar$' /tmp/svhub-runtime-contents.txt
          if grep -Eq '^META-INF/jars/(adventure|examination)[^/]*\.jar$' /tmp/svhub-runtime-contents.txt; then
            echo 'SVHub must not bundle Adventure/Examination runtime jars; this can poison the shared server classpath.' >&2
            grep -E '^META-INF/jars/(adventure|examination)[^/]*\.jar$' /tmp/svhub-runtime-contents.txt >&2
            exit 1
          fi
          if grep -q '^net/kyori/' /tmp/svhub-runtime-contents.txt; then
            echo 'SVHub must not ship top-level net.kyori.* classes.' >&2
            grep '^net/kyori/' /tmp/svhub-runtime-contents.txt | head -n 40 >&2
            exit 1
          fi
          echo 'Placeholder API bundled; SVHub Kyori runtime isolation verified'

      - name: Inspect resolved Cobblemon model API
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES="$(find ~/.gradle/caches -type f -name '*.jar' 2>/dev/null | grep -E '/(com\.cobblemon|cobblemon)/|cobblemon.*1\.8\.1' || true)"
          if [ -z "$CANDIDATES" ]; then
            echo 'No Cobblemon cache jar found'
            exit 0
          fi
          POSE_CLASS='com.cobblemon.mod.common.client.render.models.blockbench.repository.VaryingModelRepository'
          POSE_PATH='com/cobblemon/mod/common/client/render/models/blockbench/repository/VaryingModelRepository.class'
          FOUND_POSE_API=0
          while IFS= read -r jar; do
            echo "=== $jar ==="
            jar tf "$jar" 2>/dev/null | grep -E 'ModelWidget|RenderablePokemon|PokemonModelRepository|PokemonPoseableModel|PokemonRenderer|VaryingModelRepository|render.*pokemon|pokemon.*render' | head -n 160 || true
            if jar tf "$jar" 2>/dev/null | grep -q "^${POSE_PATH}$"; then
              javap -classpath "$jar" -public "$POSE_CLASS" | tee /tmp/svhub-cobblemon-poser-api.txt
              grep -F 'loadJsonPoser(' /tmp/svhub-cobblemon-poser-api.txt
              FOUND_POSE_API=1
              break
            fi
          done <<< "$CANDIDATES"
          test "$FOUND_POSE_API" -eq 1

      - name: Inspect Minecraft 1.21.1 portrait render API
        shell: bash
        run: |
          set -euo pipefail
          CLASS_NAMES='com.mojang.blaze3d.pipeline.RenderTarget com.mojang.blaze3d.pipeline.TextureTarget com.mojang.blaze3d.platform.NativeImage net.minecraft.client.Screenshot net.minecraft.client.renderer.GameRenderer'
          JARS="$(find ~/.gradle/caches -type f -name '*.jar' 2>/dev/null | grep -E 'minecraft.*1\.21\.1|minecraft-merged|minecraft-client|client-extra' | head -n 30 || true)"
          if [ -z "$JARS" ]; then
            echo 'No resolved Minecraft cache jar found for API probe'
            exit 0
          fi
          printf '%s\n' "$JARS" | while IFS= read -r jar; do
            echo "=== MINECRAFT JAR: $jar ==="
            for cls in $CLASS_NAMES; do
              if jar tf "$jar" 2>/dev/null | grep -q "$(printf '%s' "$cls" | tr '.' '/')\.class$"; then
                echo "--- $cls ---"
                javap -classpath "$jar" -public "$cls" 2>/dev/null | grep -E '(^public|TextureTarget|RenderTarget|NativeImage|Screenshot|bind|clear|resize|TextureId|grab|download|upload|blit|getMainRenderTarget)' | head -n 120 || true
              fi
            done
          done

      - name: Verify remapped artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -lh build/libs
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVHub-fabric-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          python3 tools/verify-tft-bundle.py "$JAR"
          unzip -t "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Upload SVHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVHub-Loom-remapped
          path: |
            SVHub/build/libs/SVHub-fabric-*.jar
            SVHub/build/libs/SHA256.txt
            SVHub/build/libs/fabric.mod.built.json
            SVHub/build/test-results/verifyPackagedTft/*.xml
          if-no-files-found: error

      - name: Install headless OpenGL runtime
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Download Minecraft client assets
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        run: gradle --no-daemon downloadAssets

      - name: Boot Minecraft and capture TFT scenes
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        env:
          SVHUB_VISUAL_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          # Visual smoke seeds only its known Pokemon species in-process, while
          # Cobblemon still supplies the real client models, posers and textures.
          timeout 420s xvfb-run -a -s "-screen 0 1280x720x24" gradle --no-daemon --offline runClient

      - name: Verify visual evidence
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]')
        shell: bash
        run: |
          set -euo pipefail
          echo "Screenshots:"
          find run/screenshots -maxdepth 1 -type f -name 'svhub-tft-*.png' -print
          count="$(find run/screenshots -maxdepth 1 -type f -name 'svhub-*.png' | wc -l)"
          test "$count" -eq 25
          test -f run/logs/latest.log
          for arena in monster_island gotham_rooftops sector_2814 kanto_stadium dragon_shrine distortion_rift ultra_lab ancient_ruins; do
            grep -Fq "[SVHub Visual Smoke] captured svhub-tft-$arena.png with 12 actors" run/logs/latest.log
          done
          for scenario in planning carousel augment pve pve_loot boss tactician_move; do
            grep -Fq "[SVHub Visual Smoke] captured svhub-tft-ui-$scenario.png with " run/logs/latest.log
          done
          for game in chess tower_defense tft; do
            grep -Fq "[SVHub Visual Smoke] captured svhub-result-$game.png" run/logs/latest.log
          done
          grep -Fq "[SVHub Visual Smoke] captured svhub-skin-showcase.png" run/logs/latest.log
          for scenario in arena_preview arena_owned arena_equipped tactician_preview tactician_owned tactician_equipped; do
            grep -Fq "[SVHub Visual Smoke] captured svhub-store-$scenario.png" run/logs/latest.log
          done
          python3 tools/verify-visual-smoke.py run/screenshots/svhub-*.png
          grep -Fq '[SVHub Visual Smoke] completed 25 captures; stopping client' run/logs/latest.log
          # Headless Linux may log non-fatal narrator (missing flite) and audio
          # initialization errors. The runClient task and all four framebuffer
          # captures already succeeded, so only treat actual Minecraft/render
          # crashes as visual-smoke failures.
          if grep -Eiq 'Minecraft has crashed!|ReportedException|Rendering screen|OpenGL error|Visual Smoke.*timed out' run/logs/latest.log; then
            echo 'Runtime log contains an actual crash/render error marker' >&2
            grep -Ein 'Minecraft has crashed!|ReportedException|Rendering screen|OpenGL error|Visual Smoke.*timed out' run/logs/latest.log | tail -n 80 >&2
            exit 1
          fi

      - name: Upload TFT visual smoke evidence
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[visual]'))
        uses: actions/upload-artifact@v4
        with:
          name: SVHub-TFT-visual-smoke
          path: |
            SVHub/run/screenshots/svhub-*.png
            SVHub/run/logs/latest.log
            SVHub/run/crash-reports/**
          if-no-files-found: warn
