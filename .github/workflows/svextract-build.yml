name: SVEXTRACT Fabric CI

on:
  push:
    branches:
      - build/svextract-checkpoint-20261015
    paths:
      - 'svextract/**'
      - '.github/workflows/svextract-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out SVEXTRACT source
        uses: actions/checkout@v4
      - name: Verify project source
        shell: bash
        run: |
          test -f svextract/build.gradle
          test -f svextract/settings.gradle
          test -f svextract/src/main/java/dev/svextract/SvExtract.java
          test -f svextract/src/main/java/dev/svextract/mission/MissionRuntime.java
          echo "Source file count: $(find svextract -type f | wc -l)"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Java and Gradle versions
        run: |
          java -version
          gradle --version
      - name: Run isolated gameplay engine smoke tests
        working-directory: svextract
        run: bash tools/test_core_engines.sh
      - name: Verify blueprint geometry and loot positions
        working-directory: svextract
        run: bash tools/test_map_density.sh
      - name: Compile, test, and remap Fabric mod
        working-directory: svextract
        run: gradle --no-daemon --stacktrace --console=plain clean test remapJar
      - name: Publish Fabric JAR and QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svextract-ci-results
          path: |
            svextract/build/libs/*.jar
            svextract/build/reports/tests/**
            svextract/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 14
