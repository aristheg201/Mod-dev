name: SVEXTRACT Fabric Build
on:
  workflow_dispatch:
  push:
    branches:
      - build/svextract-checkpoint-20261015
    paths:
      - 'svextract-upload.zip'
      - 'svextract/**'
      - '.github/workflows/svextract-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
      - name: Restore source archive if present
        shell: bash
        run: |
          if [ -f svextract-upload.zip ]; then
            echo "78ca14a563e0b46f94682b5c02462e78363d1c4f59fe65e4ce9bca5394a354da  svextract-upload.zip" | sha256sum -c -
            mkdir -p svextract
            unzip -qq -o svextract-upload.zip -d svextract
          fi
          test -f svextract/build.gradle || { echo "::error::SVEXTRACT source has not been uploaded to this branch"; exit 1; }
          test -f svextract/gradle/wrapper/gradle-wrapper.jar
          chmod +x svextract/gradlew
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run isolated Java engine and geometry checks
        working-directory: svextract
        run: |
          bash tools/test_core_engines.sh
          bash tools/test_map_density.sh
      - name: Build remapped Fabric JAR and tests
        working-directory: svextract
        run: ./gradlew clean test remapJar --no-daemon --stacktrace
      - name: Publish test reports and JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svextract-fabric-${{ github.run_number }}
          path: |
            svextract/build/libs/*.jar
            svextract/build/reports/tests/**
            svextract/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 14
      - name: Expand checked source into branch after successful build
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add svextract
          if ! git diff --cached --quiet; then
            git commit -m "build(svextract): restore validated source project"
            git push origin HEAD:build/svextract-checkpoint-20261015
          fi
