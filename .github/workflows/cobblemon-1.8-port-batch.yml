name: Cobblemon 1.8 remaining ports

on:
  push:
    branches:
      - port/cobblemon-1.8-addons
    paths:
      - '.github/workflows/cobblemon-1.8-port-batch.yml'
  workflow_dispatch:

jobs:
  tim-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch source
        run: git clone --depth 1 --branch 'v1.7.3/main' https://github.com/timinc-cobble/cobblemon-tim-core.git work
      - name: Port metadata/dependencies to Cobblemon 1.8
        working-directory: work
        run: |
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gradle.properties'); s=p.read_text()
          s=s.replace('modCobblemonVersion=1.7.3','modCobblemonVersion=1.8.0')
          s=s.replace('cobblemon_version=1.7.3+1.21.1','cobblemon_version=1.8.0+1.21.1')
          s=s.replace('fabric_loader_version=0.17.2','fabric_loader_version=0.19.0')
          p.write_text(s)
          PY
      - name: Build Fabric
        working-directory: work
        run: ./gradlew --no-daemon --configure-on-demand :fabric:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tim-core-cobblemon-1.8
          path: |
            work/fabric/build/libs/*.jar
            !work/fabric/build/libs/*-sources.jar
          if-no-files-found: error

