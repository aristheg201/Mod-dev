name: World Comes Alive
on:
  workflow_dispatch:
  push:
    branches:
      - feature/world-comes-alive
    paths:
      - ci/WCA_FINAL_VERIFY
permissions:
  contents: read
concurrency:
  group: wca-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: test "$(git branch --show-current)" = feature/world-comes-alive
      - name: Compile, tests and remapped jars
        run: ./gradlew verifyWorldComesAlive --console=plain
      - name: Real client runtime V2 visual QA
        env:
          WCA_QA_SEED: '414212'
          WCA_QA_SURVEY_ONLY: 'false'
        run: timeout 1500s xvfb-run -a ./gradlew runWorldComesAliveClient --console=plain
      - name: Upload WCA build jars
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WCA-Build-JARs
          path: build/libs/World-Comes-Alive*.jar
          if-no-files-found: warn
      - name: Upload WCA QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WCA-QA-Screenshots
          path: qa/**/*.png
          if-no-files-found: warn
      - name: Upload WCA QA reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WCA-QA-Reports
          path: |
            qa/**/*.json
            qa/**/*.md
            build/reports/tests/test/**
          if-no-files-found: warn
