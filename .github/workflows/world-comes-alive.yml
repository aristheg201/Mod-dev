name: World Comes Alive
on:
  workflow_dispatch:
  push:
    branches:
      - feature/world-comes-alive
    paths:
      - ci/WCA_FINAL_VERIFY
permissions:
  contents: read
concurrency:
  group: wca-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: test "$(git branch --show-current)" = feature/world-comes-alive
      - name: Compile, tests and remapped jars
        run: ./gradlew verifyWorldComesAlive --console=plain
      - name: Cache Minecraft runtime assets
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/fabric-loom/assets
          key: wca-minecraft-assets-1.21.1-v1
      - name: Prime Minecraft runtime assets with retry
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Minecraft asset download attempt $attempt/5"
            if ./gradlew downloadAssets --console=plain; then
              ok=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [ "$ok" -ne 1 ]; then
            echo "Minecraft assets could not be downloaded after 5 workflow-level attempts."
            exit 1
          fi
      - name: Real client runtime V2 visual QA
        env:
          WCA_QA_SEED: '414212'
          WCA_QA_SURVEY_ONLY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="runtime-qa-attempt-$attempt.log"
            set +e
            timeout 1500s xvfb-run -a ./gradlew runWorldComesAliveClient --console=plain 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if grep -Eqi 'Could not download|Failed download|No cached version available|Connection reset|Read timed out|Connection timed out|resources\.download\.minecraft\.net|maven\.fabricmc\.net' "$log"; then
              echo "Transient dependency/network failure during runtime startup; retrying ($attempt/3)."
              sleep $((attempt * 15))
              continue
            fi
            echo "Runtime QA failed for a non-network reason; not retrying."
            exit "$code"
          done
          echo "Runtime QA exhausted dependency/network retries."
          exit 1
      - name: Upload WCA build jars
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WCA-Build-JARs
          path: build/libs/World-Comes-Alive*.jar
          if-no-files-found: warn
      - name: Upload WCA QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WCA-QA-Screenshots
          path: qa/**/*.png
          if-no-files-found: warn
      - name: Upload WCA QA reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WCA-QA-Reports
          path: |
            qa/**/*.json
            qa/**/*.md
            build/reports/tests/test/**
          if-no-files-found: warn
