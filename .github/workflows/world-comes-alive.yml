name: World Comes Alive
on:
  push:
    branches: [feature/world-comes-alive]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wca-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: test "$(git branch --show-current)" = feature/world-comes-alive
      - run: ./gradlew verifyWorldComesAlive --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: World-Comes-Alive
          path: |
            build/libs/*.jar
            build/reports/tests/test/**
            qa/**
