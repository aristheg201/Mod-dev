name: Cobblemon World Runtime QA

on:
  push:
    branches: [feature/cobblemon-world-rpg-20261006]
    paths: [cobblemon-world/.qa-runtime-trigger]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobblemon-world-runtime-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-player-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cobblemon-world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Install actual client graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libgl1 libasound2t64 ripgrep
      - name: Build locally before launching either process
        run: |
          ./gradlew --no-daemon --stacktrace clean build
          python3 tools/check_production_data.py
          python3 tools/prepare_runtime_qa.py
      - name: Fresh non-OP production campaign and service paths
        run: timeout --signal=INT --kill-after=20s 1800s xvfb-run -a tools/run_production_qa.sh full
      - name: Real process restart and reconnect
        run: timeout --signal=INT --kill-after=20s 300s xvfb-run -a tools/run_production_qa.sh restart
      - name: Missing BEconomy fails closed
        run: timeout --signal=INT --kill-after=20s 300s xvfb-run -a tools/run_production_qa.sh noeconomy
      - name: Check actual runtime outcomes
        run: |
          rg 'CWORLD_PROD_QA_FINISHED' build/production-qa/full-server.log build/production-qa/restart-server.log build/production-qa/noeconomy-server.log
          ! rg 'CWORLD_PROD_QA_FAIL' build/production-qa
          rg 'CWORLD_PROD_QA_REGISTRY_CATALOG_MATCH' build/production-qa/full-server.log
          rg 'CWORLD_PROD_QA_PASS final-encounter-real-battle' build/production-qa/full-server.log
          rg 'CWORLD_PROD_QA_PASS restart-economy-verification' build/production-qa/restart-server.log
          rg 'CWORLD_PROD_QA_PASS missing-economy-reject-purchase' build/production-qa/noeconomy-server.log
      - name: Record this run's outcome without substituting static proof
        if: always()
        env:
          CWORLD_JOB_STATUS: ${{ job.status }}
          CWORLD_COMMIT: ${{ github.sha }}
          CWORLD_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PYQA'
          import os
          from pathlib import Path
          out=Path('build/production-qa')
          out.mkdir(parents=True,exist_ok=True)
          lines=['# CobblemonWorld production runtime run', '', 'Commit: '+os.environ['CWORLD_COMMIT'], 'Run: '+os.environ['CWORLD_RUN_ID'], 'Job outcome: '+os.environ['CWORLD_JOB_STATUS'], '', 'Actual dedicated server + Minecraft client; survival non-OP fixture.']
          for mode in ['full','restart','noeconomy']:
              p=out/(mode+'-server.log')
              log=p.read_text(errors='replace') if p.exists() else ''
              status='PASS' if 'CWORLD_PROD_QA_FINISHED' in log and 'CWORLD_PROD_QA_FAIL' not in log else 'UNPROVEN / FAILED'
              lines.append(mode+': '+status)
          lines.extend(['','Campaign fixtures test transport/progression, not difficulty. Installed SVFrame integrations, real production-save migration and full multi-faction island war are UNPROVEN in this workflow.'])
          (out/'RUN_REPORT.md').write_text('\n'.join(lines)+'\n')
          PYQA
      - name: Upload real screenshots, raw logs and build evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobblemon-world-production-qa-${{ github.sha }}
          path: |
            cobblemon-world/build/libs/*.jar
            cobblemon-world/build/production-qa/**
            cobblemon-world/build/test-results/**
            cobblemon-world/qa-runtime/client/screenshots/*.png
            cobblemon-world/qa-runtime/server/qa-runtime/catalog-registry-audit.txt
            cobblemon-world/qa-runtime/server/CWorldQA/cobblemonworld/*.json
          if-no-files-found: warn
