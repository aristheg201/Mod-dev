name: ProtectYourPack static audit

on:
  workflow_dispatch:
  push:
    branches:
      - ProtectYourPack
    paths:
      - ProtectYourPack-1.2.1.jar
      - .github/workflows/pyp-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect and decompile ProtectYourPack
        shell: bash
        run: |
          set -euo pipefail
          JAR="ProtectYourPack-1.2.1.jar"
          WORK="${RUNNER_TEMP}/pyp-audit"
          DECOMP="${WORK}/decompiled"
          REPORT="audit/ProtectYourPack-audit.txt"
          HOT="audit/ProtectYourPack-hotpaths.txt"
          mkdir -p "$WORK" "$DECOMP" audit
          : > "$REPORT"
          : > "$HOT"

          section() {
            printf '\n===== %s =====\n' "$1" >> "$REPORT"
          }

          section "FILE"
          ls -lh "$JAR" >> "$REPORT"
          sha256sum "$JAR" >> "$REPORT"

          section "FABRIC MOD METADATA"
          unzip -p "$JAR" fabric.mod.json >> "$REPORT" 2>/dev/null || echo 'fabric.mod.json not found' >> "$REPORT"

          section "MANIFEST"
          unzip -p "$JAR" META-INF/MANIFEST.MF >> "$REPORT" 2>/dev/null || true

          section "MIXIN / ACCESS WIDENER RESOURCES"
          mapfile -t RESOURCES < <(jar tf "$JAR" | grep -Ei '(mixin.*\.json$|mixins.*\.json$|\.accesswidener$)' || true)
          printf '%s\n' "${RESOURCES[@]}" >> "$REPORT"
          for f in "${RESOURCES[@]}"; do
            [ -n "$f" ] || continue
            printf '\n--- %s ---\n' "$f" >> "$REPORT"
            unzip -p "$JAR" "$f" >> "$REPORT" 2>/dev/null || true
          done

          section "CLASS LIST"
          jar tf "$JAR" | grep '\.class$' | sort >> "$REPORT"

          curl -fL --retry 3 --retry-delay 2 -o "$WORK/cfr.jar" 'https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar'
          java -jar "$WORK/cfr.jar" "$JAR" --outputdir "$DECOMP" --silent true --caseinsensitivefs true

          section "DECOMPILED FILE LIST"
          find "$DECOMP" -type f -name '*.java' -print | sed "s#${DECOMP}/##" | sort >> "$REPORT"

          PATTERN='ClientTickEvents|ServerTickEvents|END_CLIENT_TICK|END_SERVER_TICK|START_CLIENT_TICK|START_SERVER_TICK|Files\.|File\(|File\.|listFiles\(|Files\.walk|Files\.list|readAllBytes|readString|writeString|MessageDigest|SHA-1|SHA-256|ZipFile|JarFile|WatchService|ScheduledExecutor|scheduleAtFixedRate|scheduleWithFixedDelay|TimerTask|CompletableFuture|\.join\(|\.get\(|Thread\.sleep|new Thread|ExecutorService|ResourceReload|ReloadListener|registerReloadListener|send\(|sendPacket|ClientPlayNetworking|ServerPlayNetworking|stream\(\)|\.stream\(|collect\(|Collectors\.|Pattern\.compile|System\.gc|LOGGER\.(info|warn|error|debug|trace)'

          section "PERFORMANCE-SENSITIVE REFERENCES"
          grep -RInE "$PATTERN" "$DECOMP" | sed "s#${DECOMP}/##" >> "$REPORT" || true

          section "SUSPECT CONTEXT"
          mapfile -t SUSPECTS < <(grep -RIlE "$PATTERN" "$DECOMP" | sort -u || true)
          for f in "${SUSPECTS[@]}"; do
            [ -n "$f" ] || continue
            rel="${f#${DECOMP}/}"
            printf '\n##### %s #####\n' "$rel" >> "$REPORT"
            grep -nE -B 6 -A 10 "$PATTERN" "$f" >> "$REPORT" || true
          done

          section "ENTRYPOINT / EVENT REGISTRATION REFERENCES"
          grep -RInE 'implements (ModInitializer|ClientModInitializer)|onInitialize\(|onInitializeClient\(|register\(|EVENT|Tick|JOIN|DISCONNECT|RESOURCE|Reload' "$DECOMP" | sed "s#${DECOMP}/##" >> "$REPORT" || true

          section "TOP API COUNTS"
          for token in 'Files.' 'MessageDigest' 'ZipFile' 'JarFile' 'Tick' 'CompletableFuture' 'Executor' 'send(' 'stream()' 'LOGGER.'; do
            count=$(grep -RIF "$token" "$DECOMP" | wc -l || true)
            printf '%-24s %s\n' "$token" "$count" >> "$REPORT"
          done

          printf 'Focused hotpath excerpts from ProtectYourPack-1.2.1.jar\n' >> "$HOT"
          for rel in \
            com/svframe/pyp/ProtectYourPack.java \
            com/svframe/pyp/PackDelayGate.java \
            com/svframe/pyp/EasyAuthBridge.java \
            com/svframe/pyp/BetterServerPacksBridge.java \
            com/svframe/pyp/PypBuildWorkerX.java \
            com/svframe/pyp/R2DeliveryService.java \
            com/svframe/pyp/PackSquashRunner.java \
            com/svframe/pyp/PackSourcePreparer.java; do
            f="$DECOMP/$rel"
            [ -f "$f" ] || continue
            printf '\n===== %s =====\n' "$rel" >> "$HOT"
            nl -ba "$f" | sed -n '1,460p' >> "$HOT"
          done

          section "AUDIT COMPLETE"
          echo 'Static report generated from ProtectYourPack-1.2.1.jar.' >> "$REPORT"

      - name: Commit audit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/ProtectYourPack-audit.txt audit/ProtectYourPack-hotpaths.txt
          if git diff --cached --quiet; then
            echo 'Audit reports unchanged.'
            exit 0
          fi
          git commit -m 'chore: update ProtectYourPack audit reports [skip ci]'
          git push origin HEAD:ProtectYourPack
