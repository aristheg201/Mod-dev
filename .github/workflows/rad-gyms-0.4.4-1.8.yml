name: Rad Gyms 0.4.4 Cobblemon 1.8

on:
  push:
    branches:
      - port/cobblemon-1.8-addons
    paths:
      - '.github/workflows/rad-gyms-0.4.4-1.8.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact 0.4.4 source
        run: |
          git init work
          cd work
          git remote add origin https://github.com/gitoido-mc/rad-gyms.git
          git fetch --depth 1 origin 01128c48c111ddfbd67fc56e70ebe92ad05d2aaf
          git checkout FETCH_HEAD
      - name: Apply Cobblemon 1.8 port
        working-directory: work
        run: |
          chmod +x gradlew
          python3 - <<'PY'
          from pathlib import Path

          p=Path('gradle.properties'); s=p.read_text()
          s=s.replace('fabric_loader_version=0.17.2','fabric_loader_version=0.19.0')
          s=s.replace('cobblemon_version=1.7.3','cobblemon_version=1.8.0')
          p.write_text(s)

          p=Path('build.gradle.kts'); s=p.read_text()
          s=s.replace('version = scmVersion.version', 'version = "0.4.4+1.8-port.1"')
          s=s.replace('maven("https://maven.internal.gito.lol/releases/")', 'maven("https://maven.fabricmc.net/")')
          p.write_text(s)

          p=Path('common/build.gradle.kts'); s=p.read_text()
          s=s.replace('modImplementation("com.cobblemon:mod:${property("cobblemon_version")}+${property("minecraft_version")}") {', 'modImplementation("maven.modrinth:MdwFAVRL:YgmyyFcs") {')
          p.write_text(s)

          p=Path('fabric/build.gradle.kts'); s=p.read_text()
          s=s.replace('modImplementation("com.cobblemon:fabric:${property("cobblemon_version")}+${property("minecraft_version")}") {', 'modImplementation("maven.modrinth:MdwFAVRL:YgmyyFcs") {')
          p.write_text(s)

          p=Path('fabric/src/main/resources/fabric.mod.json'); s=p.read_text()
          s=s.replace('"fabricloader": ">=0.17.2"', '"fabricloader": ">=0.19.0"')
          s=s.replace('"cobblemon": ">=${cobblemon_version}+1.21.1 <1.8.0+1.21.1"','"cobblemon": ">=${cobblemon_version}+1.21.1 <1.9.0+1.21.1"')
          p.write_text(s)

          p=Path('fabric/src/main/kotlin/lol/gito/radgyms/fabric/datagen/provider/RecipeProvider.kt')
          s=p.read_text()
          s=s.replace('import com.cobblemon.mod.common.item.CobblemonItem\n', '')
          s=s.replace('Pair<GymKey, CobblemonItem>', 'Pair<GymKey, Item>')
          s=s.replace('Pair<PokeCache, CobblemonItem>', 'Pair<PokeCache, Item>')
          s=s.replace('Pair<PokeCache, Item> =\n        when (type) {', 'Pair<PokeCache, Item> = when (type) {')
          p.write_text(s)
          PY
      - name: Build Fabric
        working-directory: work
        run: ./gradlew --no-daemon --configure-on-demand :fabric:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rad-gyms-0.4.4-cobblemon-1.8
          path: |
            work/fabric/build/libs/*.jar
            !work/fabric/build/libs/*-sources.jar
            !work/fabric/build/libs/*-dev-*.jar
          if-no-files-found: error
