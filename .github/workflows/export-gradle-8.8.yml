name: Export Gradle 8.8

on:
  workflow_dispatch:
  push:
    branches:
      - feature/fabric-mmo-ports
    paths:
      - '.github/workflows/export-gradle-8.8.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Pack Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN="$(command -v gradle)"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          mkdir -p build
          tar -czf build/gradle-8.8-linux.tar.gz -C "$GRADLE_HOME" .
          test -s build/gradle-8.8-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-8.8-linux
          path: build/gradle-8.8-linux.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
