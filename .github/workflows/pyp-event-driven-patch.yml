name: ProtectYourPack event-driven patch

on:
  push:
    branches:
      - ProtectYourPack
    paths:
      - .github/workflows/pyp-event-driven-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile scheduler and bytecode patcher
        shell: bash
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/pyp-event-patch"
          mkdir -p "$WORK/helper" "$WORK/patcher" "$WORK/lib"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$WORK/lib/asm.jar" \
            'https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar'
          curl -fL --retry 3 --retry-delay 2 \
            -o "$WORK/lib/asm-tree.jar" \
            'https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar'

          javac --release 21 \
            -d "$WORK/helper" \
            tools/pyp-event-patch/PypEventScheduler.java

          javac --release 21 \
            -cp "$WORK/lib/asm.jar:$WORK/lib/asm-tree.jar" \
            -d "$WORK/patcher" \
            tools/pyp-event-patch/PatchPyp.java

      - name: Patch ProtectYourPack jar
        shell: bash
        run: |
          set -euo pipefail
          JAR='ProtectYourPack-1.2.1.jar'
          WORK="${RUNNER_TEMP}/pyp-event-patch"
          PATCHED="$WORK/ProtectYourPack-1.2.1.patched.jar"
          BEFORE="$WORK/before.sha256"

          sha256sum "$JAR" | tee "$BEFORE"

          java -cp "$WORK/patcher:$WORK/lib/asm.jar:$WORK/lib/asm-tree.jar" \
            PatchPyp "$JAR" "$PATCHED"

          jar uf "$PATCHED" -C "$WORK/helper" com/svframe/pyp/runtime
          mv "$PATCHED" "$JAR"
          unzip -tq "$JAR"

      - name: Verify event-driven hooks and retained delay gate
        shell: bash
        run: |
          set -euo pipefail
          JAR='ProtectYourPack-1.2.1.jar'
          REPORT='audit/ProtectYourPack-event-driven-verify.txt'
          WORK="${RUNNER_TEMP}/pyp-event-patch"
          mkdir -p audit

          PROTECT="$WORK/ProtectYourPack.javap.txt"
          AUTH="$WORK/EasyAuthServerPlayer.javap.txt"
          GATE="$WORK/PackDelayGate.javap.txt"
          HELPER="$WORK/PypEventScheduler.javap.txt"

          javap -classpath "$JAR" -p -c com.svframe.pyp.ProtectYourPack > "$PROTECT"
          javap -classpath "$JAR" -p -c xyz.nikitacartes.easyauth.mixin.ServerPlayerEntityMixin > "$AUTH"
          javap -classpath "$JAR" -p -c com.svframe.pyp.PackDelayGate > "$GATE"
          javap -classpath "$JAR" -p -c com.svframe.pyp.runtime.PypEventScheduler > "$HELPER"

          if grep -q 'ServerTickEvents.END_SERVER_TICK' "$PROTECT"; then
            echo 'ERROR: END_SERVER_TICK registration still exists' >&2
            exit 1
          fi

          grep -q 'PypEventScheduler.onJoin' "$PROTECT"
          grep -q 'PypEventScheduler.onDisconnect' "$PROTECT"
          grep -q 'PypEventScheduler.onConfigReload' "$PROTECT"
          grep -q 'PypEventScheduler.shutdown' "$PROTECT"
          grep -q 'PypEventScheduler.onAuthChanged' "$AUTH"
          grep -q 'java/util/concurrent/ScheduledThreadPoolExecutor' "$HELPER"
          grep -q 'PackDelayGate.tick' "$HELPER"
          grep -q 'java/lang/Math.max' "$GATE"

          {
            echo 'ProtectYourPack event-driven auth-delay patch verification'
            echo
            echo '===== SHA256 BEFORE ====='
            cat "$WORK/before.sha256"
            echo
            echo '===== SHA256 AFTER ====='
            sha256sum "$JAR"
            echo
            echo '===== REQUIRED CONDITIONS ====='
            echo 'PASS: END_SERVER_TICK registration removed from ProtectYourPack.onInitialize'
            echo 'PASS: JOIN -> PypEventScheduler.onJoin hook present'
            echo 'PASS: DISCONNECT -> PypEventScheduler.onDisconnect hook present'
            echo 'PASS: config reload -> scheduler reschedule hook present'
            echo 'PASS: server shutdown -> scheduler shutdown hook present'
            echo 'PASS: EasyAuth easyAuth$setAuthenticated(boolean) -> auth transition hook present'
            echo 'PASS: one shared ScheduledThreadPoolExecutor is embedded'
            echo 'PASS: PackDelayGate.tick remains callable only from sparse scheduled deadlines/retries'
            echo 'PASS: original PackDelayGate Math.max(join deadline, auth deadline) logic remains in jar'
            echo
            echo '===== SCHEDULER CLASSES ====='
            jar tf "$JAR" | grep '^com/svframe/pyp/runtime/PypEventScheduler' | sort
            echo
            echo '===== ProtectYourPack javap ====='
            cat "$PROTECT"
            echo
            echo '===== EasyAuth ServerPlayerEntityMixin auth hook excerpt ====='
            grep -n -A 90 -B 20 'easyAuth.setAuthenticated' "$AUTH" || cat "$AUTH"
            echo
            echo '===== PackDelayGate deadline formula excerpt ====='
            grep -n -A 80 -B 20 'Math.max' "$GATE" || true
          } > "$REPORT"

      - name: Commit patched jar and verification report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProtectYourPack-1.2.1.jar audit/ProtectYourPack-event-driven-verify.txt
          if git diff --cached --quiet; then
            echo 'Patched artifact already current.'
            exit 0
          fi
          git commit -m 'perf: make ProtectYourPack auth delay event-driven [skip ci]'
          git push origin HEAD:ProtectYourPack
