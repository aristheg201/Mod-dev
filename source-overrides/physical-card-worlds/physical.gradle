// Isolated real-client QA driver; never bundled into the production mod.
def physicalLoom = tasks.named('remapJar').get().getClass().classLoader
sourceSets {
    physicalQa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('physicalQaJar', Jar) {
    dependsOn tasks.named('physicalQaClasses')
    archiveClassifier = 'physical-qa-driver-dev'
    from sourceSets.physicalQa.output
}
tasks.register('remapPhysicalQaJar', physicalLoom.loadClass('net.fabricmc.loom.task.RemapJarTask')) {
    dependsOn tasks.named('physicalQaJar')
    inputFile = tasks.named('physicalQaJar').flatMap { it.archiveFile }
    archiveClassifier = 'physical-qa-driver'
}
apply from: 'source-overrides/duel-realm/production-visual/qa/focused.gradle'
tasks.register('runPhysicalCardWorldsClient', physicalLoom.loadClass('net.fabricmc.loom.task.prod.ClientProductionRunTask')) {
    dependsOn tasks.named('remapJar'), tasks.named('remapPhysicalQaJar')
    mods.setFrom(configurations.focusedClientRuntimeMods,
        tasks.named('remapJar').flatMap { it.archiveFile },
        tasks.named('remapPhysicalQaJar').flatMap { it.archiveFile })
    programArgs.addAll(['--width', '1280', '--height', '720'])
    jvmArgs.add('-Dcardworlds.qa.physical=true')
    runDir = file('run-physical-visual')
    useXVFB = !project.hasProperty('physicalNoXvfb')
}
